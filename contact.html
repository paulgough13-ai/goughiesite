<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Inter:wght@300;400&display=swap" rel="stylesheet">
  <link rel="icon" href="favicon.ico?v=5" sizes="32x32">
  <link rel="icon" href="favicon.svg?v=5" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=5">
  <link rel="stylesheet" href="css/style.css?v=5">
  <title>Contact</title>
  <script data-goatcounter="https://goughie.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
</head>
<body data-page="contact">
  <main class="section page-top">
    <div class="contact">
      <div class="contact-details reveal">
        <p class="eyebrow">Contact</p>
        <h1 class="section-title">Get in touch</h1>
        <p>For print sales, image licensing, or just to talk diving — send a message and I'll reply by email.</p>
        <p>More of my work on <a data-instagram target="_blank" rel="noopener">Instagram @paulgoughie</a>.</p>
      </div>
      <form class="form reveal">
        <label>Name <input name="name" required></label>
        <label>Email <input name="email" type="email" required></label>
        <label>Topic
          <select name="topic">
            <option>Print enquiry</option>
            <option>Image licensing</option>
            <option>General</option>
          </select>
        </label>
        <label>Message <textarea name="message" required></textarea></label>
        <input type="checkbox" name="botcheck" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
        <button class="btn" type="submit">Send message</button>
        <p class="form-status" role="status" aria-live="polite"></p>
      </form>
    </div>
  </main>
  <script src="js/photos.js?v=5"></script>
  <script src="js/main.js?v=5"></script>
</body>
</html>
