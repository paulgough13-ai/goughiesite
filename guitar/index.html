<script type="application/json" id="site-data">{"weeks": [{"num": 1, "title": "Posture, technique, tuning, tab and the metronome", "phase": 1, "obj": "set up habits that will not hold you back later, and start learning the notes on the neck.", "lesson": [["Key concepts", "<ul>\n<li><strong>Posture.<\/strong> Sit upright, guitar body resting on your leg, neck angled slightly upward. Shoulders loose. If your fretting wrist is sharply bent, raise the neck.<\/li>\n<li><strong>Fretting hand.<\/strong> Thumb behind the neck, roughly behind your middle finger. Press with the fingertips, just behind the fret wire, not on top of it or in the middle of the fret. Use the least pressure that gives a clean note.<\/li>\n<li><strong>Picking hand.<\/strong> Hold the pick between the side of your index finger and the pad of your thumb, with only a few millimetres showing. Move from the wrist, not the elbow.<\/li>\n<li><strong>Tuning.<\/strong> Standard tuning is E A D G B E, low to high. Use a clip-on or app tuner, always tuning up to the note rather than down.<\/li>\n<li><strong>The musical alphabet.<\/strong> A B C D E F G, then back to A. Every pair has a sharp or flat between them <strong>except B to C and E to F<\/strong>. One fret equals one semitone.<\/li>\n<li><strong>The metronome.<\/strong> BPM means beats per minute. Start every exercise slower than you think you need.<\/li>\n<\/ul>"], ["Exercises", "<p><strong>1. Chromatic warm-up.<\/strong> One finger per fret (index on fret 1, middle on 2, ring on 3, little finger on 4). Alternate pick: down, up, down, up.<\/p>\n<pre><code>e|-----------------------------------------------1-2-3-4-|\nB|---------------------------------------1-2-3-4---------|\nG|-------------------------------1-2-3-4-----------------|\nD|-----------------------1-2-3-4-------------------------|\nA|---------------1-2-3-4---------------------------------|\nE|-------1-2-3-4-----------------------------------------|\n<\/code><\/pre>\n<p>Start at 50 BPM, one note per click. Target: clean at 60 BPM.<\/p>\n<p><strong>2. Notes on the low E string.<\/strong> E (open), F (1), G (3), A (5), B (7), C (8), D (10), E (12). Fill in the sharps between them (F# at 2, G# at 4 and so on).<\/p>\n<p><strong>3. Notes on the A string.<\/strong> A (open), B (2), C (3), D (5), E (7), F (8), G (10), A (12).<\/p>\n<p><strong>4. Note-finding drill.<\/strong> Set the metronome to 40 BPM. Say a random note, find it on the E string on the next click, then on the A string on the click after that.<\/p>\n<p><strong>5. Tab reading.<\/strong> Find a simple melody in tab (a nursery rhyme or a riff you like) and play it slowly.<\/p>"], ["Watch out for", "<ul>\n<li>Thumb wrapped over the top of the neck during exercises (fine for some chords later, not for this).<\/li>\n<li>Fingers flying far off the fretboard between notes. Keep them hovering close.<\/li>\n<li>Gripping the neck hard. If your hand aches after 10 minutes, ease off.<\/li>\n<\/ul>"]], "days": [["Days 1 to 2", "posture, fretting and picking check in a mirror; tuning; chromatic exercise at 50 BPM."], ["Days 3 to 4", "low E string notes; note-finding drill on one string."], ["Days 5 to 6", "add the A string; tab melody; push the chromatic exercise to 60 BPM."]], "sunday": "Film your chromatic exercise at your best clean tempo, then name 10 random notes on the E and A strings on camera. This is your baseline clip for the whole year. Keep it.", "boards": [{"type": "notes", "title": "Natural notes on the low E and A strings", "notes": [[6, 0], [6, 1], [6, 3], [6, 5], [6, 7], [6, 8], [6, 10], [6, 12], [5, 0], [5, 2], [5, 3], [5, 5], [5, 7], [5, 8], [5, 10], [5, 12]], "root": null, "frets": [0, 12], "cap": "No sharp or flat between B and C, or between E and F. Fret 12 repeats the open note.", "flats": false, "hlpos": []}, {"type": "notes", "title": "Chromatic warm-up, one finger per fret", "notes": [[6, 1, "1"], [6, 2, "2"], [6, 3, "3"], [6, 4, "4"], [5, 1, "1"], [5, 2, "2"], [5, 3, "3"], [5, 4, "4"], [4, 1, "1"], [4, 2, "2"], [4, 3, "3"], [4, 4, "4"], [3, 1, "1"], [3, 2, "2"], [3, 3, "3"], [3, 4, "4"], [2, 1, "1"], [2, 2, "2"], [2, 3, "3"], [2, 4, "4"], [1, 1, "1"], [1, 2, "2"], [1, 3, "3"], [1, 4, "4"]], "root": null, "frets": [0, 5], "cap": "Switch to Fingers to see which finger plays each fret.", "flats": false, "hlpos": []}], "goal": "Name every note on the low E and A strings; chromatic exercise clean at 60 BPM", "ex": ["Chromatic warm-up", "Notes on the low E string", "Notes on the A string", "Note-finding drill", "Tab reading"], "bt": [], "drone": null}, {"num": 2, "title": "Open chords and clean changes", "phase": 1, "obj": "play the core open chords cleanly and change between them in time.", "lesson": [["Key concepts", "<p>The seven chord shapes (low E to high e):<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Chord<\/th>\n<th>Shape<\/th>\n<th>Notes<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>G<\/td>\n<td>320003<\/td>\n<td>Some players use 320033; either is fine<\/td>\n<\/tr>\n<tr>\n<td>C<\/td>\n<td>x32010<\/td>\n<td>Avoid hitting the low E<\/td>\n<\/tr>\n<tr>\n<td>D<\/td>\n<td>xx0232<\/td>\n<td>Play only the top four strings<\/td>\n<\/tr>\n<tr>\n<td>Em<\/td>\n<td>022000<\/td>\n<td>The easiest chord on the guitar<\/td>\n<\/tr>\n<tr>\n<td>Am<\/td>\n<td>x02210<\/td>\n<td>Same shape as E, moved over one string<\/td>\n<\/tr>\n<tr>\n<td>E<\/td>\n<td>022100<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>A<\/td>\n<td>x02220<\/td>\n<td>Three fingers squeezed into one fret<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li><strong>Anchor fingers.<\/strong> Look for fingers that stay put or slide between chords. Going from Am to C, your index and middle fingers do not move at all.<\/li>\n<li><strong>Move as one unit.<\/strong> Lift all fingers together and place them together, rather than one at a time.<\/li>\n<\/ul>"], ["Exercises", "<p><strong>1. String-by-string check.<\/strong> Strum each chord, then pick each string one at a time. Any buzzing or muted string means adjust that finger.<\/p>\n<p><strong>2. One-minute changes.<\/strong> Choose two chords, set a timer for 60 seconds, and switch between them as many times as you can, strumming once per chord. Write the number down. Pairs to work on:<\/p>\n<ul>\n<li>Em to Am<\/li>\n<li>Am to C<\/li>\n<li>A to D<\/li>\n<li>E to A<\/li>\n<li>G to C<\/li>\n<li>C to D<\/li>\n<li>G to D<\/li>\n<\/ul>\n<p><strong>3. Changes in time.<\/strong> Metronome at 60 BPM. Strum each chord four times (one per click), then change with no gap. Progression: G, C, D, G. Then Em, C, G, D.<\/p>"], ["Watch out for", "<ul>\n<li>Stopping the strumming hand while the fretting hand catches up. Keep strumming even if the chord is not fully there yet; the rhythm matters more.<\/li>\n<li>Palm touching the high e string and muting it, especially on D and C.<\/li>\n<\/ul>"]], "days": [["Days 1 to 2", "learn the shapes; string-by-string checks; one-minute changes on Em, Am, E, A."], ["Days 3 to 4", "add G, C and D; one-minute changes on every pair."], ["Days 5 to 6", "changes in time; play through a simple song using these chords."]], "sunday": "Record a one-minute change on your two weakest chords, then play G, C, D, G four times through in time at 60 BPM.", "boards": [{"type": "chord", "title": "G", "notes": [[6, 3], [5, 2], [4, 0], [3, 0], [2, 0], [1, 3]], "muted": [], "root": "G", "cap": null, "flats": false}, {"type": "chord", "title": "C", "notes": [[5, 3], [4, 2], [3, 0], [2, 1], [1, 0]], "muted": [6], "root": "C", "cap": null, "flats": false}, {"type": "chord", "title": "D", "notes": [[4, 0], [3, 2], [2, 3], [1, 2]], "muted": [6, 5], "root": "D", "cap": null, "flats": false}, {"type": "chord", "title": "Em", "notes": [[6, 0], [5, 2], [4, 2], [3, 0], [2, 0], [1, 0]], "muted": [], "root": "E", "cap": null, "flats": false}, {"type": "chord", "title": "Am", "notes": [[5, 0], [4, 2], [3, 2], [2, 1], [1, 0]], "muted": [6], "root": "A", "cap": null, "flats": false}, {"type": "chord", "title": "E", "notes": [[6, 0], [5, 2], [4, 2], [3, 1], [2, 0], [1, 0]], "muted": [], "root": "E", "cap": null, "flats": false}, {"type": "chord", "title": "A", "notes": [[5, 0], [4, 2], [3, 2], [2, 2], [1, 0]], "muted": [6], "root": "A", "cap": null, "flats": false}], "goal": "40 clean chord changes per minute between any two chords", "ex": ["String-by-string check", "One-minute changes", "Changes in time"], "bt": ["g-cdg"], "drone": null}, {"num": 3, "title": "Strumming, slash chords and power chords", "phase": 1, "obj": "strum with a steady, relaxed motion, and add slash chords and power chords to your vocabulary.", "lesson": [["Key concepts", "<ul>\n<li><strong>The constant motion rule.<\/strong> Your strumming hand moves down and up continuously in eighth notes, like a pendulum. Downstrokes land on the beat (1, 2, 3, 4), upstrokes on the \"and\". To create a pattern, you simply miss the strings on some strokes rather than stopping the hand.<\/li>\n<li><strong>Slash chords.<\/strong> Written as Chord/Bass, for example G/B means a G chord with B as the lowest note. They create smooth moving bass lines.<\/li>\n<\/ul>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Slash chord<\/th>\n<th>Shape<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>G/B<\/td>\n<td>x20003<\/td>\n<\/tr>\n<tr>\n<td>C/G<\/td>\n<td>332010<\/td>\n<\/tr>\n<tr>\n<td>D/F#<\/td>\n<td>200232 (thumb on F#, or index finger)<\/td>\n<\/tr>\n<tr>\n<td>C/B<\/td>\n<td>x20010<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li><strong>Power chords.<\/strong> Root and fifth only, so they are neither major nor minor. Great with distortion. The shape is movable: the lowest note names the chord.<\/li>\n<\/ul>\n<pre><code>     G5 (root on E)    C5 (root on A)\ne|--------------------|-----------------|\nB|--------------------|-----------------|\nG|--------------------|-------5---------|\nD|-------5------------|-------5---------|\nA|-------5------------|-------3---------|\nE|-------3------------|-----------------|\n<\/code><\/pre>"], ["Exercises", "<p><strong>1. Five levels of strumming.<\/strong> Use a G to C to D to G loop at 70 BPM. Spend a day on each level if needed.<\/p>\n<ol>\n<li>Downstrokes on each beat: D D D D<\/li>\n<li>Straight eighths: D U D U D U D U<\/li>\n<li>The common pop pattern: D, D U, U D U (counted 1, 2 &amp;, &amp; 4 &amp;)<\/li>\n<li>Accent beats 2 and 4, lightly muting the strings with the fretting hand on those beats for a \"chuck\" sound<\/li>\n<li>Sixteenth note feel at 60 BPM: D U D U on every beat, accenting the downbeats<\/li>\n<\/ol>\n<p><strong>2. Walking bass line.<\/strong> G, G/F# (2x0003), Em, then C, C/B, Am, D. Hear how the bass walks down step by step.<\/p>\n<p><strong>3. Power chord riffs.<\/strong> Move a G5 shape to frets 3, 5, 6, 3 on the low E string, two strums each. Then try palm muting: rest the side of your picking hand lightly on the strings right by the bridge.<\/p>"], ["Watch out for", "<ul>\n<li>Strumming from the elbow with a stiff wrist. The motion should feel like shaking water off your hand.<\/li>\n<li>Hitting all six strings on every chord. Aim for the strings the chord actually uses.<\/li>\n<\/ul>"]], "days": [["Days 1 to 2", "strumming levels 1 to 3."], ["Days 3 to 4", "levels 4 and 5; slash chord shapes and the walking bass line."], ["Days 5 to 6", "power chords and palm muting; play one song using three different strumming patterns."]], "sunday": "One song (anything with open chords), played three times through with a different strumming pattern each time.", "boards": [{"type": "chord", "title": "G/B", "notes": [[5, 2], [4, 0], [3, 0], [2, 0], [1, 3]], "muted": [6], "root": "G", "cap": "B in the bass", "flats": false}, {"type": "chord", "title": "C/G", "notes": [[6, 3], [5, 3], [4, 2], [3, 0], [2, 1], [1, 0]], "muted": [], "root": "C", "cap": "G in the bass", "flats": false}, {"type": "chord", "title": "D/F#", "notes": [[6, 2], [5, 0], [4, 0], [3, 2], [2, 3], [1, 2]], "muted": [], "root": "D", "cap": "F# in the bass", "flats": false}, {"type": "chord", "title": "C/B", "notes": [[5, 2], [4, 0], [3, 0], [2, 1], [1, 0]], "muted": [6], "root": "C", "cap": "Walk-down bass note", "flats": false}, {"type": "chord", "title": "G5 power chord", "notes": [[6, 3], [5, 5], [4, 5]], "muted": [3, 2, 1], "root": "G", "cap": null, "flats": false}, {"type": "chord", "title": "C5 power chord", "notes": [[5, 3], [4, 5], [3, 5]], "muted": [6, 2, 1], "root": "C", "cap": null, "flats": false}], "goal": "Play one song with three different strumming patterns in time", "ex": ["Five levels of strumming", "Walking bass line", "Power chord riffs"], "bt": ["g-cdg"], "drone": null}, {"num": 4, "title": "The major scale and how chords are built", "phase": 1, "obj": "understand the major scale, the foundation of almost all theory you will learn, and see how chords come from it.", "lesson": [["Key concepts", "<ul>\n<li><strong>The formula.<\/strong> Every major scale follows the same pattern of whole steps (W, 2 frets) and half steps (H, 1 fret): <strong>W W H W W W H<\/strong>.<\/li>\n<li><strong>C major<\/strong> has no sharps or flats: C D E F G A B C.<\/li>\n<li><strong>G major:<\/strong> G A B C D E F# G. The F# is what the formula demands.<\/li>\n<li><strong>Scale degrees.<\/strong> Number the notes 1 to 7. In C major: C=1, D=2, E=3, F=4, G=5, A=6, B=7.<\/li>\n<li><strong>Chord building.<\/strong> A major triad is degrees <strong>1, 3, 5<\/strong> of its own major scale (C E G). A minor triad lowers the third by a semitone: <strong>1, b3, 5<\/strong> (C Eb G).<\/li>\n<\/ul>"], ["Exercises", "<p><strong>1. Major scale on one string.<\/strong> Start on the A string at fret 3 (C) and climb using the W W H W W W H formula: frets 3, 5, 7, 8, 10, 12, 14, 15. Say the note names aloud.<\/p>\n<p><strong>2. G major, two octaves in one position.<\/strong><\/p>\n<pre><code>e|----------------------------------------------2-3-|\nB|-----------------------------------------3-5------|\nG|------------------------------2-4-5---------------|\nD|-------------------2-4-5--------------------------|\nA|----------2-3-5-----------------------------------|\nE|---3-5--------------------------------------------|\n<\/code><\/pre>\n<p>Notes: G A | B C D | E F# G | A B C | D E | F# G. Play up and back down at 60 BPM, one note per click, then two notes per click.<\/p>\n<p><strong>3. Spell the triads.<\/strong> On paper, write out the major and minor triads for C, G, D, A, E and F. Then find them on the guitar in open chords you know and check which string holds the 1, 3 and 5.<\/p>\n<p><strong>4. Scale in thirds.<\/strong> In G major, play G B, A C, B D, C E and so on (each note followed by the one two steps above). This trains your ear to hear chord shapes inside the scale.<\/p>"], ["Watch out for", "<ul>\n<li>Memorising patterns without saying note names. The shapes matter, but the names are what make theory useful later.<\/li>\n<\/ul>"]], "days": [["Days 1 to 2", "the formula; C major on one string; spelling C, G and D major."], ["Days 3 to 4", "G major position; spell minor triads."], ["Days 5 to 6", "G major in thirds; full triad spelling worksheet from memory."]], "sunday": "G major two octaves up and down at 60 BPM, two notes per click. Then point to the 1, 3 and 5 in your G and C open chords on camera.", "boards": [{"type": "scale", "title": "G major, two octaves in one position", "root": "G", "iv": [0, 2, 4, 5, 7, 9, 11], "frets": [2, 5], "hl": [], "cap": null, "deg": {}, "flats": false, "strings": null}, {"type": "notes", "title": "C major up the A string (W W H W W W H)", "notes": [[5, 3], [5, 5], [5, 7], [5, 8], [5, 10], [5, 12], [5, 14], [5, 15]], "root": "C", "frets": [2, 15], "cap": null, "flats": false, "hlpos": []}], "goal": "Play G major in one position; spell major and minor triads in 3 keys", "ex": ["Major scale on one string", "G major, two octaves in one position", "Spell the triads", "Scale in thirds"], "bt": [], "drone": null}, {"num": 5, "title": "Common chord progressions and the capo", "phase": 1, "obj": "learn the progressions behind thousands of songs, and use the capo to move them to any key.", "lesson": [["Key concepts", "<ul>\n<li><strong>Roman numerals<\/strong> describe a chord by its place in the key. Upper case = major, lower case = minor. In G major: I = G, ii = Am, iii = Bm, IV = C, V = D, vi = Em.<\/li>\n<li><strong>The big four:<\/strong><\/li>\n<\/ul>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Progression<\/th>\n<th>In G<\/th>\n<th>In C<\/th>\n<th>In D<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>I V vi IV<\/td>\n<td>G D Em C<\/td>\n<td>C G Am F<\/td>\n<td>D A Bm G<\/td>\n<\/tr>\n<tr>\n<td>I vi IV V<\/td>\n<td>G Em C D<\/td>\n<td>C Am F G<\/td>\n<td>D Bm G A<\/td>\n<\/tr>\n<tr>\n<td>ii V I<\/td>\n<td>Am D G<\/td>\n<td>Dm G C<\/td>\n<td>Em A D<\/td>\n<\/tr>\n<tr>\n<td>Minor i iv v (or i iv V)<\/td>\n<td>Em Am Bm (or B7)<\/td>\n<td>Am Dm Em (or E)<\/td>\n<td>Bm Em F#m (or F#)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li><strong>The capo<\/strong> raises every chord by one semitone per fret. G shapes with a capo on fret 2 sound in the key of A. This lets you use easy open shapes in any key.<\/li>\n<\/ul>"], ["Exercises", "<p><strong>1. Progression loops.<\/strong> Play each progression in G at 70 BPM using the Week 3 pop strumming pattern, four times through.<\/p>\n<p><strong>2. Transposition.<\/strong> Play I V vi IV in C and D. Where you do not know a chord yet (F or Bm), use a simplified version: F as xx3211, and Bm as xx4432.<\/p>\n<p><strong>3. Capo work.<\/strong> Play G D Em C with the capo on fret 2. Name the actual chords you are now hearing (A E F#m D). Repeat at fret 4.<\/p>\n<p><strong>4. Song spotting.<\/strong> Put on music you like and try to hear whether a song uses one of these four progressions.<\/p>"], ["Watch out for", "<ul>\n<li>Placing the capo in the middle of the fret. Put it just behind the fret wire, the same place your fingers go.<\/li>\n<\/ul>"]], "days": [["Days 1 to 2", "Roman numerals; loops in G."], ["Days 3 to 4", "transposition to C and D."], ["Days 5 to 6", "capo work and song spotting; write your own four chord progression."]], "sunday": "Play I V vi IV in G, then the same progression with the capo on fret 3, naming the key you are now in.", "boards": [{"type": "chord", "title": "G (I)", "notes": [[6, 3], [5, 2], [4, 0], [3, 0], [2, 0], [1, 3]], "muted": [], "root": "G", "cap": null, "flats": false}, {"type": "chord", "title": "D (V)", "notes": [[4, 0], [3, 2], [2, 3], [1, 2]], "muted": [6, 5], "root": "D", "cap": null, "flats": false}, {"type": "chord", "title": "Em (vi)", "notes": [[6, 0], [5, 2], [4, 2], [3, 0], [2, 0], [1, 0]], "muted": [], "root": "E", "cap": null, "flats": false}, {"type": "chord", "title": "C (IV)", "notes": [[5, 3], [4, 2], [3, 0], [2, 1], [1, 0]], "muted": [6], "root": "C", "cap": null, "flats": false}, {"type": "chord", "title": "F, simplified", "notes": [[4, 3], [3, 2], [2, 1], [1, 1]], "muted": [6, 5], "root": "F", "cap": null, "flats": false}, {"type": "chord", "title": "Bm, simplified", "notes": [[4, 4], [3, 4], [2, 3], [1, 2]], "muted": [6, 5], "root": "B", "cap": null, "flats": false}], "goal": "Play each progression in 3 keys, then with a capo at two positions", "ex": ["Progression loops", "Transposition", "Capo work", "Song spotting"], "bt": ["g-pop"], "drone": null}, {"num": 6, "title": "Hand dexterity, barre chords and muting", "phase": 1, "obj": "build finger independence and strength, play your first full barre chords cleanly, and control unwanted noise.", "lesson": [["Key concepts", "<ul>\n<li><strong>Barre chords<\/strong> use your index finger as a movable capo. The two essential shapes come from open E and open A.<\/li>\n<\/ul>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Shape<\/th>\n<th>Major<\/th>\n<th>Minor<\/th>\n<th>Root on<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>E shape<\/td>\n<td>133211 (F)<\/td>\n<td>133111 (Fm)<\/td>\n<td>Low E string<\/td>\n<\/tr>\n<tr>\n<td>A shape<\/td>\n<td>x13331 (Bb)<\/td>\n<td>x13321 (Bbm)<\/td>\n<td>A string<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Slide them up: E shape at fret 3 is G, at fret 5 is A. A shape at fret 3 is C, at fret 5 is D.<\/p>\n<ul>\n<li><strong>Barre technique.<\/strong> Roll the index finger slightly onto its bony edge (towards the headstock). Pull back with your arm a little rather than squeezing harder with the thumb.<\/li>\n<li><strong>Muting.<\/strong> Noise is any string ringing that should not. The fretting hand mutes by lightly touching strings; the picking hand mutes by resting the palm near the bridge.<\/li>\n<\/ul>"], ["Exercises", "<p><strong>1. Finger independence (one finger per fret, position 5).<\/strong> Play fingers 1 then 3, then 2 then 4, across all six strings and back. Then 1 4, 2 3, and 1 3 2 4. Metronome at 60 BPM, two notes per click.<\/p>\n<p><strong>2. Picking hand string skipping.<\/strong> Alternate pick open strings: low E, D, A, G, D, B, G, e. Keep the pick close to the strings.<\/p>\n<p><strong>3. Barre chord build.<\/strong> Place only the barre and check each string. Add one finger at a time. Strum, then pick each string to check.<\/p>\n<p><strong>4. Barre changes.<\/strong> G (E shape, fret 3) to C (A shape, fret 3), four strums each at 60 BPM. Then A (E shape, fret 5) to D (A shape, fret 5).<\/p>\n<p><strong>5. Muting drill.<\/strong> Strum an E shape barre, then relax the fretting hand pressure (keep fingers touching) so all strings go silent. Alternate ringing and muted: ring on beats 1 and 3, mute on 2 and 4.<\/p>"], ["Watch out for", "<ul>\n<li>Pain in the thumb or wrist. Stop, shake out, and use less pressure. Barre chords take weeks to feel comfortable; that is normal.<\/li>\n<li>Starting at fret 1. The F barre is the hardest on the neck. Work high, then move down.<\/li>\n<\/ul>"]], "days": [["Days 1 to 2", "independence exercises; barre build at fret 5 (easier than fret 1)."], ["Days 3 to 4", "E and A shape majors and minors at frets 3, 5 and 7."], ["Days 5 to 6", "barre changes in time; muting drill; play I V vi IV in A with barre chords (A, E, F#m, D)."]], "sunday": "Play A, E, F#m, D using only barre chords, four strums each at 60 BPM, with no buzzing.", "boards": [{"type": "chord", "title": "F, E shape barre", "notes": [[6, 1], [5, 3], [4, 3], [3, 2], [2, 1], [1, 1]], "muted": [], "root": "F", "cap": null, "flats": false}, {"type": "chord", "title": "Fm, E shape barre", "notes": [[6, 1], [5, 3], [4, 3], [3, 1], [2, 1], [1, 1]], "muted": [], "root": "F", "cap": null, "flats": true}, {"type": "chord", "title": "Bb, A shape barre", "notes": [[5, 1], [4, 3], [3, 3], [2, 3], [1, 1]], "muted": [6], "root": "Bb", "cap": null, "flats": true}, {"type": "chord", "title": "Bbm, A shape barre", "notes": [[5, 1], [4, 3], [3, 3], [2, 2], [1, 1]], "muted": [6], "root": "Bb", "cap": null, "flats": true}, {"type": "chord", "title": "G, E shape at fret 3", "notes": [[6, 3], [5, 5], [4, 5], [3, 4], [2, 3], [1, 3]], "muted": [], "root": "G", "cap": null, "flats": false}, {"type": "chord", "title": "C, A shape at fret 3", "notes": [[5, 3], [4, 5], [3, 5], [2, 5], [1, 3]], "muted": [6], "root": "C", "cap": null, "flats": false}], "goal": "Switch between E and A shape barre chords at 60 BPM with no buzz", "ex": ["Finger independence (one finger per fret, position 5)", "Picking hand string skipping", "Barre chord build", "Barre changes", "Muting drill"], "bt": ["a-e-fsm-d"], "drone": null}, {"num": 7, "title": "Keys, the relative minor and the circle of fifths", "phase": 1, "obj": "know which chords belong to any major key, and understand how keys relate to each other.", "lesson": [["Key concepts", "<ul>\n<li><strong>Diatonic chords.<\/strong> Build a triad on every degree of a major scale and you always get the same pattern: <strong>I ii iii IV V vi vii°<\/strong> (major, minor, minor, major, major, minor, diminished).<\/li>\n<li><strong>Relative minor.<\/strong> The vi chord's scale uses the same notes as the major scale. C major and A minor share all seven notes. Every major key has a relative minor, a minor third (3 frets) below it.<\/li>\n<li><strong>The circle of fifths.<\/strong> Going up a fifth each time: C, G, D, A, E, B, F#, then Db, Ab, Eb, Bb, F, and back to C. Each step clockwise adds one sharp; each step anticlockwise adds one flat.<\/li>\n<li><strong>Order of sharps:<\/strong> F C G D A E B. Order of flats: B E A D G C F.<\/li>\n<\/ul>"], ["Exercises", "<p><strong>1. Chord chart from memory.<\/strong> Write out the seven diatonic chords for C, G, D, A, E and F. Check against this table:<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Key<\/th>\n<th>I<\/th>\n<th>ii<\/th>\n<th>iii<\/th>\n<th>IV<\/th>\n<th>V<\/th>\n<th>vi<\/th>\n<th>vii°<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>C<\/td>\n<td>C<\/td>\n<td>Dm<\/td>\n<td>Em<\/td>\n<td>F<\/td>\n<td>G<\/td>\n<td>Am<\/td>\n<td>B°<\/td>\n<\/tr>\n<tr>\n<td>G<\/td>\n<td>G<\/td>\n<td>Am<\/td>\n<td>Bm<\/td>\n<td>C<\/td>\n<td>D<\/td>\n<td>Em<\/td>\n<td>F#°<\/td>\n<\/tr>\n<tr>\n<td>D<\/td>\n<td>D<\/td>\n<td>Em<\/td>\n<td>F#m<\/td>\n<td>G<\/td>\n<td>A<\/td>\n<td>Bm<\/td>\n<td>C#°<\/td>\n<\/tr>\n<tr>\n<td>A<\/td>\n<td>A<\/td>\n<td>Bm<\/td>\n<td>C#m<\/td>\n<td>D<\/td>\n<td>E<\/td>\n<td>F#m<\/td>\n<td>G#°<\/td>\n<\/tr>\n<tr>\n<td>E<\/td>\n<td>E<\/td>\n<td>F#m<\/td>\n<td>G#m<\/td>\n<td>A<\/td>\n<td>B<\/td>\n<td>C#m<\/td>\n<td>D#°<\/td>\n<\/tr>\n<tr>\n<td>F<\/td>\n<td>F<\/td>\n<td>Gm<\/td>\n<td>Am<\/td>\n<td>Bb<\/td>\n<td>C<\/td>\n<td>Dm<\/td>\n<td>E°<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>2. Play every key.<\/strong> Using barre chords, play I IV V vi in each of the six keys above.<\/p>\n<p><strong>3. Relative minor pairs.<\/strong> Play C then Am, G then Em, D then Bm, A then F#m. Hear how they share a mood but shift the \"home\" feeling.<\/p>\n<p><strong>4. Circle of fifths drill.<\/strong> Draw the circle from memory each day. Then play the root notes on the low E and A strings going round the circle.<\/p>"], ["Watch out for", "<ul>\n<li>Treating this as paper-only theory. Every chart you write, play.<\/li>\n<\/ul>"]], "days": [["Days 1 to 2", "diatonic pattern; charts for C, G, D."], ["Days 3 to 4", "A, E, F; relative minors."], ["Days 5 to 6", "circle of fifths from memory; quick-fire quiz (have someone call a key and a numeral)."]], "sunday": "Call out three keys at random and play the I, IV, V and vi in each, naming the chords as you go.", "boards": [{"type": "scale", "title": "C major across the neck", "root": "C", "iv": [0, 2, 4, 5, 7, 9, 11], "frets": [0, 12], "hl": [], "cap": null, "deg": {}, "flats": false, "strings": null}, {"type": "scale", "title": "A minor: the same notes, a new home", "root": "A", "iv": [0, 2, 3, 5, 7, 8, 10], "frets": [0, 12], "hl": [], "cap": "Switch to Degrees and compare with C major above.", "deg": {}, "flats": false, "strings": null}], "goal": "Name the diatonic chords of any major key without looking", "ex": ["Chord chart from memory", "Play every key", "Relative minor pairs", "Circle of fifths drill"], "bt": [], "drone": null}, {"num": 8, "title": "Intervals", "phase": 1, "obj": "recognise intervals by name, by sound and by shape. Intervals are the building blocks of every melody and chord.", "lesson": [["Key concepts", "<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Semitones<\/th>\n<th>Interval<\/th>\n<th>Sound reference idea<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>Minor 2nd (m2)<\/td>\n<td>Tense, the shark-approach sound<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>Major 2nd (M2)<\/td>\n<td>The first two notes of a major scale<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>Minor 3rd (m3)<\/td>\n<td>Sad, the core of a minor chord<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>Major 3rd (M3)<\/td>\n<td>Bright, the core of a major chord<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>Perfect 4th (P4)<\/td>\n<td>Open, like a wedding march opening<\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td>Tritone<\/td>\n<td>Unstable, wants to resolve<\/td>\n<\/tr>\n<tr>\n<td>7<\/td>\n<td>Perfect 5th (P5)<\/td>\n<td>Strong and open, a power chord<\/td>\n<\/tr>\n<tr>\n<td>8<\/td>\n<td>Minor 6th (m6)<\/td>\n<td>Bittersweet<\/td>\n<\/tr>\n<tr>\n<td>9<\/td>\n<td>Major 6th (M6)<\/td>\n<td>Warm, like many folk melodies<\/td>\n<\/tr>\n<tr>\n<td>10<\/td>\n<td>Minor 7th (m7)<\/td>\n<td>Bluesy, unresolved<\/td>\n<\/tr>\n<tr>\n<td>11<\/td>\n<td>Major 7th (M7)<\/td>\n<td>Dreamy, just below the octave<\/td>\n<\/tr>\n<tr>\n<td>12<\/td>\n<td>Octave<\/td>\n<td>The same note, higher<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Find your own song references for each interval: the first two notes of tunes you already know are the best memory aids.<\/p>\n<p><strong>Shapes on the neck<\/strong> (on any string pair except G to B, where shapes shift up one fret on the higher string):<\/p>\n<ul>\n<li>Perfect 5th: one string higher, two frets up<\/li>\n<li>Perfect 4th: one string higher, same fret<\/li>\n<li>Major 3rd: one string higher, one fret down<\/li>\n<li>Octave: two strings higher, two frets up<\/li>\n<\/ul>"], ["Exercises", "<p><strong>1. Interval ladder.<\/strong> From A on the low E string (fret 5), play every interval up to the octave on the same string, naming each.<\/p>\n<p><strong>2. Sing and play.<\/strong> Play a root, sing the interval, then play it to check. Start with octave, fifth, major third and minor third.<\/p>\n<p><strong>3. Ear quiz.<\/strong> Use a free interval ear training app or website for 10 minutes a day. Start with four intervals and add more as you get 80% right.<\/p>\n<p><strong>4. Shapes across strings.<\/strong> Play each interval as a two-string shape from roots on the E, A and D strings.<\/p>"], ["Watch out for", "<ul>\n<li>Skipping the singing. It feels awkward, but it is the fastest route to connecting your ear to your fingers.<\/li>\n<\/ul>"]], "days": [["Days 1 to 2", "names and semitone counts; interval ladder."], ["Days 3 to 4", "shapes across strings; sing and play."], ["Days 5 to 6", "ear quiz daily; find a song reference for every interval."]], "sunday": "Play and name each interval from a random root, then record your ear quiz score.", "boards": [{"type": "notes", "title": "Every interval up the low E string from A", "notes": [[6, 5, "R"], [6, 6, "m2"], [6, 7, "M2"], [6, 8, "m3"], [6, 9, "M3"], [6, 10, "P4"], [6, 11, "TT"], [6, 12, "P5"], [6, 13, "m6"], [6, 14, "M6"], [6, 15, "m7"], [6, 16, "M7"], [6, 17, "8ve"]], "root": "A", "frets": [4, 17], "cap": "Switch to Fingers to see the interval names.", "flats": false, "hlpos": []}, {"type": "notes", "title": "Perfect 5th shape", "notes": [[6, 5], [5, 7]], "root": "A", "frets": [3, 8], "cap": null, "flats": false, "hlpos": []}, {"type": "notes", "title": "Perfect 4th shape", "notes": [[6, 5], [5, 5]], "root": "A", "frets": [3, 8], "cap": null, "flats": false, "hlpos": []}, {"type": "notes", "title": "Major 3rd shape", "notes": [[6, 5], [5, 4]], "root": "A", "frets": [3, 8], "cap": null, "flats": false, "hlpos": []}, {"type": "notes", "title": "Octave shape", "notes": [[6, 5], [4, 7]], "root": "A", "frets": [3, 8], "cap": null, "flats": false, "hlpos": []}], "goal": "Play and sing every interval within an octave from any root", "ex": ["Interval ladder", "Sing and play", "Ear quiz", "Shapes across strings"], "bt": [], "drone": "A"}, {"num": 9, "title": "Triads everywhere", "phase": 1, "obj": "play major, minor, diminished, augmented and suspended triads across the neck in all three inversions.", "lesson": [["Key concepts", "<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Triad<\/th>\n<th>Formula<\/th>\n<th>In C<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Major<\/td>\n<td>1 3 5<\/td>\n<td>C E G<\/td>\n<\/tr>\n<tr>\n<td>Minor<\/td>\n<td>1 b3 5<\/td>\n<td>C Eb G<\/td>\n<\/tr>\n<tr>\n<td>Diminished<\/td>\n<td>1 b3 b5<\/td>\n<td>C Eb Gb<\/td>\n<\/tr>\n<tr>\n<td>Augmented<\/td>\n<td>1 3 #5<\/td>\n<td>C E G#<\/td>\n<\/tr>\n<tr>\n<td>Sus2<\/td>\n<td>1 2 5<\/td>\n<td>C D G<\/td>\n<\/tr>\n<tr>\n<td>Sus4<\/td>\n<td>1 4 5<\/td>\n<td>C F G<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li><strong>Inversions.<\/strong> The same three notes stacked in a different order. Root position has the root lowest, first inversion has the third lowest, second inversion has the fifth lowest.<\/li>\n<\/ul>\n<p><strong>C major on the top three strings (G, B, e):<\/strong><\/p>\n<pre><code>         2nd inv   Root pos   1st inv   2nd inv\ne|--------0----------3---------8---------12------|\nB|--------1----------5---------8---------13------|\nG|--------0----------5---------9---------12------|\n         (G C E)   (C E G)    (E G C)   (G C E)\n<\/code><\/pre>"], ["Exercises", "<p><strong>1. Major triad climb.<\/strong> Play the C major shapes above up the neck and back.<\/p>\n<p><strong>2. Make it minor.<\/strong> Find the third (E) in each shape and lower it one fret to get C minor. Then raise or lower the other notes to make diminished, augmented, sus2 and sus4.<\/p>\n<p><strong>3. Move to the middle strings.<\/strong> Work out C major in all three inversions on the D, G and B strings. (Remember the B string shift.)<\/p>\n<p><strong>4. Progressions with triads only.<\/strong> Play C, Am, F, G using only top-string triads, choosing the nearest shape each time so your hand barely moves. This is called voice leading.<\/p>"], ["Watch out for", "<ul>\n<li>Memorising shapes as random finger patterns. Always know which note is the root, third and fifth.<\/li>\n<\/ul>"]], "days": [["Days 1 to 2", "formulas; C major inversions on G B e."], ["Days 3 to 4", "minor, diminished, augmented and sus variations."], ["Days 5 to 6", "D G B string set; triad-only progressions."]], "sunday": "Play C, Am, F, G on the top three strings using the closest inversions, then the same on the D G B strings.", "boards": [{"type": "notes", "title": "C major, 2nd inversion (open)", "notes": [[3, 0], [2, 1], [1, 0]], "root": "C", "frets": [0, 4], "cap": null, "flats": false, "hlpos": []}, {"type": "notes", "title": "C major, root position", "notes": [[3, 5], [2, 5], [1, 3]], "root": "C", "frets": [2, 6], "cap": null, "flats": false, "hlpos": []}, {"type": "notes", "title": "C major, 1st inversion", "notes": [[3, 9], [2, 8], [1, 8]], "root": "C", "frets": [7, 10], "cap": null, "flats": false, "hlpos": []}, {"type": "notes", "title": "C major, 2nd inversion", "notes": [[3, 12], [2, 13], [1, 12]], "root": "C", "frets": [11, 14], "cap": null, "flats": false, "hlpos": []}, {"type": "notes", "title": "C minor, root position", "notes": [[3, 5], [2, 4], [1, 3]], "root": "C", "frets": [2, 6], "cap": null, "flats": true, "hlpos": []}], "goal": "Play a G major triad in 8 places; play each triad type on the top 3 strings", "ex": ["Major triad climb", "Make it minor", "Move to the middle strings", "Progressions with triads only"], "bt": ["c-amfg"], "drone": null}, {"num": 10, "title": "7th chords and your first jazz standard", "phase": 1, "obj": "learn the four main 7th chord types and use them to play through a slow standard.", "lesson": [["Key concepts", "<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Chord<\/th>\n<th>Formula<\/th>\n<th>Sound<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Major 7 (maj7)<\/td>\n<td>1 3 5 7<\/td>\n<td>Smooth, dreamy<\/td>\n<\/tr>\n<tr>\n<td>Dominant 7 (7)<\/td>\n<td>1 3 5 b7<\/td>\n<td>Bluesy, wants to resolve<\/td>\n<\/tr>\n<tr>\n<td>Minor 7 (m7)<\/td>\n<td>1 b3 5 b7<\/td>\n<td>Mellow<\/td>\n<\/tr>\n<tr>\n<td>Half-diminished (m7b5)<\/td>\n<td>1 b3 b5 b7<\/td>\n<td>Dark, tense<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li><strong>Diatonic 7ths.<\/strong> Adding a 7th to every chord in a major key gives: Imaj7, ii7, iii7, IVmaj7, V7, vim7, viim7b5. Only the V chord is dominant.<\/li>\n<li><strong>Shell voicings<\/strong> use just the root, 3rd and 7th, the notes that define the chord. They are easy to move and sound clean.<\/li>\n<\/ul>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Chord (root G, low E string)<\/th>\n<th>Shape<\/th>\n<th>Chord (root C, A string)<\/th>\n<th>Shape<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Gmaj7<\/td>\n<td>3x44xx<\/td>\n<td>Cmaj7<\/td>\n<td>x3x45x<\/td>\n<\/tr>\n<tr>\n<td>G7<\/td>\n<td>3x34xx<\/td>\n<td>C7<\/td>\n<td>x3x35x<\/td>\n<\/tr>\n<tr>\n<td>Gm7<\/td>\n<td>3x33xx<\/td>\n<td>Cm7<\/td>\n<td>x3x34x<\/td>\n<\/tr>\n<tr>\n<td>Gm7b5<\/td>\n<td>3x332x<\/td>\n<td>Cm7b5<\/td>\n<td>x3434x<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>"], ["Exercises", "<p><strong>1. Shell shapes.<\/strong> Learn all eight shapes. Move them to other roots and name the chord.<\/p>\n<p><strong>2. ii V I in shells.<\/strong> In G major: Am7 (5x55xx), D7 (x5x57x), Gmaj7 (3x44xx). Loop at 60 BPM, two beats each.<\/p>\n<p><strong>3. A slow standard.<\/strong> Autumn Leaves (in G minor / Bb major) is a great first tune. The core changes: Cm7, F7, Bbmaj7, Ebmaj7, Am7b5, D7, Gm. Use shells, alternating between root-on-E and root-on-A shapes to stay in one area of the neck.<\/p>\n<p><strong>4. Comping rhythm.<\/strong> Instead of strumming every beat, play short stabs on beats 2 and 4, like a drummer's snare.<\/p>"], ["Watch out for", "<ul>\n<li>Letting muted strings ring. Shell voicings rely on the fretting hand fingers lightly touching the unused strings.<\/li>\n<\/ul>"]], "days": [["Days 1 to 2", "formulas; shell shapes."], ["Days 3 to 4", "ii V I loops in three keys."], ["Days 5 to 6", "Autumn Leaves changes with a play-along track; comping rhythm."]], "sunday": "Comp through the Autumn Leaves changes twice at a slow tempo, ideally over a backing track.", "boards": [{"type": "chord", "title": "Gmaj7 shell", "notes": [[6, 3], [4, 4], [3, 4]], "muted": [5, 2, 1], "root": "G", "cap": null, "flats": false}, {"type": "chord", "title": "G7 shell", "notes": [[6, 3], [4, 3], [3, 4]], "muted": [5, 2, 1], "root": "G", "cap": null, "flats": false}, {"type": "chord", "title": "Gm7 shell", "notes": [[6, 3], [4, 3], [3, 3]], "muted": [5, 2, 1], "root": "G", "cap": null, "flats": true}, {"type": "chord", "title": "Gm7b5 shell", "notes": [[6, 3], [4, 3], [3, 3], [2, 2]], "muted": [5, 1], "root": "G", "cap": null, "flats": true}, {"type": "chord", "title": "Cmaj7 shell", "notes": [[5, 3], [3, 4], [2, 5]], "muted": [6, 4, 1], "root": "C", "cap": null, "flats": false}, {"type": "chord", "title": "C7 shell", "notes": [[5, 3], [3, 3], [2, 5]], "muted": [6, 4, 1], "root": "C", "cap": null, "flats": true}, {"type": "chord", "title": "Cm7 shell", "notes": [[5, 3], [3, 3], [2, 4]], "muted": [6, 4, 1], "root": "C", "cap": null, "flats": true}, {"type": "chord", "title": "Cm7b5 shell", "notes": [[5, 3], [4, 4], [3, 3], [2, 4]], "muted": [6, 1], "root": "C", "cap": null, "flats": true}], "goal": "Comp through a slow standard (for example Autumn Leaves) in time", "ex": ["Shell shapes", "ii V I in shells", "A slow standard", "Comping rhythm"], "bt": ["autumn"], "drone": null}, {"num": 11, "title": "The CAGED system and smarter capo use", "phase": 1, "obj": "see how the five open chord shapes connect up the neck, so you can play any chord anywhere.", "lesson": [["Key concepts", "<ul>\n<li><strong>CAGED<\/strong> names the five open shapes C, A, G, E and D. Any major chord can be played using each of these shapes, and the shapes link up the neck in that order (C, then A, then G, then E, then D, then back to C an octave higher).<\/li>\n<li><strong>C major in all five shapes:<\/strong><\/li>\n<\/ul>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Shape<\/th>\n<th>Fingering<\/th>\n<th>Position<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>C shape<\/td>\n<td>x32010<\/td>\n<td>Open<\/td>\n<\/tr>\n<tr>\n<td>A shape<\/td>\n<td>x35553<\/td>\n<td>Fret 3<\/td>\n<\/tr>\n<tr>\n<td>G shape<\/td>\n<td>875558<\/td>\n<td>Fret 5 (often played as a partial shape)<\/td>\n<\/tr>\n<tr>\n<td>E shape<\/td>\n<td>8 10 10 9 8 8<\/td>\n<td>Fret 8<\/td>\n<\/tr>\n<tr>\n<td>D shape<\/td>\n<td>xx10 12 13 12<\/td>\n<td>Fret 10<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li><strong>Capo limits.<\/strong> A capo makes open shapes possible in any key, but it also cuts off the lower frets and changes the tone. Knowing CAGED means you choose the capo, rather than needing it.<\/li>\n<li><strong>Common capo positions:<\/strong> fret 2 (G shapes for A), fret 3 (G shapes for Bb, or C shapes for Eb), fret 5 (higher, bright tone for a second guitar part), fret 7 (mandolin-like sparkle).<\/li>\n<\/ul>"], ["Exercises", "<p><strong>1. Find the root.<\/strong> In each CAGED shape for C, identify every C note.<\/p>\n<p><strong>2. Shape chain.<\/strong> Play C in all five shapes up the neck and back.<\/p>\n<p><strong>3. Move to G and D.<\/strong> Work out G major and D major in all five shapes.<\/p>\n<p><strong>4. Partial shapes.<\/strong> Play only the top three or four strings of each shape; these are the shapes you will use most.<\/p>\n<p><strong>5. Capo duet.<\/strong> Record yourself playing G, C, D in open position, then play along with the same chords using C shapes with the capo on fret 7 (which also gives G, C, D). Hear how the two parts fit together.<\/p>"], ["Watch out for", "<ul>\n<li>Forcing the full G and D shapes when they are awkward. Partial shapes are the practical versions.<\/li>\n<\/ul>"]], "days": [["Days 1 to 2", "CAGED shapes for C."], ["Days 3 to 4", "G and D in all shapes; partial shapes."], ["Days 5 to 6", "capo duet; play a song you know in two different CAGED positions."]], "sunday": "Play a chord your viewer names (or pick one at random) in all five CAGED positions.", "boards": [{"type": "chord", "title": "C shape", "notes": [[5, 3], [4, 2], [3, 0], [2, 1], [1, 0]], "muted": [6], "root": "C", "cap": null, "flats": false}, {"type": "chord", "title": "A shape", "notes": [[5, 3], [4, 5], [3, 5], [2, 5], [1, 3]], "muted": [6], "root": "C", "cap": null, "flats": false}, {"type": "chord", "title": "G shape", "notes": [[6, 8], [5, 7], [4, 5], [3, 5], [2, 5], [1, 8]], "muted": [], "root": "C", "cap": null, "flats": false}, {"type": "chord", "title": "E shape", "notes": [[6, 8], [5, 10], [4, 10], [3, 9], [2, 8], [1, 8]], "muted": [], "root": "C", "cap": null, "flats": false}, {"type": "chord", "title": "D shape", "notes": [[4, 10], [3, 12], [2, 13], [1, 12]], "muted": [6, 5], "root": "C", "cap": null, "flats": false}, {"type": "scale", "title": "Every C, E and G on the neck", "root": "C", "iv": [0, 4, 7], "frets": [0, 15], "hl": [], "cap": "The five shapes above are all hiding in here, linked end to end.", "deg": {}, "flats": false, "strings": null}], "goal": "Play one chord in all five CAGED positions up the neck", "ex": ["Find the root", "Shape chain", "Move to G and D", "Partial shapes", "Capo duet"], "bt": [], "drone": null}, {"num": 12, "title": "Levels of rhythm", "phase": 1, "obj": "feel and play every common subdivision accurately, so you can read rhythms and lock in with other musicians.", "lesson": [["Key concepts", "<ul>\n<li><strong>Counting:<\/strong><ul>\n<li>Quarter notes: 1 2 3 4<\/li>\n<li>Eighth notes: 1 &amp; 2 &amp; 3 &amp; 4 &amp;<\/li>\n<li>Triplets (three per beat): 1 trip let 2 trip let<\/li>\n<li>Sixteenths: 1 e &amp; a 2 e &amp; a<\/li>\n<\/ul>\n<\/li>\n<li><strong>Dotted notes<\/strong> last one and a half times their normal length. A dotted eighth plus a sixteenth fills one beat: counted 1 (e &amp;) a.<\/li>\n<li><strong>Ties<\/strong> join two notes so you play once and hold.<\/li>\n<li><strong>Syncopation<\/strong> places accents off the beat, on the \"&amp;\", \"e\" or \"a\".<\/li>\n<li><strong>Rests<\/strong> are silences with a precise length. Mute the strings to make them clean.<\/li>\n<\/ul>"], ["Exercises", "<p>Use a single muted string (or one chord) so all your attention is on rhythm. Metronome at 60 BPM.<\/p>\n<p><strong>1. Level 1.<\/strong> Four bars each of quarters, then eighths, then back to quarters. Count aloud.<\/p>\n<p><strong>2. Level 2.<\/strong> Dotted quarter plus eighth (1 2 &amp; 3 4). Then ties across the bar line.<\/p>\n<p><strong>3. Level 3.<\/strong> Triplets. Switch between four bars of eighths and four bars of triplets without stopping.<\/p>\n<p><strong>4. Level 4.<\/strong> Sixteenths and the dotted eighth plus sixteenth pattern.<\/p>\n<p><strong>5. Level 5.<\/strong> Syncopated sixteenths: play only on the \"e\" and \"a\" of each beat. Then mixed patterns with rests.<\/p>\n<p><strong>6. Rhythm randomiser.<\/strong> Write each rhythm pattern on a card, shuffle, and play four bars of each card in whatever order comes up.<\/p>\n<p><strong>7. Notation software.<\/strong> Install Guitar Pro or the free MuseScore. Write two bars of each rhythm and play along with the playback.<\/p>"], ["Watch out for", "<ul>\n<li>Rushing sixteenths. Record and listen: are you landing exactly with the click on every beat?<\/li>\n<\/ul>"]], "days": [["Days 1 to 2", "levels 1 and 2."], ["Days 3 to 4", "levels 3 and 4."], ["Days 5 to 6", "level 5; rhythm randomiser; write rhythms in notation software."]], "sunday": "Play four bars each of eighths, triplets, sixteenths and one syncopated pattern, changing without stopping, against the click.", "boards": [{"type": "chord", "title": "G barre for rhythm work", "notes": [[6, 3], [5, 5], [4, 5], [3, 4], [2, 3], [1, 3]], "muted": [], "root": "G", "cap": "Strum it, or relax the pressure to mute it, while you work through the rhythm levels.", "flats": false}], "goal": "Clap and play each subdivision accurately against the click", "ex": ["Level 1", "Level 2", "Level 3", "Level 4", "Level 5", "Rhythm randomiser", "Notation software"], "bt": [], "drone": null}, {"num": 13, "title": "Review and Checkpoint 1", "phase": 1, "obj": "test yourself honestly against Phase 1, and fix the weakest areas before moving on.", "lesson": [["Checkpoint 1", "<ul>\n<li class=\"task\" data-task=\"cp1\">Name any note on the bottom three strings within 3 seconds<\/li>\n<li class=\"task\" data-task=\"cp2\">Play a song with open and barre chords, in time, with no buzzing<\/li>\n<li class=\"task\" data-task=\"cp3\">Name the diatonic chords of any major key<\/li>\n<li class=\"task\" data-task=\"cp4\">Play a chord in all five CAGED positions<\/li>\n<li class=\"task\" data-task=\"cp5\">Accurately play triplets and 16ths against the click<\/li>\n<\/ul>"], ["If you did not pass everything", "<p>Spend Week 14 on the remaining items before starting Phase 2. Pushing on with gaps in chords or rhythm makes everything later harder.<\/p>"], ["Maintenance list going into Phase 2", "<p>Rotate these through your warm-up: chromatic exercise, barre chord changes, the G major scale in thirds, triad inversions, and the rhythm randomiser.<\/p>"]], "days": [["Day 1", "run every checkpoint item and record it. Score each as Pass, Close or Not yet."], ["Days 2 to 5", "spend the whole main focus block on your \"Not yet\" and \"Close\" items. Use the exercises from the relevant week."], ["Day 6", "retest and record. Watch your Week 1 clip, then today's."]], "sunday": "Your full Checkpoint 1 run. Keep it alongside your Week 1 clip.", "boards": [{"type": "notes", "title": "Checkpoint: natural notes on the bottom three strings", "notes": [[6, 0], [6, 1], [6, 3], [6, 5], [6, 7], [6, 8], [6, 10], [6, 12], [5, 0], [5, 2], [5, 3], [5, 5], [5, 7], [5, 8], [5, 10], [5, 12], [4, 0], [4, 2], [4, 3], [4, 5], [4, 7], [4, 9], [4, 10], [4, 12]], "root": null, "frets": [0, 12], "cap": null, "flats": false, "hlpos": []}], "goal": "Complete Checkpoint 1 (section 7)", "ex": [], "bt": [], "drone": null}, {"num": 14, "title": "Bends, vibrato, harmonics and volume swells", "phase": 2, "obj": "make single notes sing. These techniques are what make the guitar sound like a guitar.", "lesson": [["Key concepts", "<ul>\n<li><strong>Bends.<\/strong> Push (or pull) the string across the fretboard to raise the pitch. A half step bend raises the note by one fret; a whole step by two frets. Use your ring finger, with the index and middle fingers behind it on the same string helping to push. The power comes from rotating the wrist, like turning a door handle, not from the fingertip alone.<\/li>\n<li><strong>Bend accuracy.<\/strong> Most bad bends are out of tune, not weak. Always check: play the target fret first, then bend to match it.<\/li>\n<li><strong>Basic vibrato.<\/strong> A small, repeated bend and release. Keep it even and in time with the music.<\/li>\n<li><strong>Natural harmonics.<\/strong> Lightly touch the string directly above the fret wire (not pressing down) and pick. Strongest at frets 12, 7 and 5.<\/li>\n<li><strong>Pinch harmonics.<\/strong> Hold the pick so only a tiny tip shows, and let the edge of your thumb brush the string straight after the pick strikes it. Works best with distortion. Move your picking position along the string to find the sweet spots.<\/li>\n<li><strong>Volume swells.<\/strong> Turn the volume knob to zero, pick a note, then roll the volume up with your little finger. The attack disappears and the note fades in like a violin.<\/li>\n<\/ul>"], ["Exercises", "<p><strong>1. Bend in tune.<\/strong> Play fret 9 on the G string, then bend fret 7 up to match it.<\/p>\n<pre><code>e|------------------------------------|\nB|------------------------------------|\nG|--9----7b9----9----7b9r7------------|\nD|------------------------------------|\n<\/code><\/pre>\n<p>Repeat on the B string (fret 10 target, bend from 8) and high e (fret 7 target, bend from 5). Then half step bends: target fret 8 on the G string, bend from 7.<\/p>\n<p><strong>2. Vibrato in time.<\/strong> Metronome at 60 BPM. Hold fret 7 on the G string and do one vibrato cycle per click, then two per click.<\/p>\n<p><strong>3. Harmonic chime.<\/strong> Play natural harmonics at frets 12, 7 and 5 across all strings.<\/p>\n<pre><code>e|--&lt;12&gt;--&lt;7&gt;--&lt;5&gt;--|\nB|--&lt;12&gt;--&lt;7&gt;--&lt;5&gt;--|\nG|--&lt;12&gt;--&lt;7&gt;--&lt;5&gt;--|\nD|--&lt;12&gt;--&lt;7&gt;--&lt;5&gt;--|\n<\/code><\/pre>\n<p><strong>4. Pinch harmonic hunt.<\/strong> On the G string at fret 7 with distortion, pick slowly while moving your picking hand from the neck pickup towards the bridge. Note where the squeals appear.<\/p>\n<p><strong>5. Swells.<\/strong> Play a slow chord progression (Am, F, C, G) with every chord swelled in. A delay or reverb effect makes this sound beautiful.<\/p>"], ["Watch out for", "<ul>\n<li>Bending with only the ring finger. It will tire and go flat. Use the support fingers.<\/li>\n<li>Wild, fast vibrato. Slower and wider usually sounds better.<\/li>\n<\/ul>"]], "days": [["Days 1 to 2", "whole step bends on G, B and e strings; check every bend against the target."], ["Days 3 to 4", "half step bends; vibrato in time; natural harmonics."], ["Days 5 to 6", "pinch harmonics and volume swells; combine bends and vibrato in a short phrase."]], "sunday": "Three whole step bends on the G string, each preceded by the target note so you can hear whether they match. Then a held note with vibrato for 8 beats.", "boards": [{"type": "notes", "title": "Bend from B to the target T", "notes": [[3, 7, "B"], [3, 9, "T"], [2, 8, "B"], [2, 10, "T"], [1, 5, "B"], [1, 7, "T"]], "root": null, "frets": [4, 11], "cap": "Play T first, then bend B until it matches. Switch to Fingers to see B and T.", "flats": false, "hlpos": []}, {"type": "notes", "title": "Natural harmonics at frets 5, 7 and 12", "notes": [[1, 5, "h"], [1, 7, "h"], [1, 12, "h"], [2, 5, "h"], [2, 7, "h"], [2, 12, "h"], [3, 5, "h"], [3, 7, "h"], [3, 12, "h"], [4, 5, "h"], [4, 7, "h"], [4, 12, "h"], [5, 5, "h"], [5, 7, "h"], [5, 12, "h"], [6, 5, "h"], [6, 7, "h"], [6, 12, "h"]], "root": null, "frets": [4, 12], "cap": "Touch the string directly above the fret wire without pressing.", "flats": false, "hlpos": []}], "goal": "Half and whole step bends in tune, checked against a fretted target note", "ex": ["Bend in tune", "Vibrato in time", "Harmonic chime", "Pinch harmonic hunt", "Swells"], "bt": ["slow-am"], "drone": null}, {"num": 15, "title": "Legato, slides, vibrato types, double stops and drop D", "phase": 2, "obj": "play smooth connected lines, and add texture and colour to your playing.", "lesson": [["Key concepts", "<ul>\n<li><strong>Hammer-on (h).<\/strong> Pick one note, then bring another finger down hard enough to sound a higher note without picking.<\/li>\n<li><strong>Pull-off (p).<\/strong> With two fingers down, pick the higher note, then flick the finger off the string sideways (slightly downward) to sound the lower note.<\/li>\n<li><strong>Slides (/ and ).<\/strong> Pick, then keep pressure as you slide to the new fret. Do not lift.<\/li>\n<li><strong>Four vibrato types:<\/strong><ol>\n<li>Bend vibrato: the small push and release from Week 14<\/li>\n<li>Wrist vibrato: rotating the wrist, common in blues and rock<\/li>\n<li>Classical vibrato: rocking the finger along the length of the string, subtle and gentle<\/li>\n<li>Whammy bar vibrato: if your guitar has a tremolo arm<\/li>\n<\/ol>\n<\/li>\n<li><strong>Double stops.<\/strong> Two notes at once, often thirds or sixths from a scale. Great for country, soul and rock fills.<\/li>\n<li><strong>Drop D tuning.<\/strong> Lower the low E string to D (match it to the open D string, an octave lower). Power chords on the bottom three strings now take one finger.<\/li>\n<\/ul>"], ["Exercises", "<p><strong>1. Legato strength.<\/strong> On each string, one finger per fret at position 5: <code>5h7p5<\/code>, <code>5h8p5<\/code>, <code>7h8p7<\/code>. 2 minutes per pattern.<\/p>\n<p><strong>2. A minor pentatonic phrase<\/strong> combining hammer-ons, pull-offs, slides and a bend:<\/p>\n<pre><code>e|-----------------5h8p5-----------------|\nB|-----------5/8----------8b10r8--5------|\nG|-----5h7--------------------------7~---|\nD|--7------------------------------------|\n<\/code><\/pre>\n<p><strong>3. Vibrato types.<\/strong> Hold one note and play each vibrato type for 4 beats. Record and compare how they sound.<\/p>\n<p><strong>4. Double stops in thirds.<\/strong> In G major, on the G and B strings:<\/p>\n<pre><code>e|---------------------------------------|\nB|--3----5----7----8----10----12---------|\nG|--4----5----7----9----11----12---------|\n<\/code><\/pre>\n<p>(These pairs are B D, C E, D F#, E G, F# A, G B.) Slide between them.<\/p>\n<p><strong>5. Drop D riff.<\/strong> Tune down, then play one-finger power chords across the bottom three strings at frets 0, 3, 5, 0, 7, 5.<\/p>"], ["Watch out for", "<ul>\n<li>Pull-offs that simply lift the finger. The note dies. Flick slightly so the finger plucks the string as it leaves.<\/li>\n<li>Hammer-ons that are quieter than picked notes. Aim for even volume.<\/li>\n<\/ul>"]], "days": [["Days 1 to 2", "hammer-on and pull-off patterns; slides."], ["Days 3 to 4", "the pentatonic phrase; the four vibrato types."], ["Days 5 to 6", "double stops; drop D riffs; write your own 4 bar phrase using every technique."]], "sunday": "Your own short solo (4 to 8 bars) using hammer-ons, pull-offs, slides, a bend, double stops and vibrato.", "boards": [{"type": "scale", "title": "A minor pentatonic, shape 1", "root": "A", "iv": [0, 3, 5, 7, 10], "frets": [5, 8], "hl": [], "cap": null, "deg": {}, "flats": false, "strings": null}, {"type": "notes", "title": "Double stops in thirds, G major", "notes": [[3, 4], [2, 3], [3, 5], [2, 5], [3, 7], [2, 7], [3, 9], [2, 8], [3, 11], [2, 10], [3, 12], [2, 12]], "root": "G", "frets": [2, 12], "cap": null, "flats": false, "hlpos": []}], "goal": "Play a short solo using all of them", "ex": ["Legato strength", "A minor pentatonic phrase", "Vibrato types", "Double stops in thirds", "Drop D riff"], "bt": ["am-jam"], "drone": null}, {"num": 16, "title": "Speed part 1, alternate picking", "phase": 2, "obj": "set an honest speed baseline and build clean, efficient alternate picking.", "lesson": [["Key concepts", "<ul>\n<li><strong>Alternate picking.<\/strong> Strictly down, up, down, up, regardless of string changes.<\/li>\n<li><strong>Small motions.<\/strong> The pick should move only a few millimetres past the string. Big movements waste time.<\/li>\n<li><strong>The speed method.<\/strong><ol>\n<li>Find your clean maximum: the fastest tempo you can play an exercise correctly 4 times in a row.<\/li>\n<li>Practise mostly at about 80% of that.<\/li>\n<li>Spend a few minutes trying faster than your maximum, accepting some mess. This teaches the motion.<\/li>\n<li>Raise the clean tempo by 3 to 5 BPM once it feels easy.<\/li>\n<\/ol>\n<\/li>\n<li><strong>String crossing.<\/strong> When you change string, the pick either travels around the outside of the two strings (outside picking) or is trapped between them (inside picking). Most players find one easier, but you need both.<\/li>\n<\/ul>"], ["Exercises", "<p><strong>1. Tremolo picking.<\/strong> Single note on the G string, sixteenth notes at 80 BPM, for 30 seconds. Relaxed hand.<\/p>\n<p><strong>2. Four notes per string.<\/strong> One finger per fret, position 5, down each string and back, sixteenth notes.<\/p>\n<pre><code>e|--------------------------------5-6-7-8--|\nB|------------------------5-6-7-8----------|\nG|----------------5-6-7-8------------------|\nD|--------5-6-7-8--------------------------|\n<\/code><\/pre>\n<p><strong>3. Outside picking drill.<\/strong> Alternate between B string fret 5 and high e fret 5, starting with a downstroke on the B string. The pick travels around the outside.<\/p>\n<p><strong>4. Inside picking drill.<\/strong> Same notes, but start with an upstroke on the B string. The pick stays between the strings.<\/p>\n<p><strong>5. Three notes per string scale.<\/strong> A natural minor at position 5 (A B C | D E F | G A B | C D E | F G A | B C D), strict alternate picking, up and back down:<\/p>\n<pre><code>e|----------------------------------------------7-8-10-|\nB|--------------------------------------6-8-10---------|\nG|-------------------------------5-7-9-----------------|\nD|------------------------5-7-9------------------------|\nA|-----------------5-7-8-------------------------------|\nE|----------5-7-8--------------------------------------|\n<\/code><\/pre>"], ["Baseline test", "<p>On Day 1, record your clean maximum BPM (sixteenth notes) for exercises 1, 2 and 5. Write these in your practice log. You will retest at Checkpoint 2.<\/p>"], ["Watch out for", "<ul>\n<li>Tension. Speed comes from relaxation. If your forearm burns, stop, shake out and slow down.<\/li>\n<li>Picking hand and fretting hand drifting out of sync. Listen for notes that blur.<\/li>\n<\/ul>"]], "days": [["Day 1", "baseline test."], ["Days 2 to 3", "tremolo and four notes per string at 80%."], ["Days 4 to 5", "inside and outside picking drills."], ["Day 6", "three notes per string scale; push 5 BPM above Day 1."]], "sunday": "Exercise 2 at your new clean maximum, with the metronome audible.", "boards": [{"type": "notes", "title": "Four notes per string, position 5", "notes": [[6, 5, "1"], [6, 6, "2"], [6, 7, "3"], [6, 8, "4"], [5, 5, "1"], [5, 6, "2"], [5, 7, "3"], [5, 8, "4"], [4, 5, "1"], [4, 6, "2"], [4, 7, "3"], [4, 8, "4"], [3, 5, "1"], [3, 6, "2"], [3, 7, "3"], [3, 8, "4"], [2, 5, "1"], [2, 6, "2"], [2, 7, "3"], [2, 8, "4"], [1, 5, "1"], [1, 6, "2"], [1, 7, "3"], [1, 8, "4"]], "root": null, "frets": [4, 9], "cap": null, "flats": false, "hlpos": []}, {"type": "notes", "title": "A natural minor, three notes per string", "notes": [[6, 5], [6, 7], [6, 8], [5, 5], [5, 7], [5, 8], [4, 5], [4, 7], [4, 9], [3, 5], [3, 7], [3, 9], [2, 6], [2, 8], [2, 10], [1, 7], [1, 8], [1, 10]], "root": "A", "frets": [4, 10], "cap": null, "flats": false, "hlpos": []}], "goal": "Record a baseline BPM for a picking exercise, then add 5 BPM", "ex": ["Tremolo picking", "Four notes per string", "Outside picking drill", "Inside picking drill", "Three notes per string scale"], "bt": [], "drone": null}, {"num": 17, "title": "Speed part 2, legato runs and bursts", "phase": 2, "obj": "play fast passages by combining picking with legato, and learn a reliable method for tackling hard passages.", "lesson": [["Key concepts", "<ul>\n<li><strong>Do not pick every note.<\/strong> Picking only the first note on each string, and hammering or pulling the rest, lets you play fast with much less effort.<\/li>\n<li><strong>Bursts.<\/strong> Play a short group of fast notes, then stop. Chain bursts together over time. This trains speed without the fatigue of a long run.<\/li>\n<li><strong>Chunking.<\/strong> Break a hard passage into groups of 4 to 6 notes, master each group, then join them with one overlapping note.<\/li>\n<li><strong>Loop and nudge.<\/strong> Loop the hardest bar at a slow tempo, then increase by 3 to 5 BPM each time you get 4 clean repetitions.<\/li>\n<\/ul>"], ["Exercises", "<p><strong>1. Legato three notes per string.<\/strong> Pick the first note on each string, hammer the next two going up, pull off going down. A minor at position 5:<\/p>\n<pre><code>e|------------------------------7h8h10-|\nB|-----------------------6h8h10--------|\nG|-----------------5h7h9---------------|\nD|-----------5h7h9---------------------|\nA|-----5h7h8---------------------------|\nE|-5h7h8-------------------------------|\n<\/code><\/pre>\n<p><strong>2. Bursts.<\/strong> Choose any four note group (for example <code>5-7-8<\/code> on one string plus <code>5<\/code> on the next). Play it as fast as possible, stop for one beat, repeat. Then two groups, then three.<\/p>\n<p><strong>3. The six note loop.<\/strong> A classic pentatonic sequence at position 5:<\/p>\n<pre><code>e|--8-5-----------8-5-----------|\nB|------8-5-----------8-5-------|\nG|----------7-5-----------7-5---|\n<\/code><\/pre>\n<p>Loop at a comfortable tempo, then nudge up.<\/p>\n<p><strong>4. Learn one fast lick.<\/strong> Pick a fast lick from a song you like. Chunk it, then loop and nudge.<\/p>"], ["Watch out for", "<ul>\n<li>Legato notes fading in volume. Hammer firmly from a little height.<\/li>\n<\/ul>"]], "days": [["Days 1 to 2", "legato three notes per string; compare speed with last week's picked version."], ["Days 3 to 4", "bursts; six note loop."], ["Days 5 to 6", "chunk and loop a fast lick from a song."]], "sunday": "The six note loop at your fastest clean tempo, then the song lick at whatever tempo you can play it cleanly.", "boards": [{"type": "notes", "title": "Legato: pick only the first note on each string", "notes": [[6, 5, "P"], [6, 7, "h"], [6, 8, "h"], [5, 5, "P"], [5, 7, "h"], [5, 8, "h"], [4, 5, "P"], [4, 7, "h"], [4, 9, "h"], [3, 5, "P"], [3, 7, "h"], [3, 9, "h"], [2, 6, "P"], [2, 8, "h"], [2, 10, "h"], [1, 7, "P"], [1, 8, "h"], [1, 10, "h"]], "root": "A", "frets": [4, 10], "cap": "Switch to Fingers: P is picked, h is hammered on.", "flats": false, "hlpos": []}, {"type": "notes", "title": "The six note loop", "notes": [[1, 8], [1, 5], [2, 8], [2, 5], [3, 7], [3, 5]], "root": "A", "frets": [4, 9], "cap": null, "flats": false, "hlpos": []}], "goal": "Add a further 5 to 10 BPM to last week's baseline", "ex": ["Legato three notes per string", "Bursts", "The six note loop", "Learn one fast lick"], "bt": [], "drone": null}, {"num": 18, "title": "Major scale modes part 1: Ionian, Dorian, Phrygian", "phase": 2, "obj": "understand what modes are and hear the character of the first three.", "lesson": [["Key concepts", "<ul>\n<li><strong>What a mode is.<\/strong> Take the notes of a major scale, but treat a different note as home. Play C major from D to D and you get D Dorian. Same notes, completely different feeling.<\/li>\n<li><strong>Two ways to think about modes.<\/strong> The parent scale view (D Dorian uses C major's notes) is useful for finding shapes. The parallel view (comparing each mode to the major or minor scale on the same root) is better for hearing them. Use both.<\/li>\n<li><strong>The first three, all on A:<\/strong><\/li>\n<\/ul>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Mode<\/th>\n<th>Degree of parent<\/th>\n<th>Formula vs major<\/th>\n<th>Notes on A<\/th>\n<th>Parent scale<\/th>\n<th>Character note<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Ionian<\/td>\n<td>1st<\/td>\n<td>1 2 3 4 5 6 7<\/td>\n<td>A B C# D E F# G#<\/td>\n<td>A major<\/td>\n<td>It is the major scale<\/td>\n<\/tr>\n<tr>\n<td>Dorian<\/td>\n<td>2nd<\/td>\n<td>1 2 b3 4 5 6 b7<\/td>\n<td>A B C D E F# G<\/td>\n<td>G major<\/td>\n<td>Natural 6 (F#)<\/td>\n<\/tr>\n<tr>\n<td>Phrygian<\/td>\n<td>3rd<\/td>\n<td>1 b2 b3 4 5 b6 b7<\/td>\n<td>A Bb C D E F G<\/td>\n<td>F major<\/td>\n<td>Flat 2 (Bb)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li><strong>Character notes.<\/strong> Each mode has one or two notes that make it sound different from plain major or minor. When you improvise, leaning on these notes is what makes the mode audible.<\/li>\n<\/ul>"], ["Exercises", "<p><strong>1. One string modes.<\/strong> Play each mode up the A string from the open A, using its formula. This shows the step pattern clearly.<\/p>\n<p><strong>2. Over a drone.<\/strong> Play a low A drone (an open A string, or a drone track) and slowly play each mode over it. Spend 3 minutes per mode, describing its mood in a word or two in your log.<\/p>\n<p><strong>3. Position shapes from the parent.<\/strong> A Dorian uses G major notes, so play your G major position from Week 4 but start and end on A. Do the same for A Phrygian using F major (the same shape moved down 2 frets, starting on A).<\/p>\n<p><strong>4. Compare.<\/strong> Play A natural minor (from Week 16), then A Dorian. The only difference is F versus F#. Hear it.<\/p>"], ["Watch out for", "<ul>\n<li>Thinking of modes as just patterns. If you are not hearing the difference over a drone or a chord, it is not a mode yet, just a scale starting on a different note.<\/li>\n<\/ul>"]], "days": [["Days 1 to 2", "the concept; one string modes; Ionian and Dorian over a drone."], ["Days 3 to 4", "Phrygian; position shapes."], ["Days 5 to 6", "compare each mode with major or minor; play a short melody in each."]], "sunday": "Over an A drone, play A Ionian, A Dorian and A Phrygian one after another, then describe each in a sentence on camera.", "boards": [{"type": "scale", "title": "A Ionian", "root": "A", "iv": [0, 2, 4, 5, 7, 9, 11], "frets": [4, 8], "hl": [], "cap": null, "deg": {}, "flats": false, "strings": null}, {"type": "scale", "title": "A Dorian", "root": "A", "iv": [0, 2, 3, 5, 7, 9, 10], "frets": [4, 8], "hl": [9], "cap": "Character note: the natural 6 (F#)", "deg": {}, "flats": false, "strings": null}, {"type": "scale", "title": "A Phrygian", "root": "A", "iv": [0, 1, 3, 5, 7, 8, 10], "frets": [4, 8], "hl": [1], "cap": "Character note: the flat 2 (Bb)", "deg": {}, "flats": true, "strings": null}], "goal": "Play each in two positions and hear its character over a drone", "ex": ["One string modes", "Over a drone", "Position shapes from the parent", "Compare"], "bt": ["a-ionian", "a-dorian", "a-phryg"], "drone": "A"}, {"num": 19, "title": "Major scale modes part 2: Lydian, Mixolydian, Aeolian, Locrian", "phase": 2, "obj": "complete the set and be able to play all seven modes from one root.", "lesson": [["Key concepts", "<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Mode<\/th>\n<th>Degree of parent<\/th>\n<th>Formula vs major<\/th>\n<th>Notes on A<\/th>\n<th>Parent scale<\/th>\n<th>Character note<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Lydian<\/td>\n<td>4th<\/td>\n<td>1 2 3 #4 5 6 7<\/td>\n<td>A B C# D# E F# G#<\/td>\n<td>E major<\/td>\n<td>Sharp 4 (D#)<\/td>\n<\/tr>\n<tr>\n<td>Mixolydian<\/td>\n<td>5th<\/td>\n<td>1 2 3 4 5 6 b7<\/td>\n<td>A B C# D E F# G<\/td>\n<td>D major<\/td>\n<td>Flat 7 (G)<\/td>\n<\/tr>\n<tr>\n<td>Aeolian<\/td>\n<td>6th<\/td>\n<td>1 2 b3 4 5 b6 b7<\/td>\n<td>A B C D E F G<\/td>\n<td>C major<\/td>\n<td>It is the natural minor<\/td>\n<\/tr>\n<tr>\n<td>Locrian<\/td>\n<td>7th<\/td>\n<td>1 b2 b3 4 b5 b6 b7<\/td>\n<td>A Bb C D Eb F G<\/td>\n<td>Bb major<\/td>\n<td>Flat 5 (Eb)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li><strong>Brightest to darkest.<\/strong> Lydian, Ionian, Mixolydian, Dorian, Aeolian, Phrygian, Locrian. Each step darker flattens one more note.<\/li>\n<li><strong>Where they live.<\/strong> Lydian: dreamy film music. Mixolydian: rock and blues riffs. Aeolian: most minor pop and rock. Locrian: rarely used as a home, but it is the sound of the m7b5 chord.<\/li>\n<\/ul>"], ["Exercises", "<p><strong>1. One string modes<\/strong> for the four new modes, as last week.<\/p>\n<p><strong>2. Drone work.<\/strong> 3 minutes per mode over an A drone, noting the mood.<\/p>\n<p><strong>3. All seven from one root.<\/strong> Play A in all seven modes in brightness order, Lydian to Locrian, one octave each on one string or in position. Hear each flattened note arrive.<\/p>\n<p><strong>4. Name the parent.<\/strong> Quiz yourself: \"C Mixolydian?\" (F major). \"E Phrygian?\" (C major). \"D Lydian?\" (A major). Write 10 a day and check.<\/p>"], ["Watch out for", "<ul>\n<li>Rushing through the drone work. This is where the modes stop being theory.<\/li>\n<\/ul>"]], "days": [["Days 1 to 2", "Lydian and Mixolydian."], ["Days 3 to 4", "Aeolian and Locrian."], ["Days 5 to 6", "all seven in brightness order; parent scale quiz."]], "sunday": "All seven modes from A in brightness order over a drone.", "boards": [{"type": "scale", "title": "A Lydian", "root": "A", "iv": [0, 2, 4, 6, 7, 9, 11], "frets": [4, 8], "hl": [6], "cap": "Character note: the sharp 4 (D#)", "deg": {"6": "#4"}, "flats": false, "strings": null}, {"type": "scale", "title": "A Mixolydian", "root": "A", "iv": [0, 2, 4, 5, 7, 9, 10], "frets": [4, 8], "hl": [10], "cap": "Character note: the flat 7 (G)", "deg": {}, "flats": false, "strings": null}, {"type": "scale", "title": "A Aeolian", "root": "A", "iv": [0, 2, 3, 5, 7, 8, 10], "frets": [4, 8], "hl": [8], "cap": "Character note: the flat 6 (F)", "deg": {}, "flats": false, "strings": null}, {"type": "scale", "title": "A Locrian", "root": "A", "iv": [0, 1, 3, 5, 6, 8, 10], "frets": [4, 8], "hl": [6], "cap": "Character note: the flat 5 (Eb)", "deg": {}, "flats": true, "strings": null}], "goal": "Play all seven modes from one root and describe how each sounds", "ex": ["One string modes", "Drone work", "All seven from one root", "Name the parent"], "bt": ["a-lydian", "a-mixo", "a-aeol"], "drone": "A"}, {"num": 20, "title": "Practising the modes musically", "phase": 2, "obj": "make each mode sound like itself by playing it over the right chords.", "lesson": [["Key concepts", "<p>A drone tells your ear where home is, but a chord vamp makes the mode come alive. Each vamp below highlights its mode's character note.<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Mode<\/th>\n<th>Vamp (on A)<\/th>\n<th>Why it works<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Ionian<\/td>\n<td>Amaj7 to D<\/td>\n<td>Major home, IV chord<\/td>\n<\/tr>\n<tr>\n<td>Dorian<\/td>\n<td>Am7 to D (or D7)<\/td>\n<td>The D chord contains F#, the natural 6<\/td>\n<\/tr>\n<tr>\n<td>Phrygian<\/td>\n<td>Am to Bb<\/td>\n<td>Bb is the flat 2<\/td>\n<\/tr>\n<tr>\n<td>Lydian<\/td>\n<td>A to B<\/td>\n<td>B major contains D#, the sharp 4<\/td>\n<\/tr>\n<tr>\n<td>Mixolydian<\/td>\n<td>A to G<\/td>\n<td>G is the flat 7<\/td>\n<\/tr>\n<tr>\n<td>Aeolian<\/td>\n<td>Am to F to G<\/td>\n<td>F holds the flat 6<\/td>\n<\/tr>\n<tr>\n<td>Locrian<\/td>\n<td>Am7b5 (sustained)<\/td>\n<td>Rarely a home key; practise it over its own chord<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>"], ["Exercises", "<p><strong>1. Record your own vamps.<\/strong> Record each two chord vamp for 2 minutes (or find a backing track for each mode online by searching \"A Dorian backing track\" and so on).<\/p>\n<p><strong>2. Character note targeting.<\/strong> Improvise over each vamp, landing on the character note on the chord change.<\/p>\n<p><strong>3. Different ways to practise each mode:<\/strong><\/p>\n<ul>\n<li>On one string only, so you hear steps rather than patterns<\/li>\n<li>In one position, across all strings<\/li>\n<li>In two note pairs (thirds), as in Week 4<\/li>\n<li>As three note melodic groups (1 2 3, 2 3 4, 3 4 5 and so on)<\/li>\n<\/ul>\n<p><strong>4. Write a 4 bar melody<\/strong> in Dorian and another in Mixolydian.<\/p>"], ["Watch out for", "<ul>\n<li>Defaulting to minor pentatonic licks. Make yourself use the character note.<\/li>\n<\/ul>"]], "days": [["Days 1 to 2", "record or find vamps; Dorian and Mixolydian (the two most useful)."], ["Days 3 to 4", "Lydian, Phrygian and Aeolian."], ["Days 5 to 6", "the different practice approaches; write two melodies."]], "sunday": "One minute of improvising over the Dorian, Mixolydian and Lydian vamps, each.", "boards": [{"type": "scale", "title": "A Dorian over Am7 to D", "root": "A", "iv": [0, 2, 3, 5, 7, 9, 10], "frets": [4, 8], "hl": [9], "cap": null, "deg": {}, "flats": false, "strings": null}, {"type": "chord", "title": "Am7", "notes": [[5, 0], [4, 2], [3, 0], [2, 1], [1, 0]], "muted": [6], "root": "A", "cap": null, "flats": false}, {"type": "chord", "title": "D", "notes": [[4, 0], [3, 2], [2, 3], [1, 2]], "muted": [6, 5], "root": "D", "cap": null, "flats": false}, {"type": "scale", "title": "A Mixolydian over A to G", "root": "A", "iv": [0, 2, 4, 5, 7, 9, 10], "frets": [4, 8], "hl": [10], "cap": null, "deg": {}, "flats": false, "strings": null}, {"type": "chord", "title": "A", "notes": [[5, 0], [4, 2], [3, 2], [2, 2], [1, 0]], "muted": [6], "root": "A", "cap": null, "flats": false}, {"type": "chord", "title": "G", "notes": [[6, 3], [5, 2], [4, 0], [3, 0], [2, 0], [1, 3]], "muted": [], "root": "G", "cap": null, "flats": false}], "goal": "Improvise for 1 minute over a drone in each of three modes", "ex": ["Record your own vamps", "Character note targeting", "Different ways to practise each mode:", "Write a 4 bar melody"], "bt": ["a-dorian", "a-mixo", "a-lydian", "a-phryg", "a-aeol"], "drone": "A"}, {"num": 21, "title": "The five pentatonic shapes", "phase": 2, "obj": "play the minor pentatonic across the entire neck, and connect the shapes.", "lesson": [["Key concepts", "<ul>\n<li><strong>The minor pentatonic<\/strong> is five notes: 1 b3 4 5 b7. A minor pentatonic is A C D E G.<\/li>\n<li><strong>The major pentatonic<\/strong> uses the same shapes. C major pentatonic (C D E G A) is the same notes as A minor pentatonic, just a different home.<\/li>\n<li><strong>The five shapes in A minor<\/strong> (frets low E to high e):<\/li>\n<\/ul>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Shape<\/th>\n<th>Low E<\/th>\n<th>A<\/th>\n<th>D<\/th>\n<th>G<\/th>\n<th>B<\/th>\n<th>high e<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>5 8<\/td>\n<td>5 7<\/td>\n<td>5 7<\/td>\n<td>5 7<\/td>\n<td>5 8<\/td>\n<td>5 8<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>8 10<\/td>\n<td>7 10<\/td>\n<td>7 10<\/td>\n<td>7 9<\/td>\n<td>8 10<\/td>\n<td>8 10<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>10 12<\/td>\n<td>10 12<\/td>\n<td>10 12<\/td>\n<td>9 12<\/td>\n<td>10 13<\/td>\n<td>10 12<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>12 15<\/td>\n<td>12 15<\/td>\n<td>12 14<\/td>\n<td>12 14<\/td>\n<td>13 15<\/td>\n<td>12 15<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>15 17<\/td>\n<td>15 17<\/td>\n<td>14 17<\/td>\n<td>14 17<\/td>\n<td>15 17<\/td>\n<td>15 17<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Shape 5 also sits an octave lower at frets 3 and 5 (D and G strings at 2 and 5). After shape 5, the pattern repeats with shape 1 at fret 17.<\/p>\n<ul>\n<li><strong>Shapes share notes.<\/strong> The top note of one shape on each string is the bottom note of the next. That is how they connect.<\/li>\n<li><strong>Diagonal patterns<\/strong> run across two or three shapes, letting you travel up the neck in one run rather than boxing yourself in.<\/li>\n<\/ul>"], ["Exercises", "<p><strong>1. One shape a day.<\/strong> Days 1 to 5, one shape each, up and down at 60 BPM, eighth notes, then sixteenths. Find every A (the root) in each shape.<\/p>\n<p><strong>2. Connect neighbours.<\/strong> Play shape 1 up, slide into shape 2 and play it down. Then 2 to 3, and so on.<\/p>\n<p><strong>3. Diagonal run.<\/strong> Three notes per string, climbing from shape 1 into shape 3:<\/p>\n<pre><code>e|------------------------------------10-12-15-|\nB|---------------------------8-10-13-----------|\nG|--------------------7-9-12-------------------|\nD|-------------5-7-10--------------------------|\nA|------5-7-10---------------------------------|\nE|--5-8----------------------------------------|\n<\/code><\/pre>\n<p><strong>4. Nut to 17th fret.<\/strong> Play every A minor pentatonic note on the G and B strings from the nut to fret 17 and back.<\/p>"], ["Watch out for", "<ul>\n<li>Learning shapes without the roots. Always know where the A notes are; it is what lets you move to other keys.<\/li>\n<\/ul>"]], "days": [["Days 1 to 5", "one shape per day, plus connecting it to the previous shape."], ["Day 6", "diagonal run; full neck on the G and B strings; play all five shapes in sequence without stopping."]], "sunday": "All five shapes in sequence from fret 3 to fret 17, then the diagonal run.", "boards": [{"type": "scale", "title": "Shape 1", "root": "A", "iv": [0, 3, 5, 7, 10], "frets": [5, 8], "hl": [], "cap": null, "deg": {}, "flats": false, "strings": null}, {"type": "scale", "title": "Shape 2", "root": "A", "iv": [0, 3, 5, 7, 10], "frets": [7, 10], "hl": [], "cap": null, "deg": {}, "flats": false, "strings": null}, {"type": "scale", "title": "Shape 3", "root": "A", "iv": [0, 3, 5, 7, 10], "frets": [9, 13], "hl": [], "cap": null, "deg": {}, "flats": false, "strings": null}, {"type": "scale", "title": "Shape 4", "root": "A", "iv": [0, 3, 5, 7, 10], "frets": [12, 15], "hl": [], "cap": null, "deg": {}, "flats": false, "strings": null}, {"type": "scale", "title": "Shape 5", "root": "A", "iv": [0, 3, 5, 7, 10], "frets": [14, 17], "hl": [], "cap": null, "deg": {}, "flats": false, "strings": null}, {"type": "scale", "title": "All five shapes, nut to fret 17", "root": "A", "iv": [0, 3, 5, 7, 10], "frets": [0, 17], "hl": [], "cap": null, "deg": {}, "flats": false, "strings": null}], "goal": "Play A minor pentatonic from the nut to the 17th fret without stopping", "ex": ["One shape a day", "Connect neighbours", "Diagonal run", "Nut to 17th fret"], "bt": ["am-jam"], "drone": null}, {"num": 22, "title": "Making the pentatonic sound like music", "phase": 2, "obj": "stop sounding like you are running a scale. Start phrasing like a singer.", "lesson": [["Key concepts", "<ul>\n<li><strong>Phrases, not streams.<\/strong> Play a short idea, then leave space. Most great solos have as much silence as sound.<\/li>\n<li><strong>Rhythm variety.<\/strong> Mix long notes, short notes, triplets and rests. One rhythm used throughout sounds like an exercise.<\/li>\n<li><strong>Repetition.<\/strong> Repeat an idea, then vary it slightly. Listeners love recognising something.<\/li>\n<li><strong>Question and answer.<\/strong> A phrase that ends on a tense note (the 4th or b7) asks a question; a phrase ending on the root answers it.<\/li>\n<li><strong>Target the chord.<\/strong> When the chord changes, land on one of its notes. Even within pentatonic, this keeps you connected to the music.<\/li>\n<li><strong>Use your Week 14 and 15 techniques.<\/strong> Bends to scale notes, vibrato on long notes, slides into notes.<\/li>\n<\/ul>"], ["Exercises", "<p><strong>1. Three note limit.<\/strong> Improvise for 2 minutes using only three notes from shape 1. You are forced to be creative with rhythm and expression.<\/p>\n<p><strong>2. One string solo.<\/strong> Improvise using only the B string, sliding between pentatonic notes.<\/p>\n<p><strong>3. Question and answer.<\/strong> Play a 2 bar phrase ending on D or G, then a 2 bar answer ending on A.<\/p>\n<p><strong>4. Repeat and vary.<\/strong> Play a 1 bar idea three times, changing only its last note each time.<\/p>\n<p><strong>5. Steal 5 licks.<\/strong> Learn five short pentatonic licks from players you like. Then change each one a little to make it yours.<\/p>"], ["Watch out for", "<ul>\n<li>Filling every bar. Count your rests; try to leave at least one beat of silence every two bars.<\/li>\n<\/ul>"]], "days": [["Days 1 to 2", "three note limit; one string solo."], ["Days 3 to 4", "qu
