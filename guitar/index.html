estion and answer; repeat and vary."], ["Days 5 to 6", "learn and adapt five licks; full 2 minute improvisation over an A minor backing track."]], "sunday": "2 minutes of improvising over an A minor backing track. Listen back for space, repetition and endings on chord tones.", "boards": [{"type": "scale", "title": "Shape 1 home base", "root": "A", "iv": [0, 3, 5, 7, 10], "frets": [5, 8], "hl": [], "cap": null, "deg": {}, "flats": false, "strings": null}, {"type": "scale", "title": "One string solo: the B string", "root": "A", "iv": [0, 3, 5, 7, 10], "frets": [0, 17], "hl": [], "cap": null, "deg": {}, "flats": false, "strings": [2]}], "goal": "Improvise 2 minutes over a backing track using phrases with gaps", "ex": ["Three note limit", "One string solo", "Question and answer", "Repeat and vary", "Steal 5 licks"], "bt": ["am-jam"], "drone": null}, {"num": 23, "title": "Ear training", "phase": 2, "obj": "start hearing what you play, and play what you hear.", "lesson": [["Key concepts", "<ul>\n<li><strong>Three skills.<\/strong> Recognising intervals, singing back and finding melodies (melodic dictation), and recognising chord types (chord quality).<\/li>\n<li><strong>Chord qualities to learn this week:<\/strong> major, minor, dominant 7, major 7, minor 7.<\/li>\n<li><strong>Little and often.<\/strong> 10 to 15 minutes daily is far more effective than an hour once a week.<\/li>\n<\/ul>"], ["Exercises", "<p><strong>1. Interval refresh.<\/strong> Continue the Week 8 interval quiz, now including all intervals within an octave, both ascending and descending.<\/p>\n<p><strong>2. Melodic dictation.<\/strong><\/p>\n<ol>\n<li>Play or have an app play a short 3 to 5 note phrase within one octave.<\/li>\n<li>Sing it back.<\/li>\n<li>Find the first note on the guitar.<\/li>\n<li>Work out the rest by trial and correction.<\/li>\n<\/ol>\n<p>Start with phrases using only the major scale, then add minor and pentatonic phrases.<\/p>\n<p><strong>3. Chord quality quiz.<\/strong> Have an app (or a friend, or recordings of yourself) play random chords. Name each as major, minor, dominant 7, major 7 or minor 7. Start with just major and minor.<\/p>\n<p><strong>4. Progression hearing.<\/strong> Listen to I IV V and I V vi IV progressions in different keys, and say which you hear.<\/p>"], ["Watch out for", "<ul>\n<li>Guessing too fast. Sing the root, then the third, before you answer.<\/li>\n<\/ul>"]], "days": [["Days 1 to 2", "interval refresh; dictation with 3 note phrases."], ["Days 3 to 4", "dictation with 4 to 5 note phrases; major and minor chord quiz."], ["Days 5 to 6", "add 7th chords to the quiz; progression hearing."]], "sunday": "Film yourself doing a 10 question chord quality quiz and log your score. Target: 8 out of 10.", "boards": [{"type": "chord", "title": "A major", "notes": [[5, 0], [4, 2], [3, 2], [2, 2], [1, 0]], "muted": [6], "root": "A", "cap": null, "flats": false}, {"type": "chord", "title": "A minor", "notes": [[5, 0], [4, 2], [3, 2], [2, 1], [1, 0]], "muted": [6], "root": "A", "cap": null, "flats": false}, {"type": "chord", "title": "A7", "notes": [[5, 0], [4, 2], [3, 0], [2, 2], [1, 0]], "muted": [6], "root": "A", "cap": null, "flats": false}, {"type": "chord", "title": "Amaj7", "notes": [[5, 0], [4, 2], [3, 1], [2, 2], [1, 0]], "muted": [6], "root": "A", "cap": null, "flats": false}, {"type": "chord", "title": "Am7", "notes": [[5, 0], [4, 2], [3, 0], [2, 1], [1, 0]], "muted": [6], "root": "A", "cap": null, "flats": false}], "goal": "Identify major, minor and dominant 7th chords by ear, 8 out of 10", "ex": ["Interval refresh", "Melodic dictation", "Chord quality quiz", "Progression hearing"], "bt": [], "drone": "A"}, {"num": 24, "title": "Transcription", "phase": 2, "obj": "learn music entirely by ear. This is the single most powerful skill for a self-taught player.", "lesson": [["Key concepts", "<ul>\n<li><strong>Choose well.<\/strong> Start with something slow, clear and short: a vocal melody, a simple riff or a slow blues solo. 8 bars is plenty.<\/li>\n<li><strong>Slow it down.<\/strong> Use the playback speed setting on YouTube, or software that slows audio without changing pitch.<\/li>\n<li><strong>Work in tiny chunks.<\/strong> One phrase, even 3 or 4 notes, at a time.<\/li>\n<li><strong>Find the key first.<\/strong> If you know the key and scale, there are only 5 to 7 likely notes, not 12.<\/li>\n<li><strong>Write it down.<\/strong> Put each phrase into Guitar Pro or MuseScore as you go.<\/li>\n<\/ul>"], ["The method", "<ol>\n<li>Listen to the whole piece several times, humming along.<\/li>\n<li>Find the key: hum the note that sounds like home, then find it on the guitar.<\/li>\n<li>Loop the first phrase at 50 to 75% speed.<\/li>\n<li>Sing it, then find the first note on the guitar.<\/li>\n<li>Work out the remaining notes, checking against the recording.<\/li>\n<li>Work out the rhythm and write it in tab software.<\/li>\n<li>Once all phrases are done, play along at full speed.<\/li>\n<li>Finally, copy the feel: the bends, slides and vibrato.<\/li>\n<\/ol>"], ["Exercises", "<p><strong>1. A vocal melody.<\/strong> Days 1 to 2: transcribe the chorus melody of a song you know well.<\/p>\n<p><strong>2. A riff.<\/strong> Day 3: transcribe a short guitar riff.<\/p>\n<p><strong>3. A short solo.<\/strong> Days 4 to 6: transcribe 8 or more bars of a slow solo.<\/p>"], ["Watch out for", "<ul>\n<li>Looking up the tab when it gets hard. The struggle is what trains the ear. Check a tab only after you finish, to compare.<\/li>\n<\/ul>"]], "days": [], "sunday": "Play your transcribed solo along with the original recording.", "boards": [{"type": "scale", "title": "Key of A minor: the likely notes", "root": "A", "iv": [0, 2, 3, 5, 7, 8, 10], "frets": [0, 12], "hl": [], "cap": "Once you know the key, only these notes are likely.", "deg": {}, "flats": false, "strings": null}], "goal": "Learn a short solo or melody (8 bars or more) with no tab", "ex": ["A vocal melody", "A riff", "A short solo"], "bt": [], "drone": null}, {"num": 25, "title": "Fingerstyle", "phase": 2, "obj": "learn to play with your fingers, including Travis picking, and play one complete arrangement.", "lesson": [["Key concepts", "<ul>\n<li><strong>Finger names (PIMA):<\/strong> P thumb, I index, M middle, A ring.<\/li>\n<li><strong>Basic assignment.<\/strong> Thumb plays the bass strings (E, A, D). Index, middle and ring take the G, B and e strings respectively.<\/li>\n<li><strong>Travis picking.<\/strong> The thumb keeps a steady alternating bass, one note per beat, while the fingers play melody or chord notes between the beats. The thumb is the drummer: it must never stop.<\/li>\n<li><strong>Three components of good fingerstyle:<\/strong> a steady bass line, a clear melody on top, and a consistent volume balance between them.<\/li>\n<\/ul>"], ["Exercises", "<p><strong>1. Finger independence.<\/strong> Hold a C chord. Thumb on A string, then index on G, middle on B, ring on e. Play <code>P I M A M I<\/code> in a loop at 60 BPM.<\/p>\n<p><strong>2. Travis pattern on C.<\/strong> Thumb alternates between A and D strings on the beats; fingers fill in on the \"and\":<\/p>\n<pre><code>     1   &amp;   2   &amp;   3   &amp;   4   &amp;\ne|-----------------------------0---|\nB|-----1---------------1-----------|\nG|-------------0-------------------|\nD|---------2---------------2-------|\nA|-3---------------3---------------|\n<\/code><\/pre>\n<p>Then apply the same idea to G (thumb alternating low E and D strings), Am and D.<\/p>\n<p><strong>3. Thumb only.<\/strong> Play just the alternating bass for 2 minutes until it is automatic. Then add the fingers back.<\/p>\n<p><strong>4. An arrangement.<\/strong> Choose a traditional song in the public domain, such as House of the Rising Sun or Scarborough Fair, or a simple fingerstyle arrangement of a song you like, and learn it all the way through.<\/p>"], ["Watch out for", "<ul>\n<li>The thumb stopping or stumbling when the melody gets busy. Go back to thumb only, then add one finger at a time.<\/li>\n<\/ul>"]], "days": [["Days 1 to 2", "PIMA exercises; thumb only bass."], ["Days 3 to 4", "Travis pattern on C, G, Am and D."], ["Days 5 to 6", "learn your chosen arrangement."]], "sunday": "Your full fingerstyle arrangement.", "boards": [{"type": "chord", "title": "C with finger assignment", "notes": [[5, 3, "P"], [4, 2, "P"], [3, 0, "I"], [2, 1, "M"], [1, 0, "A"]], "muted": [6], "root": "C", "cap": "Switch to Fingers: thumb (P) alternates A and D strings.", "flats": false}, {"type": "chord", "title": "G with finger assignment", "notes": [[6, 3, "P"], [5, 2], [4, 0, "P"], [3, 0, "I"], [2, 0, "M"], [1, 3, "A"]], "muted": [], "root": "G", "cap": null, "flats": false}], "goal": "Play one fingerstyle arrangement of a song all the way through", "ex": ["Finger independence", "Travis pattern on C", "Thumb only", "An arrangement"], "bt": [], "drone": null}, {"num": 26, "title": "Key identification and Checkpoint 2", "phase": 2, "obj": "find the key of any song by ear, spot key changes, and test yourself against Phase 2.", "lesson": [["Key concepts", "<ul>\n<li><strong>Find home.<\/strong> Hum the note that feels most resolved, the one a song wants to end on. Find it on the guitar. That is your likely tonic.<\/li>\n<li><strong>Major or minor?<\/strong> Play the major and minor chord on that note along with the song. Whichever fits is the key.<\/li>\n<li><strong>Check the chords.<\/strong> List the chords you hear. Do they fit the diatonic chords of that key (Week 7)?<\/li>\n<li><strong>Key changes.<\/strong> When a chord outside the key appears and the \"home\" note seems to move, the key has changed. Common changes: up a semitone or tone for a final chorus, or to the relative major or minor.<\/li>\n<li><strong>Borrowed chords and V7 chords<\/strong> (like an E7 in A minor) are not key changes. They are common colour within a key.<\/li>\n<\/ul>"], ["Exercises", "<p><strong>1. Days 1 to 2: find the key<\/strong> of 5 songs by ear. Check your answers online afterwards.<\/p>\n<p><strong>2. Day 3: key changes.<\/strong> Find 2 songs with a clear key change and identify where and to which key.<\/p>"], ["Checkpoint 2 (Days 4 to 6)", "<ul>\n<li class=\"task\" data-task=\"cp1\">Name any note on all six strings within 3 seconds<\/li>\n<li class=\"task\" data-task=\"cp2\">Bends in tune, with controlled vibrato<\/li>\n<li class=\"task\" data-task=\"cp3\">Picking speed up at least 15 BPM from your Week 16 baseline<\/li>\n<li class=\"task\" data-task=\"cp4\">Play all seven modes and describe how each sounds<\/li>\n<li class=\"task\" data-task=\"cp5\">Pentatonic across the whole neck without stopping<\/li>\n<li class=\"task\" data-task=\"cp6\">Transcribe a short melody by ear<\/p>\n<\/li>\n<li>\n<p><strong>Day 4:<\/strong> run every item, record, score each as Pass, Close or Not yet.<\/p>\n<\/li>\n<li><strong>Day 5:<\/strong> fix your weakest items.<\/li>\n<li><strong>Day 6:<\/strong> retest and record.<\/li>\n<\/ul>"], ["If you did not pass everything", "<p>Take an extra week before Phase 3. Phase 3 relies heavily on the pentatonic shapes, modes and clean technique.<\/p>"], ["Maintenance list going into Phase 3", "<p>Add to your rotation: the five pentatonic shapes, bends against a target, one mode a day over a drone, and 5 minutes of ear training.<\/p>"]], "days": [], "sunday": "Your full Checkpoint 2 run. Watch it alongside your Week 13 clip.", "boards": [{"type": "scale", "title": "G major across the neck", "root": "G", "iv": [0, 2, 4, 5, 7, 9, 11], "frets": [0, 12], "hl": [], "cap": null, "deg": {}, "flats": false, "strings": null}, {"type": "scale", "title": "E minor pentatonic, the relative minor", "root": "E", "iv": [0, 3, 5, 7, 10], "frets": [0, 12], "hl": [], "cap": null, "deg": {}, "flats": false, "strings": null}], "goal": "Find the key of 3 songs by ear, then complete Checkpoint 2", "ex": ["Days 1 to 2: find the key", "Day 3: key changes"], "bt": [], "drone": null}, {"num": 27, "title": "Tapping", "phase": 3, "obj": "use the picking hand on the fretboard to play wide, fast arpeggios.", "lesson": [["Key concepts", "<ul>\n<li><strong>The tap.<\/strong> Use the middle finger of your picking hand (so you can keep hold of the pick) to hammer onto a fret. Then pull it off sideways, plucking the string, to sound a note held by your fretting hand.<\/li>\n<li><strong>The basic cycle.<\/strong> Tap, pull off to the fretted note, hammer on with another fretting finger, tap again.<\/li>\n<li><strong>Muting is everything.<\/strong> Rest the palm of the picking hand lightly on the lower strings, and let the fretting hand's spare fingers touch the strings above, so only one string sounds.<\/li>\n<\/ul>"], ["Exercises", "<p><strong>1. A minor tapped arpeggio<\/strong> on the high e string. Tap 12 (E), pull off to 5 (A), hammer on 8 (C):<\/p>\n<pre><code>e|--t12p5h8--t12p5h8--t12p5h8--t12p5h8--|\n<\/code><\/pre>\n<p>Loop it in triplets, starting at 60 BPM.<\/p>\n<p><strong>2. Chord progression.<\/strong> Move the same idea through Am, F, G and Em, one bar each:<\/p>\n<pre><code>     Am            F             G              Em\ne|--t12p5h8-----t13p5h8------t15p7h10------t12p3h7----|\n<\/code><\/pre>\n<p>(Am: E A C. F: F A C. G: G B D. Em: E G B.)<\/p>\n<p><strong>3. Two finger tapping.<\/strong> Tap 15 with the middle finger and 12 with the index finger of the picking hand, then pull off to the fretted notes: <code>t15 p t12 p5 h8<\/code>. This gives an Am7 sound (G E A C).<\/p>\n<p><strong>4. Tapped melody.<\/strong> Write a short melody using the progression from exercise 2, varying which tapped note you use (any note of the chord works).<\/p>"], ["Watch out for", "<ul>\n<li>Other strings ringing. Record with distortion to expose noise; if it sounds clean distorted, it is clean.<\/li>\n<li>Tapping too lightly. A firm, quick tap gives a strong note.<\/li>\n<\/ul>"]], "days": [["Days 1 to 2", "basic cycle and muting; the Am arpeggio."], ["Days 3 to 4", "the four chord progression in time."], ["Days 5 to 6", "two finger tapping; write and play your tapped melody."]], "sunday": "The four chord tapping progression, four times through, cleanly in time.", "boards": [{"type": "notes", "title": "Am tapping", "notes": [[1, 12, "t"], [1, 5, "1"], [1, 8, "4"]], "root": "A", "frets": [3, 16], "cap": null, "flats": false, "hlpos": []}, {"type": "notes", "title": "F tapping", "notes": [[1, 13, "t"], [1, 5, "1"], [1, 8, "4"]], "root": "F", "frets": [3, 16], "cap": null, "flats": false, "hlpos": []}, {"type": "notes", "title": "G tapping", "notes": [[1, 15, "t"], [1, 7, "1"], [1, 10, "4"]], "root": "G", "frets": [3, 16], "cap": null, "flats": false, "hlpos": []}, {"type": "notes", "title": "Em tapping", "notes": [[1, 12, "t"], [1, 3, "1"], [1, 7, "4"]], "root": "E", "frets": [2, 16], "cap": null, "flats": false, "hlpos": []}], "goal": "Play a tapped melody cleanly at a slow tempo", "ex": ["A minor tapped arpeggio", "Chord progression", "Two finger tapping", "Tapped melody"], "bt": ["tap-prog"], "drone": null}, {"num": 28, "title": "Hybrid picking", "phase": 3, "obj": "combine the pick with your middle and ring fingers for string skipping, country licks and wide intervals.", "lesson": [["Key concepts", "<ul>\n<li><strong>Hybrid picking<\/strong> means the pick handles the lower strings while the middle (m) and ring (a) fingers pluck the higher strings.<\/li>\n<li><strong>Why use it.<\/strong> Large string skips become easy, you can play chord tones at the same time, and it creates a snappy, percussive tone popular in country, funk and rock.<\/li>\n<li><strong>Snap.<\/strong> Pull the string slightly up and away from the body with the finger for a bright pop.<\/li>\n<\/ul>"], ["Exercises", "<p><strong>1. Pick plus one finger.<\/strong> Hold a C chord. Pick the A string, then pluck the B string with the middle finger, alternating:<\/p>\n<pre><code>      D   m   D   m   D   m   D   m\ne|--------------------------------------|\nB|------1-------1-------1-------1-------|\nG|--------------------------------------|\nD|--------------2---------------2-------|\nA|--3-------------------3---------------|\n<\/code><\/pre>\n<p><strong>2. Pick plus two fingers.<\/strong> Pick the D string, middle on B, ring on e, as a three note roll over a G chord shape (320003).<\/p>\n<p><strong>3. Pinch.<\/strong> Pick a bass note and pluck a higher note at the same moment. Alternate bass note and pinch over a progression.<\/p>\n<p><strong>4. Wide interval line.<\/strong> Play an A major scale using hybrid picking to cross strings: pick the note on the D string, pluck the next note on the B string with the middle finger.<\/p>\n<p><strong>5. A country style lick.<\/strong> Combine a pick on the G string with the middle finger snapping the B string, moving through a C, F, G progression.<\/p>"], ["Watch out for", "<ul>\n<li>The pick hand clenching. Hold the pick lightly with thumb and index finger, keeping the other fingers relaxed and curled.<\/li>\n<\/ul>"]], "days": [["Days 1 to 2", "pick plus one finger; snap."], ["Days 3 to 4", "pick plus two fingers; pinches."], ["Days 5 to 6", "wide interval lines; write a hybrid picked pattern for a chord progression."]], "sunday": "A hybrid picked pattern over a four chord progression, played four times through.", "boards": [{"type": "chord", "title": "C: pick and middle finger", "notes": [[5, 3, "p"], [4, 2, "p"], [3, 0], [2, 1, "m"], [1, 0, "a"]], "muted": [6], "root": "C", "cap": "Switch to Fingers: p is the pick, m the middle finger, a the ring finger.", "flats": false}, {"type": "chord", "title": "G roll", "notes": [[6, 3], [5, 2], [4, 0, "p"], [3, 0], [2, 0, "m"], [1, 3, "a"]], "muted": [], "root": "G", "cap": null, "flats": false}], "goal": "Play a hybrid picked pattern over a chord progression", "ex": ["Pick plus one finger", "Pick plus two fingers", "Pinch", "Wide interval line", "A country style lick"], "bt": ["c-amfg"], "drone": null}, {"num": 29, "title": "Sweep picking", "phase": 3, "obj": "play clean, fast arpeggios across three strings, then five.", "lesson": [["Key concepts", "<ul>\n<li><strong>The sweep.<\/strong> One continuous pick motion across several strings, playing one note per string, like a very slow, controlled strum.<\/li>\n<li><strong>Rolling and lifting.<\/strong> Each fretting finger lifts as soon as its note has sounded, so notes do not ring together. This muting is the whole skill.<\/li>\n<li><strong>Speed comes last.<\/strong> Practise slowly enough that every note is distinct and none overlap.<\/li>\n<\/ul>"], ["Exercises", "<p><strong>1. Muted sweep.<\/strong> Lightly lay your fretting hand over the strings (muted) and sweep down then up across three strings. Feel the single motion.<\/p>\n<p><strong>2. Three string A minor<\/strong> (E A C E). Downstrokes across G, B and e in one motion, hammer on, pull off, then upstrokes back across e, B and G:<\/p>\n<pre><code>e|---------------8h12p8---------|\nB|------------10---------10-----|\nG|---------9----------------9---|\n<\/code><\/pre>\n<p><strong>3. Three string C major<\/strong> (G C E G):<\/p>\n<pre><code>e|-------------12h15p12-------------|\nB|---------13--------------13-------|\nG|-----12----------------------12---|\n<\/code><\/pre>\n<p><strong>4. Five string A minor<\/strong> with the root on the A string (A E A C E A):<\/p>\n<pre><code>e|-------------------12h17p12-------------------|\nB|----------------13--------------13------------|\nG|-------------14--------------------14---------|\nD|----------14--------------------------14------|\nA|------12----------------------------------12--|\n<\/code><\/pre>\n<p>Down sweep from the A string to the high e, hammer and pull off at the top, up sweep back.<\/p>\n<p><strong>5. Arpeggio progression.<\/strong> Combine the three string shapes into Am to C to G (find the G major three string shape yourself: G B D G).<\/p>"], ["Watch out for", "<ul>\n<li>Notes blurring into a chord. If two notes ring together, you are not lifting the previous finger.<\/li>\n<li>Picking each note individually. It should be one smooth push down and one pull up.<\/li>\n<\/ul>"]], "days": [["Days 1 to 2", "muted sweeps; three string Am at 50 BPM."], ["Days 3 to 4", "three string C major; arpeggio progression."], ["Days 5 to 6", "five string Am; raise tempo by 5 BPM steps."]], "sunday": "Three string Am and C, then the five string Am, each four times slowly and cleanly. Use distortion so overlapping notes are audible.", "boards": [{"type": "notes", "title": "Three string A minor sweep", "notes": [[3, 9], [2, 10], [1, 8], [1, 12]], "root": "A", "frets": [7, 13], "cap": null, "flats": false, "hlpos": []}, {"type": "notes", "title": "Three string C major sweep", "notes": [[3, 12], [2, 13], [1, 12], [1, 15]], "root": "C", "frets": [11, 16], "cap": null, "flats": false, "hlpos": []}, {"type": "notes", "title": "Five string A minor sweep", "notes": [[5, 12], [4, 14], [3, 14], [2, 13], [1, 12], [1, 17]], "root": "A", "frets": [11, 18], "cap": null, "flats": false, "hlpos": []}], "goal": "Sweep a major and minor arpeggio cleanly, no notes ringing together", "ex": ["Muted sweep", "Three string A minor", "Three string C major", "Five string A minor", "Arpeggio progression"], "bt": ["sweep-prog"], "drone": null}, {"num": 30, "title": "Economy picking", "phase": 3, "obj": "learn when continuing the pick direction is more efficient than strict alternate picking.", "lesson": [["Key concepts", "<ul>\n<li><strong>Economy picking<\/strong> alternates on each string, but when you change string in the direction the pick is already travelling, you keep going (a small sweep).<\/li>\n<li><strong>Three notes per string ascending:<\/strong> D U D on the first string, then D U D on the next (the last down continues into the next string's down).<\/li>\n<li><strong>Three notes per string descending:<\/strong> U D U, then U D U.<\/li>\n<li><strong>The trade-off.<\/strong> Economy is smoother and saves motion; alternate picking gives more even rhythm and accents. Most players mix both.<\/li>\n<\/ul>"], ["Exercises", "<p><strong>1. Two string economy.<\/strong> A natural minor, position 5, on the A and D strings only:<\/p>\n<pre><code>       D U D  D U D\nD|------------5-7-9-|\nA|------5-7-8-------|\n<\/code><\/pre>\n<p><strong>2. Full scale economy.<\/strong> The Week 16 three notes per string A minor scale (position 5), ascending D U D on every string, descending U D U.<\/p>\n<p><strong>3. Five note groups.<\/strong> Play groups of five notes across two strings (3 + 2). Economy picking handles odd groupings well; compare with alternate picking.<\/p>\n<p><strong>4. Comparison.<\/strong> Play one line with strict alternate picking and then with economy picking. Record both and decide which is cleaner and more even for you.<\/p>"], ["Watch out for", "<ul>\n<li>Uneven rhythm. The \"sweep\" between strings tends to rush. Use a metronome and count.<\/li>\n<\/ul>"]], "days": [["Days 1 to 2", "two string economy; full scale ascending."], ["Days 3 to 4", "full scale descending; five note groups."], ["Days 5 to 6", "apply economy to a line from a solo you know; comparison recording."]], "sunday": "The full A minor three notes per string scale up and down, first alternate picked, then economy picked, at the same tempo.", "boards": [{"type": "notes", "title": "Economy picking, ascending", "notes": [[6, 5, "D"], [6, 7, "U"], [6, 8, "D"], [5, 5, "D"], [5, 7, "U"], [5, 8, "D"], [4, 5, "D"], [4, 7, "U"], [4, 9, "D"], [3, 5, "D"], [3, 7, "U"], [3, 9, "D"], [2, 6, "D"], [2, 8, "U"], [2, 10, "D"], [1, 7, "D"], [1, 8, "U"], [1, 10, "D"]], "root": "A", "frets": [4, 10], "cap": "Switch to Fingers to see each stroke: D down, U up.", "flats": false, "hlpos": []}], "goal": "Play one line both ways and record which is cleaner", "ex": ["Two string economy", "Full scale economy", "Five note groups", "Comparison"], "bt": [], "drone": null}, {"num": 31, "title": "Improvising with the modes, part 1", "phase": 3, "obj": "avoid the most common improvisation mistakes, and solo convincingly in Ionian, Dorian and Mixolydian.", "lesson": [["Key concepts", "<p><strong>Seven common improvisation mistakes:<\/strong><\/p>\n<ol>\n<li>Running scales up and down instead of playing phrases<\/li>\n<li>Using one rhythm for everything<\/li>\n<li>Never leaving space<\/li>\n<li>Ignoring the chords underneath<\/li>\n<li>Starting every phrase on the root<\/li>\n<li>Playing the same licks in the same box<\/li>\n<li>Not having an ending in mind: every phrase needs a landing note<\/li>\n<\/ol>\n<p><strong>The three most useful modes and their vamps:<\/strong><\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Mode<\/th>\n<th>Vamp<\/th>\n<th>Character note to target<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>A Ionian<\/td>\n<td>Amaj7 to Dmaj7<\/td>\n<td>G# (the major 7)<\/td>\n<\/tr>\n<tr>\n<td>A Dorian<\/td>\n<td>Am7 to D7<\/td>\n<td>F# (the natural 6)<\/td>\n<\/tr>\n<tr>\n<td>A Mixolydian<\/td>\n<td>A to G<\/td>\n<td>G (the flat 7)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>"], ["Exercises", "<p><strong>1. Mistake audit.<\/strong> Record 1 minute of improvising over any vamp. Listen back and tick which of the seven mistakes you made.<\/p>\n<p><strong>2. Ionian.<\/strong> 3 minutes over Amaj7 to Dmaj7, landing on G# or C# at each chord change.<\/p>\n<p><strong>3. Dorian.<\/strong> 3 minutes over Am7 to D7. Use the F# whenever the D7 arrives; it is the third of D7.<\/p>\n<p><strong>4. Mixolydian.<\/strong> 3 minutes over A to G. Land on G over the G chord, and on A or C# over the A chord.<\/p>\n<p><strong>5. Phrase starts.<\/strong> Over each vamp, start phrases on the 3rd, 5th or 7th of the chord instead of the root.<\/p>"], ["Watch out for", "<ul>\n<li>Slipping back into A minor pentatonic. It fits Dorian, but it hides the character note. Use full mode.<\/li>\n<\/ul>"]], "days": [["Days 1 to 2", "mistake audit; Ionian."], ["Days 3 to 4", "Dorian."], ["Days 5 to 6", "Mixolydian; phrase start exercise across all three."]], "sunday": "1 minute each over the Ionian, Dorian and Mixolydian vamps. Repeat the mistake audit on the recording.", "boards": [{"type": "scale", "title": "A Ionian", "root": "A", "iv": [0, 2, 4, 5, 7, 9, 11], "frets": [4, 8], "hl": [11], "cap": null, "deg": {}, "flats": false, "strings": null}, {"type": "scale", "title": "A Dorian", "root": "A", "iv": [0, 2, 3, 5, 7, 9, 10], "frets": [4, 8], "hl": [9], "cap": null, "deg": {}, "flats": false, "strings": null}, {"type": "scale", "title": "A Mixolydian", "root": "A", "iv": [0, 2, 4, 5, 7, 9, 10], "frets": [4, 8], "hl": [10], "cap": null, "deg": {}, "flats": false, "strings": null}], "goal": "Solo over a vamp in each mode, 1 minute each", "ex": ["Mistake audit", "Ionian", "Dorian", "Mixolydian", "Phrase starts"], "bt": ["a-ionian", "a-dorian", "a-mixo"], "drone": "A"}, {"num": 32, "title": "Improvising with the modes, part 2", "phase": 3, "obj": "add Phrygian, Lydian and Aeolian to your soloing, and always know which chord you are over.", "lesson": [["Key concepts", "<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Mode<\/th>\n<th>Vamp<\/th>\n<th>Character note to target<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>A Phrygian<\/td>\n<td>Am to Bb<\/td>\n<td>Bb (the flat 2)<\/td>\n<\/tr>\n<tr>\n<td>A Lydian<\/td>\n<td>A to B<\/td>\n<td>D# (the sharp 4)<\/td>\n<\/tr>\n<tr>\n<td>A Aeolian<\/td>\n<td>Am to F to G<\/td>\n<td>F (the flat 6)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li><strong>Know the chord.<\/strong> At any moment you should be able to say which chord is playing and which notes are its root, 3rd and 5th. Ears first, then theory.<\/li>\n<li><strong>Chord tones are safe landing notes.<\/strong> Scale notes between them are passing notes.<\/li>\n<\/ul>"], ["Exercises", "<p><strong>1. Phrygian.<\/strong> 3 minutes over Am to Bb. Use the Bb over the Bb chord for a dark, Spanish flavour.<\/p>\n<p><strong>2. Lydian.<\/strong> 3 minutes over A to B. Land on D# over B (it is the third of B major).<\/p>\n<p><strong>3. Aeolian.<\/strong> 3 minutes over Am, F, G. Land on F over the F chord, G or B over G.<\/p>\n<p><strong>4. Chord call out.<\/strong> While improvising over any vamp, say the chord name aloud each time it changes.<\/p>\n<p><strong>5. Mode switch.<\/strong> Record a vamp that alternates 8 bars of Am7 to D7 (Dorian) with 8 bars of Am to F to G (Aeolian). Switch mode with the chords.<\/p>"], ["Watch out for", "<ul>\n<li>Losing your place. If you do, stop playing, listen for the next chord change, and come back in on it.<\/li>\n<\/ul>"]], "days": [["Days 1 to 2", "Phrygian and Lydian."], ["Days 3 to 4", "Aeolian; chord call out."], ["Days 5 to 6", "mode switch exercise."]], "sunday": "1 minute each over the Phrygian, Lydian and Aeolian vamps, then the mode switch.", "boards": [{"type": "scale", "title": "A Phrygian", "root": "A", "iv": [0, 1, 3, 5, 7, 8, 10], "frets": [4, 8], "hl": [1], "cap": null, "deg": {}, "flats": true, "strings": null}, {"type": "scale", "title": "A Lydian", "root": "A", "iv": [0, 2, 4, 6, 7, 9, 11], "frets": [4, 8], "hl": [6], "cap": null, "deg": {"6": "#4"}, "flats": false, "strings": null}, {"type": "scale", "title": "A Aeolian", "root": "A", "iv": [0, 2, 3, 5, 7, 8, 10], "frets": [4, 8], "hl": [8], "cap": null, "deg": {}, "flats": false, "strings": null}], "goal": "Solo over a vamp in each mode, 1 minute each", "ex": ["Phrygian", "Lydian", "Aeolian", "Chord call out", "Mode switch"], "bt": ["a-phryg", "a-lydian", "a-aeol"], "drone": "A"}, {"num": 33, "title": "Structured improvisation drills", "phase": 3, "obj": "move freely between scale shapes and target chord tones on every change.", "lesson": [["Key concepts", "<p>These five levels use a C major progression: <strong>Dm7, G7, Cmaj7, Am7<\/strong> (ii V I vi). All four chords come from C major, so one scale covers them, but each chord has its own chord tones:<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Chord<\/th>\n<th>Chord tones<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Dm7<\/td>\n<td>D F A C<\/td>\n<\/tr>\n<tr>\n<td>G7<\/td>\n<td>G B D F<\/td>\n<\/tr>\n<tr>\n<td>Cmaj7<\/td>\n<td>C E G B<\/td>\n<\/tr>\n<tr>\n<td>Am7<\/td>\n<td>A C E G<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>"], ["The five levels", "<p><strong>Level 1: switching scale shapes over one chord.<\/strong> Vamp on Cmaj7. Improvise for 4 bars in one C major position, pause, then 4 bars in another position. Repeat across three positions.<\/p>\n<p><strong>Level 2: switching shapes with no breaks.<\/strong> Same, but move from one position to the next mid-phrase, sliding or shifting so the music never stops.<\/p>\n<p><strong>Level 3: targeting chord tones over two chords.<\/strong> Vamp Dm7 to G7, two bars each. Land on a chord tone of the new chord on beat 1 of every change. Start with whole notes on chord tones only, then add scale notes in between.<\/p>\n<p><strong>Level 4: targeting chord tones over four chords.<\/strong> The full Dm7, G7, Cmaj7, Am7 loop, one bar each. Land on a chord tone at every change.<\/p>\n<p><strong>Level 5: four chords with no breaks.<\/strong> Continuous eighth note lines over the loop, always hitting a chord tone on beat 1.<\/p>"], ["Exercises", "<ol>\n<li>Arpeggios first: play each chord's arpeggio in one position before starting Level 3.<\/li>\n<li>Guide tones: over the four chord loop, play only the 3rds and 7ths (F and C over Dm7, B and F over G7, E and B over Cmaj7, C and G over Am7). Notice how they move by tiny steps.<\/li>\n<li>Then work through the levels.<\/li>\n<\/ol>"], ["Watch out for", "<ul>\n<li>Jumping to the root every time. The 3rd and 7th sound more musical as landing notes.<\/li>\n<\/ul>"]], "days": [["Days 1 to 2", "levels 1 and 2."], ["Days 3 to 4", "arpeggios; guide tones; level 3."], ["Days 5 to 6", "levels 4 and 5."]], "sunday": "Level 5 over the four chord loop for 2 minutes.", "boards": [{"type": "scale", "title": "Dm7 chord tones", "root": "D", "iv": [0, 3, 7, 10], "frets": [4, 8], "hl": [3, 10], "cap": "Guide tones (3rd and 7th) highlighted", "deg": {}, "flats": false, "strings": null}, {"type": "scale", "title": "G7 chord tones", "root": "G", "iv": [0, 4, 7, 10], "frets": [4, 8], "hl": [4, 10], "cap": null, "deg": {}, "flats": false, "strings": null}, {"type": "scale", "title": "Cmaj7 chord tones", "root": "C", "iv": [0, 4, 7, 11], "frets": [4, 8], "hl": [4, 11], "cap": null, "deg": {}, "flats": false, "strings": null}, {"type": "scale", "title": "Am7 chord tones", "root": "A", "iv": [0, 3, 7, 10], "frets": [4, 8], "hl": [3, 10], "cap": null, "deg": {}, "flats": false, "strings": null}], "goal": "Land on a chord tone at every chord change over a 4 chord loop", "ex": ["Level 1: switching scale shapes over one chord", "Level 2: switching shapes with no breaks", "Level 3: targeting chord tones over two chords", "Level 4: targeting chord tones over four chords", "Level 5: four chords with no breaks"], "bt": ["ii-v-i-vi", "dm-g7"], "drone": null}, {"num": 34, "title": "The blues", "phase": 3, "obj": "understand the 12 bar blues and solo over it while following the chord changes.", "lesson": [["Key concepts", "<ul>\n<li><strong>The 12 bar form in A<\/strong> (one chord per bar):<\/li>\n<\/ul>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Bars 1 to 4<\/th>\n<th>Bars 5 to 8<\/th>\n<th>Bars 9 to 12<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>A7, A7, A7, A7<\/td>\n<td>D7, D7, A7, A7<\/td>\n<td>E7, D7, A7, E7<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>A common variation (the \"quick change\") puts D7 in bar 2.<\/p>\n<ul>\n<li><strong>The blues scale<\/strong> is the minor pentatonic plus the flat 5: A C D Eb E G. In shape 1 (fret 5), the extra Eb sits at fret 6 on the A string and fret 8 on the G string.<\/li>\n<li><strong>Mixing major and minor.<\/strong> Over A7, the major 3rd (C#) sounds sweet and the minor 3rd (C) sounds bluesy. Bending C slightly towards C# is the classic blues sound.<\/li>\n<li><strong>Dominant 7 arpeggios:<\/strong><\/li>\n<\/ul>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Chord<\/th>\n<th>Notes<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>A7<\/td>\n<td>A C# E G<\/td>\n<\/tr>\n<tr>\n<td>D7<\/td>\n<td>D F# A C<\/td>\n<\/tr>\n<tr>\n<td>E7<\/td>\n<td>E G# B D<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>"], ["Exercises", "<p><strong>1. Play the form.<\/strong> Comp through the 12 bar in A using 7th chords or shell voicings until you can feel where you are without counting.<\/p>\n<p><strong>2. Blues scale shapes.<\/strong> Play the blues scale in shapes 1 and 2.<\/p>\n<p><strong>3. Arpeggio workout.<\/strong> Play A7, D7 and E7 arpeggios in one position (around fret 5), then move through them in time with the 12 bar.<\/p>\n<p><strong>4. Targeting.<\/strong> Solo over the 12 bar, landing on C# over A7, F# over D7 and G# over E7.<\/p>\n<p><strong>5. Blues in C.<\/strong> Transfer everything to C (C7, F7, G7). Repeat the targeting exercise.<\/p>"], ["Watch out for", "<ul>\n<li>Playing the same phrase over every chord. The change to D7 in bar 5 is the moment to show you heard it.<\/li>\n<\/ul>"]], "days": [["Days 1 to 2", "the form; blues scale shapes."], ["Days 3 to 4", "dominant 7 arpeggios; targeting in A."], ["Days 5 to 6", "blues in C; full solos over both."]], "sunday": "Two choruses (24 bars) of soloing over a blues in A, then two over a blues in C.", "boards": [{"type": "scale", "title": "A blues scale, shape 1", "root": "A", "iv": [0, 3, 5, 6, 7, 10], "frets": [5, 8], "hl": [6], "cap": "The blue note (Eb) highlighted", "deg": {"6": "b5"}, "flats": true, "strings": null}, {"type": "scale", "title": "A7 arpeggio", "root": "A", "iv": [0, 4, 7, 10], "frets": [4, 8], "hl": [4], "cap": "Target the major 3rd (C#)", "deg": {}, "flats": false, "strings": null}, {"type": "scale", "title": "D7 arpeggio", "root": "D", "iv": [0, 4, 7, 10], "frets": [4, 8], "hl": [4], "cap": null, "deg": {}, "flats": false, "strings": null}, {"type": "scale", "title": "E7 arpeggio", "root": "E", "iv": [0, 4, 7, 10], "frets": [4, 8], "hl": [4], "cap": null, "deg": {}, "flats": false, "strings": null}], "goal": "Improvise over a 12 bar blues in A and C, hitting the chord changes", "ex": ["Play the form", "Blues scale shapes", "Arpeggio workout", "Targeting", "Blues in C"], "bt": ["blues-a", "blues-c"], "drone": null}, {"num": 35, "title": "Minor blues, licks, turnarounds and voice leading", "phase": 3, "obj": "play over a minor blues and stop repeating the same ideas when you solo.", "lesson": [["Key concepts", "<ul>\n<li><strong>A common minor blues in A:<\/strong><\/li>\n<\/ul>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Bars 1 to 4<\/th>\n<th>Bars 5 to 8<\/th>\n<th>Bars 9 to 12<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Am7, Am7, Am7, Am7<\/td>\n<td>Dm7, Dm7, Am7, Am7<\/td>\n<td>F7, E7, Am7, E7<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li><strong>Minor 7 arpeggios:<\/strong> Am7 (A C E G), Dm7 (D F A C).<\/li>\n<li><strong>Learning licks properly.<\/strong> A lick is useful only when you can play it in more than one place, in more than one key, and vary it. Learn it, move it, change it.<\/li>\n<li><strong>Turnarounds<\/strong> are the last two bars of a blues, leading back to the top.<\/li>\n<li><strong>Voice leading in solos.<\/strong> At a chord change, move to the nearest note of the new chord. For example over Am7 to Dm7, move from E (in Am7) to F (in Dm7), one fret.<\/li>\n<\/ul>"], ["Exercises", "<p><strong>1. Minor 7 arpeggio workout.<\/strong> Am7 and Dm7 arpeggios in two positions each.<\/p>\n<p><strong>2. A classic turnaround in A:<\/strong><\/p>\n<pre><code>e|--5----5----5----5------0----|\nB|--8----7----6----5------0----|\nG|------------------------1----|\nD|------------------------0----|\nA|------------------------2----|\nE|------------------------0----|\n<\/code><\/pre>\n<p>A high A repeated over a chromatic line on the B string descending from G to E, landing on an open E7 chord. Learn it, then move it to C.<\/p>\n<p><strong>3. Three new licks.<\/strong> Learn three short blues licks. For each: play it in its original position, move it to another position, transpose it, then change its rhythm or last note.<\/p>\n<p><strong>4. Voice leading chain.<\/strong> Over the minor blues, play one long note per bar, moving to the nearest chord tone at each change.<\/p>"], ["Watch out for", "<ul>\n<li>Stringing licks together like a list. Leave space between them and link them with your own phrases.<\/li>\n<\/ul>"]], "days": [["Days 1 to 2", "minor blues form; minor 7 arpeggios."], ["Days 3 to 4", "turnarounds; learn three licks."], ["Days 5 to 6", "move and vary the licks; voice leading chain; full solos."]], "sunday": "Two choruses over a minor blues using your three licks (varied), and the turnaround.", "boards": [{"type": "scale", "title": "Am7 arpeggio", "root": "A", "iv": [0, 3, 7, 10], "frets": [4, 8], "hl": [], "cap": null, "deg": {}, "flats": false, "strings": null}, {"type": "scale", "title": "Dm7 arpeggio", "root": "D", "iv": [0, 3, 7, 10], "frets": [4, 8], "hl": [], "cap": null, "deg": {}, "flats": false, "strings": null}, {"type": "notes", "title": "The turnaround", "notes": [[1, 5], [2, 8], [2, 7], [2, 6], [2, 5]], "root": "A", "frets": [3, 9], "cap": null, "flats": false, "hlpos": []}], "goal": "Solo over a minor blues using 3 licks you learned this week", "ex": ["Minor 7 arpeggio workout", "A classic turnaround in A:", "Three new licks", "Voice leading chain"], "bt": ["minor-blues"], "drone": null}, {"num": 36, "title": "Taking your improvisation to the next level", "phase": 3, "obj": "break out of one position and make your solos sound like a conversation.", "lesson": [["Key concepts", "<ul>\n<li><strong>All positions.<\/strong> You already know the pentatonic and major scale shapes. Now use them in real solos, not just exercises.<\/li>\n<li><strong>Mixing scales with arpeggios.<\/strong> Use the scale for movement and arpeggios for strong, clear outlines of the chord.<\/li>\n<li><strong>Call and response.<\/strong> A musical conversation: play a short phrase (call), then answer it with a related phrase (response).<\/li>\n<li><strong>Five quick wins:<\/strong> start phrases on off-beats, use one repeated note rhythmically, vary dynamics (loud and soft), finish phrases with vibrato, and end your solo on a strong note rather than fading out.<\/li>\n<\/ul>"], ["Exercises", "<p><strong>1. Position ladder.<\/strong> Over a 12 bar blues in A, play one chorus in shape 1, the next in shape 2, and so on through all five.<\/p>\n<p><strong>2. Moving solo.<\/strong> Improvise for 2 minutes, deliberately moving to a new position every 4 bars.<\/p>\n<p><strong>3. Scale plus arpeggio.<\/strong> Over A7 to D7, play an A7 arpeggio, then continue with scale notes into a D7 arpeggio.<\/p>\n<p><strong>4. Call and response.<\/strong> Record yourself playing a 2 bar call every 4 bars, leaving 2 bars empty. Play back and improvise responses in the gaps.<\/p>\n<p><strong>5. The five quick wins.<\/strong> Spend 2 minutes on each, over any backing track.<\/p>"], ["Watch out for", "<ul>\n<li>Moving positions but playing the same ideas. Each new position should suggest new shapes and new phrases.<\/li>\n<\/ul>"]], "days": [["Days 1 to 2", "position ladder; moving solo."], ["Days 3 to 4", "scale plus arpeggio."], ["Days 5 to 6", "call and response; quick wins."]], "sunday": "2 minutes of improvising over a blues in A covering at least three positions, using call and response.", "boards": [{"type": "scale", "title": "A minor pentatonic, whole neck", "root": "A", "iv": [0, 3, 5, 7, 10], "frets": [0, 17], "hl": [], "cap": null, "deg": {}, "flats": false, "strings": null}, {"type": "scale", "title": "A7 arpeggio, whole neck", "root": "A", "iv": [0, 4, 7, 10], "frets": [0, 15], "hl": [4], "cap": null, "deg": {}, "flats": false, "strings": null}], "goal": "Improvise 2 minutes covering at least 3 positions of the neck", "ex": ["Position ladder", "Moving solo", "Scale plus arpeggio", "Call and response", "The five quick wins"], "bt": ["blues-a"], "drone": null}, {"num": 37, "title": "Jazz blues", "phase": 3, "obj": "handle a blues with more chord changes. Jazz blues forces you to follow the harmony and will sharpen your improvising fast.", "lesson": [["Key concepts", "<ul>\n<li><strong>A common jazz blues in F:<\/strong><\/li>\n<\/ul>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Bar<\/th>\n<th>1<\/th>\n<th>2<\/th>\n<th>3<\/th>\n<th>4<\/th>\n<th>5<\/th>\n<th>6<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Chord<\/td>\n<td>F7<\/td>\n<td>Bb7<\/td>\n<td>F7<\/td>\n<td>Cm7, F7<\/td>\n<td>Bb7<\/td>\n<td>Bdim7<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Bar<\/th>\n<th>7<\/th>\n<th>8<\/th>\n<th>9<\/th>\n<th>10<\/th>\n<th>11<\/th>\n<th>12<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Chord<\/td>\n<td>F7<\/td>\n<td>D7<\/td>\n<td>Gm7<\/td>\n<td>C7<\/td>\n<td>F7, D7<\/td>\n<td>Gm7, C7<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li><strong>Swing feel.<\/strong> Eighth notes are played long short, like the rhythm of \"doo ba doo ba\".<\/li>\n<li><strong>Approach notes.<\/strong> Arrive at a chord tone from one fret above or below. Chromatic approaches are the core of jazz sound.<\/li>\n<li><strong>Adding chords to your solo.<\/strong> Drop short chord stabs between phrases, using the shell voicings from Week 10.<\/li>\n<\/ul>"], ["Exercises", "<p><strong>1. Comp the form.<\/strong> Using shell voicings, comp through the jazz blues with a swing feel, short chords on beats 2 and 4.<\/p>\n<p><strong>2. Arpeggio outline.<\/strong> Play only chord tones, one arpeggio per bar (two per bar where two chords share a bar).<\/p>\n<p><strong>3. Approach notes.<\/strong> Before each chord change, approach the 3rd of the new chord from a fret below.<\/p>\n<p><strong>4. Learn a head.<\/strong> Learn the melody of a jazz blues tune (many are easy to find by searching \"jazz blues in F\"), then improvise one chorus.<\/p>\n<p><strong>5. Solo with chords.<\/strong> Improvise one chorus, adding at least four chord stabs.<\/p>"], ["Watch out for", "<ul>\n<li>Trying to play fast. Clarity of the changes matters far more than speed here.<\/li>\n<\/ul>"]], "days": [["Days 1 to 2", "comping the form; swing feel."], ["Days 3 to 4", "arpeggio outline; approach notes."], ["Days 5 to 6", "learn a head; solo with chords."]], "sunday": "The head, then one chorus of improvisation, over a jazz blues backing track in F.", "boards": [{"type": "chord", "title": "F7", "notes": [[6, 1], [4, 1], [3, 2]], "muted": [5, 2, 1], "root": "F", "cap": null, "flats": true}, {"type": "chord", "title": "Bb7", "notes": [[5, 1], [3, 1], [2, 3]], "muted": [6, 4, 1], "root": "Bb", "cap": null, "flats": true}, {"type": "chord", "title": "Cm7", "notes": [[5, 3], [3, 3], [2, 4]], "muted": [6, 4, 1], "root": "C", "cap": null, "flats": true}, {"type": "chord", "title": "Bdim7", "notes": [[5, 2], [4, 3], [3, 1], [2, 3]], "muted": [6, 1], "root": "B", "cap": null, "flats": true}, {"type": "chord", "title": "D7", "notes": [[5, 5], [3, 5], [2, 7]], "muted": [6, 4, 1], "root": "D", "cap": null, "flats": false}, {"type": "chord", "title": "Gm7", "notes": [[6, 3], [4, 3], [3, 3]], "muted": [5, 2, 1], "root": "G", "cap": null, "flats": true}, {"type": "chord", "title": "C7", "notes": [[5, 3], [3, 3], [2, 5]], "muted": [6, 4, 1], "root": "C", "cap": null, "flats": true}], "goal": "Play the head and one solo chorus over a jazz blues", "ex": ["Comp the form", "Arpeggio outline", "Approach notes", "Learn a head", "Solo with chords"], "bt": ["jazz-blues"], "drone": null}, {"num": 38, "title": "Sequences, maj7 arpeggios, scale choices and key changes", "phase": 3, "obj": "add sequences and arpeggios to your vocabulary, and stay in control when the key changes.", "lesson": [["Key concepts", "<ul>\n<li><strong>Sequences<\/strong> are repeated melodic patterns moved through a scale: groups of three (1 2 3, 2 3 4, 3 4 5), groups of four, or intervals (thirds, fourths).<\/li>\n<li><strong>Major 7 arpeggios:<\/strong> Cmaj7 is C E G B.<\/li>\n<li><strong>Which scale fits which chord (a starting guide):<\/strong><\/li>\n<\/ul>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Chord type<\/th>\n<th>First choice<\/th>\n<th>Other options<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>maj7<\/td>\n<td>Ionian (major)<\/td>\n<td>Lydian, major pentatonic<\/td>\n<\/tr>\n<tr>\n<td>m7<\/td>\n<td>Dorian<\/td>\n<td>Aeolian, minor pentatonic<\/td>\n<\/tr>\n<tr>\n<td>7 (dominant)<\/td>\n<td>Mixolydian<\/td>\n<td>Blues scale, minor pentatonic for a bluesy sound<\/td>\n<\/tr>\n<tr>\n<td>m7b5<\/td>\n<td>Locrian<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li><strong>Key changes.<\/strong> Find the notes the old and new keys share and use them as a bridge. Then aim for a chord tone of the first chord in the new key.<\/li>\n<li><strong>Sidestepping.<\/strong> Briefly play a phrase one fret above the key, then slide back. Creates tension and release.<\/li>\n<li><strong>Leaving space.<\/strong> Your strongest tool. A pause before an important note makes it land harder.<\/li>\n<\/ul>"], ["Exercises", "<p><strong>1. Sequences.<\/strong> A minor pentatonic and C major scale in groups of three, then four, ascending and descending.<\/p>\n<p><strong>2. Maj7 arpeggio workout.<\/strong> Cmaj7, Fmaj7 and Gmaj7 arpeggios in one position.<\/p>\n<p><strong>3. Scale choices.<\/strong> Over a vamp of each chord type in the table, try the first choice and one other option.<\/p>\n<p><strong>4. Key change practice.<\/strong> Make a backing loop: Dm7, G7, Cmaj7 (two bars each), then Fm7, Bb7, Ebmaj7 (two bars each). Improvise across the change.<\/p>\n<p><strong>5. Sidestep and space.<\/strong> Over an Am7 vamp, play a phrase, sidestep it to Bbm pentatonic for one beat, resolve back, then rest for a full bar.<\/p>"], ["Watch out for", "<ul>\n<li>Using sequences as filler. Use one, then break out of it before it becomes predictable.<\/li>\n<\/ul>"]], "days": [["Days 1 to 2", "sequences."], ["Days 3 to 4", "maj7 arpeggios; scale choices."], ["Days 5 to 6", "key change practice; sidestepping and space."]], "sunday": "2 minutes improvising over the key change loop without losing your place.", "boards": [{"type": "scale", "title": "Cmaj7 arpeggio", "root": "C", "iv": [0, 4, 7, 11], "frets": [7, 10], "hl": [], "cap": null, "deg": {}, "flats": false, "strings": null}, {"type": "scale", "title": "Fmaj7 arpeggio", "root": "F", "iv": [0, 4, 7, 11], "frets": [7, 10], "hl": [], "cap": null, "deg": {}, "flats": false, "strings": null}, {"type": "scale", "title": "Gmaj7 arpeggio", "root": "G", "iv": [0, 4, 7, 11], "frets": [7, 10], "hl": [], "cap": null, "deg": {}, "flats": false, "strings": null}, {"type": "scale", "title": "C major, same position", "root": "C", "iv": [0, 2, 4, 5, 7, 9, 11], "frets": [7, 10], "hl": [], "cap": null, "deg": {}, "flats": false, "strings": null}], "goal": "Improvise over a tune that changes key without getting lost", "ex": ["Sequences", "Maj7 arpeggio workout", "Scale choices", "Key change practice", "Sidestep and space"], "bt": ["key-change"], "drone": null}, {"num": 39, "title": "Review and Checkpoint 3", "phase": 3, "obj": "test yourself against Phase 3 and close any gaps before Phase 4.", "lesson": [["Checkpoint 3", "<ul>\n<li class=\"task\" data-task=\"cp1\">Tapping, hybrid, sweep and economy picking each clean at a slow tempo<\/li>\n<li class=\"task\" data-task=\"cp2\">Improvise over a 12 bar blues, targeting chord tones on each change<\/li>\n<li class=\"task\" data-task=\"cp3\">Solo over a jazz blues for one chorus<\/li>\n<li class=\"task\" data-task=\"cp4\">Improvise across at least 3 positions without returning to one box<\/li>\n<\/ul>"], ["If you did not pass everything", "<p>The improvisation items matter most going into Phase 4, which builds harmony and composition on top of them. Take an extra week if needed.<\/p>"], ["Maintenance list going into Phase 4", "<p>Add to your rotation: one advanced picking technique per week (tapping, hybrid, sweep, economy), the four chord targeting drill, and a blues chorus in a new key.<\/p>"]], "days": [["Day 1", "run every checkpoint item and record. Score each as Pass, Close or Not yet."], ["Days 2 to 5", "main focus block on your weakest items."], ["Day 6", "retest and record. Watch your Week 26 clip, then today's."]], "sunday": "Your full Checkpoint 3 run.", "boards": [{"type": "scale", "title": "Checkpoint: A blues scale, whole neck", "root": "A", "iv": [0, 3, 5, 6, 7, 10], "frets": [0, 17], "hl": [6], "cap": null, "deg": {"6": "b5"}, "flats": true, "strings": null}], "goal": "Complete Checkpoint 3", "ex": [], "bt": ["blues-a", "jazz-blues"], "drone": null}, {"num": 40, "title": "Harmonising melodies", "phase": 4, "obj": "add a second voice to any melody using thirds, sixths and octaves.", "lesson": [["Key concepts", "<ul>\n<li><strong>Harmonising<\/strong> means playing a second line that moves with the melody, a set interval away.<\/li>\n<li><strong>Diatonic harmony.<\/strong> Stay inside the key. A diatonic third above each note will sometimes be major (4 frets) and sometimes minor (3 frets); the key decides.<\/li>\n<li><strong>Thirds<\/strong> sound sweet and close. <strong>Sixths<\/strong> (a third turned upside down) sound open, great for soul and country. <strong>Octaves<\/strong> add weight without changing the harmony, a jazz and rock staple.<\/li>\n<li><strong>Riff harmonies.<\/strong> Many famous twin guitar riffs are just a melody plus the same melody a diatonic third or sixth above.<\/li>\n<\/ul>"], ["Exercises", "<p><strong>1. C major in sixths<\/strong> on the G and high e strings (skip the B string; mute it with the underside of your fretting finger):<\/p>\n<pre><code>e|--5----7----8----10----12----13----15--|\nB|--x----x----x----x-----x-----x-----x---|\nG|--5----7----9----10----12----14----16--|\n<\/code><\/pre>\n<p>(C/A, D/B, E/C, F/D, G/E, A/F, B/G.)<\/p>\n<p><strong>2. Octave shapes.<\/strong> Root on the low E string, octave on the D string two frets higher, muting the A string between. Root on the A string, octave on the G string two frets higher. Play a simple melody in octaves.<\/p>\n<p><strong>3. Harmonise a riff.<\/strong> Take a simple riff or melody you know. Play it, then work out the diatonic third above each note, then play both (record one and play the other along with it).<\/p>\n<p><strong>4. Harmonise a melody in 3rds and 6ths.<\/strong> Choose a folk melody or a melody you wrote in Week 20. Harmonise it first in thirds, then in sixths, and compare.<\/p>"], ["Watch out for", "<ul>\n<li>Using the same interval shape every time. The diatonic interval changes size through the key; let the key decide.<\/li>\n<\/ul>"]], "days": [["Days 1 to 2", "sixths in C; octave shapes."], ["Days 3 to 4", "harmonise a riff in thirds."], ["Days 5 to 6", "harmonise a full melody in thirds and sixths; record a two part version."]], "sunday": "A melody played alone, then harmonised in thirds, then in sixths.", "boards": [{"type": "notes", "title": "C major in sixths on the G and e strings", "notes": [[3, 5], [1, 5], [3, 7], [1, 7], [3, 9], [1, 8], [3, 10], [1, 10], [3, 12], [1, 12], [3, 14], [1, 13], [3, 16], [1, 15]], "root": "C", "frets": [4, 16], "cap": null, "flats": false, "hlpos": []}, {"type": "notes", "title": "Octave, root on low E", "notes": [[6, 3], [4, 5]], "root": "G", "frets": [2, 6], "cap": null, "flats": false, "hlpos": []}, {"type": "notes", "title": "Octave, root on A", "notes": [[5, 3], [3, 5]], "root": "C", "frets": [2, 6], "cap": null, "flats": false, "hlpos": []}], "goal": "Harmonise a melody you know in 3rds and 6ths", "ex": ["C major in sixths", "Octave shapes", "Harmonise a riff", "Harmonise a melody in 3rds and 6ths"], "bt": [], "drone": null}, {"num": 41, "title": "Drop 2 voicings: maj7 and dominant 7", "phase": 4, "obj": "learn the most useful jazz chord voicings and play them in all four inversions.", "lesson": [["Key concepts", "<ul>\n<li><strong>What \"drop 2\" means.<\/strong> Take a 7th chord stacked closely (all four notes within an octave), then drop the second highest note down an octave. The result is a voicing that sits comfortably on four adjacent strings.<\/li>\n<li><strong>Four inversions.<\/strong> Each voicing has one of the four chord tones in the bass, so every 7th chord can be played four ways on each string set.<\/li>\n<li><strong>String set for this week:<\/strong> the top four strings (D, G, B, e).<\/li>\n<\/ul>\n<p><strong>Cmaj7 drop 2 voicings (D G B e):<\/strong><\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Bass note<\/th>\n<th>Order low to high<\/th>\n<th>Shape<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Root<\/td>\n<td>1 5 7 3<\/td>\n<td>xx 10 12 12 12<\/td>\n<\/tr>\n<tr>\n<td>3rd<\/td>\n<td>3 7 1 5<\/td>\n<td>xx 2 4 1 3<\/td>\n<\/tr>\n<tr>\n<td>5th<\/td>\n<td>5 1 3 7<\/td>\n<td>xx 5 5 5 7<\/td>\n<\/tr>\n<tr>\n<td>7th<\/td>\n<td>7 3 5 1<\/td>\n<td>xx 9 9 8 8<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>C7 drop 2 voicings (D G B e):<\/strong><\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Bass note<\/th>\n<th>Order low to high<\/th>\n<th>Shape<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Root<\/td>\n<td>1 5 b7 3<\/td>\n<td>xx 10 12 11 12<\/td>\n<\/tr>\n<tr>\n<td>3rd<\/td>\n<td>3 b7 1 5<\/td>\n<td>xx 2 3 1 3<\/td>\n<\/tr>\n<tr>\n<td>5th<\/td>\n<td>5 1 3 b7<\/td>\n<td>xx 5 5 5 6<\/td>\n<\/tr>\n<tr>\n<td>b7<\/td>\n<td>b7 3 5 1<\/td>\n<td>xx 8 9 8 8<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>"], ["Exercises", "<p><strong>1. Climb the neck.<\/strong> Play the four Cmaj7 inversions from the lowest to the highest and back. Then C7.<\/p>\n<p><strong>2. Maj7 to 7.<\/strong> For each inversion, play Cmaj7, then lower the 7th by one fret to get C7. Hear exactly which note changes.<\/p>\n<p><strong>3. Move to other roots.<\/strong> Play Fmaj7 and F7 in all four inversions, then Gmaj7 and G7.<\/p>\n<p><strong>4. Second string set.<\/strong> Work out the same voicings on the A, D, G and B strings. Remember the notes on the B string shift up one fret compared with the other strings.<\/p>"], ["Watch out for", "<ul>\n<li>Memorising shapes without the chord tones. For every shape, be able to point at the root, 3rd, 5th and 7th.<\/li>\n<\/ul>"]], "days": [["Days 1 to 2", "Cmaj7 inversions on the top four strings."], ["Days 3 to 4", "C7 inversions; maj7 to 7 changes."], ["Days 5 to 6", "move to F and G; start the second string set."]], "sunday": "Cmaj7 and C7 in all four inversions on the top four strings, naming the bass note of each.", "boards": [{"type": "chord", "title": "Cmaj7, root in bass", "notes": [[4, 10], [3, 12], [2, 12], [1, 12]], "muted": [6, 5], "root": "C", "cap": null, "flats": false}, {"type": "chord", "title": "Cmaj7, 3rd in bass", "notes": [[4, 2], [3, 4], [2, 1], [1, 3]], "muted": [6, 5], "root": "C", "cap": null, "flats": false}, {"type": "chord", "title": "Cmaj7, 5th in bass", "notes": [[4, 5], [3, 5], [2, 5], [1, 7]], "muted": [6, 5], "root": "C", "cap": null, "flats": false}, {"type": "chord", "title": "Cmaj7, 7th in bass", "notes": [[4, 9], [3, 9], [2, 8], [1, 8]], "muted": [6, 5], "root": "C", "cap": null, "flats": false}, {"type": "chord", "title": "C7, root in bass", "notes": [[4, 10], [3, 12], [2, 11], [1, 12]], "muted": [6, 5], "root": "C", "cap": null, "flats": true}, {"type": "chord", "title": "C7, 3rd in bass", "notes": [[4, 2], [3, 3], [2, 1], [1, 3]], "muted": [6, 5], "root": "C", "cap": null, "flats": true}, {"type": "chord", "title": "C7, 5th in bass", "notes": [[4, 5], [3, 5], [2, 5], [1, 6]], "muted": [6, 5], "root": "C", "cap": null, "flats": true}, {"type": "chord", "title": "C7, b7 in bass", "notes": [[4, 8], [3, 9], [2, 8], [1, 8]], "muted": [6, 5], "root": "C", "cap": null, "flats": true}], "goal": "Play each voicing on two string sets in all inversions", "ex": ["Climb the neck", "Maj7 to 7", "Move to other roots", "Second string set"], "bt": ["ii-v-i-vi"], "drone": null}, {"num": 42, "title": "Drop 2 voicings: min7 and min7(b5), chord scales and application", "phase": 4, "obj": "complete the four main drop 2 chord types and use them on a real tune.", "lesson": [["Key concepts", "<p><strong>Cm7 drop 2 voicings (D G B e):<\/strong><\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Bass note<\/th>\n<th>Order low to high<\/th>\n<th>Shape<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Root<\/td>\n<td>1 5 b7 b3<\/td>\n<td>xx 10 12 11 11<\/td>\n<\/tr>\n<tr>\n<td>b3<\/td>\n<td>b3 b7 1 5<\/td>\n<td>xx 1 3 1 3<\/td>\n<\/tr>\n<tr>\n<td>5th<\/td>\n<td>5 1 b3 b7<\/td>\n<td>xx 5 5 4 6<\/td>\n<\/tr>\n<tr>\n<td>b7<\/td>\n<td>b7 b3 5 1<\/td>\n<td>xx 8 8 8 8<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Cm7b5 drop 2 voicings (D G B e):<\/strong><\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Bass note<\/th>\n<th>Order low to high<\/th>\n<th>Shape<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Root<\/td>\n<td>1 b5 b7 b3<\/td>\n<td>xx 10 11 11 11<\/td>\n<\/tr>\n<tr>\n<td>b3<\/td>\n<td>b3 b7 1 b5<\/td>\n<td>xx 1 3 1 2<\/td>\n<\/tr>\n<tr>\n<td>b5<\/td>\n<td>b5 1 b3 b7<\/td>\n<td>xx 4 5 4 6<\/td>\n<\/tr>\n<tr>\n<td>b7<\/td>\n<td>b7 b3 b5 1<\/td>\n<td>xx 8 8 7 8<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li><strong>A process for any chord.<\/strong> Start from a shape you know and move the individual notes: lower a 3rd one fret for minor, lower a 5th for b5, lower a 7th for b7. You can build any 7th chord voicing this way.<\/li>\n<li><strong>Chord scales.<\/strong> Harmonise a major scale using one drop 2 inversion per note. In C major, start with Cmaj7 (root bass, xx 10 12 12 12) and move up: each scale degree gets its diatonic chord (Dm7, Em7, Fmaj7, G7, Am7, Bm7b5) in the same inversion. This builds a smooth run of chords up the neck.<\/li>\n<\/ul>"], ["Exercises", "<p><strong>1. Learn the shapes.<\/strong> Cm7 and Cm7b5 in all four inversions.<\/p>\n<p><strong>2. Build by moving notes.<\/strong> Starting from Cmaj7 in each inversion, create C7, Cm7 and Cm7b5 by moving single notes.<\/p>\n<p><strong>3. Chord scale in C.<\/strong> Play the C major chord scale up the neck using root position drop 2 voicings, then using the 5th in the bass.<\/p>\n<p><strong>4. ii V I in drop 2s.<\/strong> Dm7, G7, Cmaj7 using the closest inversions so your hand barely moves.<\/p>\n<p><strong>5. Application.<\/strong> Comp through a 12 bar blues in C using only drop 2s. Then a jazz standard such as Afternoon in Paris, using the lead sheet.<\/p>"], ["Watch out for", "<ul>\n<li>Jumping around the neck between chords. Choose the inversion closest to your last chord.<\/li>\n<\/ul>"]], "days": [["Days 1 to 2", "Cm7 and Cm7b5 shapes; build by moving notes."], ["Days 3 to 4", "chord scale; ii V I."], ["Days 5 to 6", "blues in C and a jazz standard using drop 2s only."]], "sunday": "One chorus of a jazz standard (or the blues in C), comped using drop 2 voicings only.", "boards": [{"type": "chord", "title": "Cm7, root in bass", "notes": [[4, 10], [3, 12], [2, 11], [1, 11]], "muted": [6, 5], "root": "C", "cap": null, "flats": true}, {"type": "chord", "title": "Cm7, b3 in bass", "notes": [[4, 1], [3, 3], [2, 1], [1, 3]], "muted": [6, 5], "root": "C", "cap": null, "flats": true}, {"type": "chord", "title": "Cm7, 5th in bass", "notes": [[4, 5], [3, 5], [2, 4], [1, 6]], "muted": [6, 5], "root": "C", "cap": null, "flats": true}, {"type": "chord", "title": "Cm7, b7 in bass", "notes": [[4, 8], [3, 8], [2, 8], [1, 8]], "muted": [6, 5], "root": "C", "cap": null, "flats": true}, {"type": "chord", "title": "Cm7b5, root in bass", "notes": [[4, 10], [3, 11], [2, 11], [1, 11]], "muted": [6, 5], "root": "C", "cap": null, "flats": true}, {"type": "chord", "title": "Cm7b5, b3 in bass", "notes": [[4, 1], [3, 3], [2, 1], [1, 2]], "muted": [6, 5], "root": "C", "cap": null, "flats": true}, {"type": "chord", "title": "Cm7b5, b5 in bass", "notes": [[4, 4], [3, 5], [2, 4], [1, 6]], "muted": [6, 5], "root": "C", "cap": null, "flats": true}, {"type": "chord", "title": "Cm7b5, b7 in bass", "notes": [[4, 8], [3, 8], [2, 7], [1, 8]], "muted": [6, 5], "root": "C", "cap": null, "flats": true}], "goal": "Comp a standard (for example Afternoon in Paris) using drop 2s only", "ex": ["Learn the shapes", "Build by moving notes", "Chord scale in C", "ii V I in drop 2s", "Application"], "bt": ["blues-c", "ii-v-i-vi"], "drone": null}, {"num": 43, "title": "Drop 3 voicings", "phase": 4, "obj": "double your chord vocabulary with drop 3 voicings, which have a wider, fuller sound and a bass note on the low strings.", "lesson": [["Key concepts", "<ul>\n<li><strong>What \"drop 3\" means.<\/strong> From a close voicing, drop the third highest note an octave. The result spans five strings with one skipped, usually the low E string, then D, G and B (skipping A), or the A string, then G, B and e (skipping D).<\/li>\n<li><strong>Most common use.<\/strong> Root position drop 3s with the root on the low E string are the classic jazz comping shapes.<\/li>\n<\/ul>\n<p><strong>Root on the low E string (E x D G B), C root at fret 8:<\/strong><\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Chord<\/th>\n<th>Order low to high<\/th>\n<th>Shape<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Cmaj7<\/td>\n<td>1 7 3 5<\/td>\n<td>8 x 9 9 8 x<\/td>\n<\/tr>\n<tr>\n<td>C7<\/td>\n<td>1 b7 3 5<\/td>\n<td>8 x 8 9 8 x<\/td>\n<\/tr>\n<tr>\n<td>Cm7<\/td>\n<td>1 b7 b3 5<\/td>\n<td>8 x 8 8 8 x<\/td>\n<\/tr>\n<tr>\n<td>Cm7b5<\/td>\n<td>1 b7 b3 b5<\/td>\n<td>8 x 8 8 7 x<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Other Cmaj7 inversions on the same string set:<\/strong><\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Bass note<\/th>\n<th>Order low to high<\/th>\n<th>Shape<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>3rd<\/td>\n<td>3 1 5 7<\/td>\n<td>12 x 10 12 12 x<\/td>\n<\/tr>\n<tr>\n<td>5th<\/td>\n<td>5 3 7 1<\/td>\n<td>3 x 2 4 1 x<\/td>\n<\/tr>\n<tr>\n<td>7th<\/td>\n<td>7 5 1 3<\/td>\n<td>7 x 5 5 5 x<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Root on the A string (A x G B e):<\/strong> Cmaj7 is <code>x 3 x 4 5 3<\/code>. Move single notes to make C7, Cm7 and Cm7b5, as you did with drop 2s.<\/p>"], ["Exercises", "<p><strong>1. Root position shapes.<\/strong> All four chord types with the root on the low E string, then on the A string.<\/p>\n<p><strong>2. Inversions.<\/strong> Cmaj7 in all four inversions on the E x D G B set; then convert each to C7 and Cm7.<\/p>\n<p><strong>3. Chord scale.<\/strong> The C major chord scale using root position drop 3s on the low E string.<\/p>\n<p><strong>4. ii V I.<\/strong> Dm7, G7, Cmaj7 using drop 3s, alternating root on E and root on A shapes to stay in one area.<\/p>\n<p><strong>5. Application.<\/strong> Comp a jazz standard such as Fly Me To The Moon using drop 3s.<\/p>"], ["Watch out for", "<ul>\n<li>The skipped string ringing. Let the underside of the finger on the string below lightly mute it.<\/li>\n<\/ul>"]], "days": [["Days 1 to 2", "root position drop 3s on E and A strings."], ["Days 3 to 4", "inversions; chord scale."], ["Days 5 to 6", "ii V I; a full standard with drop 3s, then mixing drop 2s and drop 3s."]], "sunday": "One chorus of a jazz standard using drop 3s, then a second chorus mixing drop 2s and drop 3s.", "boards": [{"type": "chord", "title": "Cmaj7 drop 3", "notes": [[6, 8], [4, 9], [3, 9], [2, 8]], "muted": [5, 1], "root": "C", "cap": null, "flats": false}, {"type": "chord", "title": "C7 drop 3", "notes": [[6, 8], [4, 8], [3, 9], [2, 8]], "muted": [5, 1], "root": "C", "cap": null, "flats": true}, {"type": "chord", "title": "Cm7 drop 3", "notes": [[6, 8], [4, 8], [3, 8], [2, 8]], "muted": [5, 1], "root": "C", "cap": null, "flats": true}, {"type": "chord", "title": "Cm7b5 drop 3", "notes": [[6, 8], [4, 8], [3, 8], [2, 7]], "muted": [5, 1], "root": "C", "cap": null, "flats": true}, {"type": "chord", "title": "Cmaj7, 3rd in bass", "notes": [[6, 12], [4, 10], [3, 12], [2, 12]], "muted": [5, 1], "root": "C", "cap": null, "flats": false}, {"type": "chord", "title": "Cmaj7, 5th in bass", "notes": [[6, 3], [4, 2], [3, 4], [2, 1]], "muted": [5, 1], "root": "C", "cap": null, "flats": false}, {"type": "chord", "title": "Cmaj7, 7th in bass", "notes": [[6, 7], [4, 5], [3, 5], [2, 5]], "muted": [5, 1], "root": "C", "cap": null, "flats": false}, {"type": "chord", "title": "Cmaj7, root on A string", "notes": [[5, 3], [3, 4], [2, 5], [1, 3]], "muted": [6, 4], "root": "C", "cap": null, "flats": false}], "goal": "Comp a standard (for example Fly Me To The Moon) using drop 3s", "ex": ["Root position shapes", "Inversions", "Chord scale", "ii V I", "Application"], "bt": ["ii-v-i-vi"], "drone": null}, {"num": 44, "title": "Harmonic minor, part 1", "phase": 4, "obj": "understand the harmonic minor scale, its modes and the chords it creates.", "lesson": [["Key concepts", "<ul>\n<li><strong>The scale.<\/strong> Natural minor with a raised 7th: <strong>1 2 b3 4 5 b6 7<\/strong>. A harmonic minor is A B C D E F G#.<\/li>\n<li><strong>Why it exists.<\/strong> Raising the 7th turns the minor key's v chord (Em) into a major V7 (E7), which pulls strongly home to Am. Listen for the wide gap between F and G# (three frets). That exotic jump is the scale's signature.<\/li>\n<li><strong>Position shape (around fret 5):<\/strong><\/li>\n<\/ul>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>String<\/th>\n<th>Frets<\/th>\n<th>Notes<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Low E<\/td>\n<td>4 5 7 8<\/td>\n<td>G# A B C<\/td>\n<\/tr>\n<tr>\n<td>A<\/td>\n<td>5 7 8<\/td>\n<td>D E F<\/td>\n<\/tr>\n<tr>\n<td>D<\/td>\n<td>6 7 9<\/td>\n<td>G# A B<\/td>\n<\/tr>\n<tr>\n<td>G<\/td>\n<td>5 7 9<\/td>\n<td>C D E<\/td>\n<\/tr>\n<tr>\n<td>B<\/td>\n<td>5 6 9<\/td>\n<td>E F G#<\/td>\n<\/tr>\n<tr>\n<td>high e<\/td>\n<td>5 7 8<\/td>\n<td>A B C<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li><strong>The modes most worth knowing:<\/strong><\/li>\n<\/ul>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Mode<\/th>\n<th>Starts on<\/th>\n<th>Notes from A harmonic minor<\/th>\n<th>Use<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1st: Harmonic minor<\/td>\n<td>A<\/td>\n<td>A B C D E F G#<\/td>\n<td>Over Am(maj7), or a minor key with a V7<\/td>\n<\/tr>\n<tr>\n<td>5th: Phrygian dominant<\/td>\n<td>E<\/td>\n<td>E F G# A B C D<\/td>\n<td>Over E7 resolving to Am; Spanish and metal flavour<\/td>\n<\/tr>\n<tr>\n<td>4th: Dorian #4<\/td>\n<td>D<\/td>\n<td>D E F G# A B C<\/td>\n<td>Over Dm7 for an exotic minor sound<\/td>\n<\/tr>\n<tr>\n<td>7th: altered diminished<\/td>\n<td>G#<\/td>\n<td>G# A B C D E F<\/td>\n<td>Over G#dim7<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li><strong>Chord and scale relationships.<\/strong> The seven chords of A harmonic minor: Am(maj7), Bm7b5, Cmaj7#5, Dm7, E7, Fmaj7, G#dim7. The most important by far is <strong>E7 to Am<\/strong>.<\/li>\n<\/ul>"], ["Exercises", "<p><strong>1. The position shape<\/strong>, up and down, then in thirds.<\/p>\n<p><strong>2. Hear the gap.<\/strong> Play F to G# slowly over an Am drone. Then play A natural minor and A harmonic minor back to back.<\/p>\n<p><strong>3. Phrygian dominant over E7.<\/strong> Loop E7 for 4 bars, Am for 4 bars. Play A harmonic minor over both, noticing how G# leads to A.<\/p>\n<p><strong>4. Chord tones.<\/strong> Play arpeggios of E7 (E G# B D) and Am (A C E) inside the position, and connect them.<\/p>"], ["Watch out for", "<ul>\n<li>Overusing the exotic sound. One harmonic minor phrase over the V7 is often more effective than a whole solo of it.<\/li>\n<\/ul>"]], "days": [["Days 1 to 2", "the scale; the position shape; hear the gap."], ["Days 3 to 4", "the modes over a drone; the seven chords."], ["Days 5 to 6", "E7 to Am vamp; arpeggios."]], "sunday": "Over an E7 to Am vamp, 1 minute of improvising with A harmonic minor, resolving G# to A at each change to Am.", "boards": [{"type": "scale", "title": "A harmonic minor, position 5", "root": "A", "iv": [0, 2, 3, 5, 7, 8, 11], "frets": [4, 9], "hl": [11], "cap": "The raised 7th (G#) highlighted", "deg": {}, "flats": false, "strings": null}, {"type": "chord", "title": "Am(maj7)", "notes": [[4, 7], [3, 9], [2, 9], [1, 8]], "muted": [6, 5], "root": "A", "cap": null, "flats": false}, {"type": "chord", "title": "E7, the V chord", "notes": [[6, 0], [5, 2], [4, 0], [3, 1], [2, 0], [1, 0]], "muted": [], "root": "E", "cap": null, "flats": false}], "goal": "Play harmonic minor in two positions and hear it over a V7 to i", "ex": ["The position shape", "Hear the gap", "Phrygian dominant over E7", "Chord tones"], "bt": ["e7-am"], "drone": "A"}, {"num": 45, "title": "Harmonic minor, part 2: voicings and writing a solo", "phase": 4, "obj": "play harmonic minor chords and compose a solo using the scale.", "lesson": [["Key concepts", "<ul>\n<li><strong>Am(maj7) drop 2 (D G B e):<\/strong> <code>xx 7 9 9 8<\/code> (A E G# C). A dark, cinematic sound, often used at the end of a minor tune.<\/li>\n<li><strong>Diminished 7 chords are symmetrical.<\/strong> G#dim7 (G# B D F) is built entirely from minor thirds. Shape on D G B e: <code>xx 6 7 6 7<\/code>. Move it up three frets and it is the same chord in a new inversion. G#dim7 works as a stand in for E7: the four notes are the E7b9 chord without the root.<\/li>\n<li><strong>Drop 3 voicing of E7<\/strong> (root on low E): <code>0 x 0 1 0 x<\/code>, or at fret 12: <code>12 x 12 13 12 x<\/code>.<\/li>\n<li><strong>Writing a solo<\/strong> is improvising with time to think. Compose phrases, refine them, then learn the finished solo as if it were someone else's.<\/li>\n<\/ul>"], ["Exercises", "<p><strong>1. Voicings.<\/strong> Learn Am(maj7) and G#dim7. Move the dim7 shape up the neck in three fret jumps.<\/p>\n<p><strong>2. Minor progression.<\/strong> Am, Dm7, E7 (or G#dim7), Am. Comp with drop 2 voicings.<\/p>\n<p><strong>3. Write an 8 bar solo<\/strong> over Am, Dm7, E7, Am (two bars each):<\/p>\n<ol>\n<li>Bar 1 to 2: a simple, memorable idea on Am<\/li>\n<li>Bar 3 to 4: develop it over Dm7<\/li>\n<li>Bar 5 to 6: the harmonic minor moment over E7, featuring G#<\/li>\n<li>Bar 7 to 8: resolve to A over Am<\/li>\n<\/ol>\n<p>Write it into Guitar Pro or MuseScore as you go.<\/p>\n<p><strong>4. Learn your solo.<\/strong> Practise it with a backing track until it is clean at full tempo.<\/p>"], ["Watch out for", "<ul>\n<li>Writing a solo you cannot play. Write within your ability, then push one bar slightly beyond it.<\/li>\n<\/ul>"]], "days": [["Days 1 to 2", "voicings; minor progression."], ["Days 3 to 4", "write the solo."], ["Days 5 to 6", "refine and learn it; add bends, slides and vibrato."]], "sunday": "Your 8 bar harmonic minor solo over the backing track.", "boards": [{"type": "chord", "title": "Am(maj7)", "notes": [[4, 7], [3, 9], [2, 9], [1, 8]], "muted": [6, 5], "root": "A", "cap": null, "flats": false}, {"type": "chord", "title": "G#dim7", "notes": [[4, 6], [3, 7], [2, 6], [1, 7]], "muted": [6, 5], "root": "G#", "cap": null, "flats": false}, {"type": "chord", "title": "G#dim7, up 3 frets", "notes": [[4, 9], [3, 10], [2, 9], [1, 10]], "muted": [6, 5], "root": "G#", "cap": null, "flats": false}, {"type": "chord", "title": "E7 drop 3", "notes": [[6, 0], [4, 0], [3, 1], [2, 0]], "muted": [5, 1], "root": "E", "cap": null, "flats": false}, {"type": "scale", "title": "E7 arpeggio", "root": "E", "iv": [0, 4, 7, 10], "frets": [4, 8], "hl": [4], "cap": null, "deg": {}, "flats": false, "strings": null}], "goal": "Write and record an 8 bar harmonic minor solo", "ex": ["Voicings", "Minor progression", "Write an 8 bar solo", "Learn your solo"], "bt": ["minor-prog"], "drone": null}, {"num": 46, "title": "Melodic minor, part 1", "phase": 4, "obj": "learn the melodic minor scale and its most useful modes, the core of modern jazz harmony.", "lesson": [["Key concepts", "<ul>\n<li><strong>The scale.<\/strong> The major scale with a flat 3rd: <strong>1 2 b3 4 5 6 7<\/strong>. A melodic minor is A B C D E F# G#. (In classical music it is only used ascending; in jazz it is the same both ways.)<\/li>\n<li><strong>Position shape (around fret 5):<\/strong><\/li>\n<\/ul>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>String<\/th>\n<th>Frets<\/th>\n<th>Notes<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Low E<\/td>\n<td>4 5 7 8<\/td>\n<td>G# A B C<\/td>\n<\/tr>\n<tr>\n<td>A<\/td>\n<td>5 7 9<\/td>\n<td>D E F#<\/td>\n<\/tr>\n<tr>\n<td>D<\/td>\n<td>6 7 9<\/td>\n<td>G# A B<\/td>\n<\/tr>\n<tr>\n<td>G<\/td>\n<td>5 7 9<\/td>\n<td>C D E<\/td>\n<\/tr>\n<tr>\n<td>B<\/td>\n<td>5 7 9<\/td>\n<td>E F# G#<\/td>\n<\/tr>\n<tr>\n<td>high e<\/td>\n<td>5 7 8<\/td>\n<td>A B C<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li><strong>The modes most worth knowing:<\/strong><\/li>\n<\/ul>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Mode<\/th>\n<th>Use over<\/th>\n<th>How to find it<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1st: Melodic minor<\/td>\n<td>m6 or m(maj7) chords<\/td>\n<td>Same root<\/td>\n<\/tr>\n<tr>\n<td>4th: Lydian dominant<\/td>\n<td>7#11 chords, or a dominant 7 that does not resolve<\/td>\n<td>Melodic minor a fifth above the chord root (D7: A melodic minor)<\/td>\n<\/tr>\n<tr>\n<td>6th: Locrian #2<\/td>\n<td>m7b5 chords<\/td>\n<td>Melodic minor a minor third above the root (Bm7b5: D melodic minor)<\/td>\n<\/tr>\n<tr>\n<td>7th: Altered scale<\/td>\n<td>Altered dominant chords (7alt)<\/td>\n<td>Melodic minor a semitone above the root (E7alt: F melodic minor)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li><strong>The chords of A melodic minor:<\/strong> Am(maj7), Bm7, Cmaj7#5, D7, E7, F#m7b5, G#m7b5.<\/li>\n<\/ul>"], ["Exercises", "<p><strong>1. Position shape<\/strong>, up and down, then in thirds.<\/p>\n<p><strong>2. Compare.<\/strong> Over an Am drone: A natural minor, A harmonic minor, A melodic minor. Three shades of minor.<\/p>\n<p><strong>3. Lydian dominant.<\/strong> Vamp on D7 and play A melodic minor. Listen to the G# (the #11 of D7).<\/p>\n<p><strong>4. The altered sound.<\/strong> Vamp E7 to Am. Over the E7, play F melodic minor; over Am, A melodic minor or A Dorian. The tension and release is the sound of modern jazz.<\/p>"], ["Watch out for", "<ul>\n<li>Trying to think of seven modes at once. Learn the scale; use the \"how to find it\" column to pick the right melodic minor for each chord.<\/li>\n<\/ul>"]], "days": [["Days 1 to 2", "the scale and position shape; three shades of minor."], ["Days 3 to 4", "the modes; Lydian dominant over D7."], ["Days 5 to 6", "the altered scale over E7 resolving to Am."]], "sunday": "Over a D7 vamp, 1 minute of Lydian dominant. Then over E7 to Am, 1 minute using the altered scale on E7.", "boards": [{"type": "scale", "title": "A melodic minor, position 5", "root": "A", "iv": [0, 2, 3, 5, 7, 9, 11], "frets": [4, 9], "hl": [9, 11], "cap": null, "deg": {}, "flats": false, "strings": null}, {"type": "scale", "title": "D Lydian dominant (A melodic minor from D)", "root": "D", "iv": [0, 2, 4, 6, 7, 9, 10], "frets": [4, 9], "hl": [6], "cap": null, "deg": {"6": "#4"}, "flats": false, "strings": null}, {"type": "scale", "title": "E altered (F melodic minor from E)", "root": "E", "iv": [0, 1, 3, 4, 6, 8, 10], "frets": [4, 8], "hl": [1, 3, 6, 8], "cap": null, "deg": {"1": "b9", "3": "#9", "6": "#11", "8": "b13"}, "flats": true, "strings": null}], "goal": "Play melodic minor in two positions and over a minor chord vamp", "ex": ["Position shape", "Compare", "Lydian dominant", "The altered sound"], "bt": ["d7-vamp", "e7alt-am"], "drone": "A"}, {"num": 47, "title": "Melodic minor, part 2: voicings, solos and improvising", "phase": 4, "obj": "use melodic minor over a minor ii V i, the most common progression in minor key jazz.", "lesson": [["Key concepts", "<ul>\n<li><strong>The minor ii V i in A:<\/strong> Bm7b5, E7alt, Am6 (or Am(maj7)).<\/li>\n<li><strong>One scale per chord, all melodic minor:<\/strong><\/li>\n<\/ul>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Chord<\/th>\n<th>Scale<\/th>\n<th>Melodic minor to play<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Bm7b5<\/td>\n<td>B Locrian #2<\/td>\n<td>D melodic minor<\/td>\n<\/tr>\n<tr>\n<td>E7alt<\/td>\n<td>E altered<\/td>\n<td>F melodic minor<\/td>\n<\/tr>\n<tr>\n<td>Am6<\/td>\n<td>A melodic minor<\/td>\n<td>A melodic minor<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li><strong>Voicings:<\/strong> Am6 <code>x 0 2 2 1 2<\/code>; Bm7b5 drop 3 <code>x 2 x 2 3 1<\/code>; E7 with an altered top note <code>0 x 0 1 1 x<\/code> (E D G# C, giving the #5).<\/li>\n<\/ul>"], ["Exercises", "<p><strong>1. Comp the ii V i<\/strong> in A minor using the voicings above and your drop 2 shapes.<\/p>\n<p><strong>2. Scale switching.<\/strong> Over the ii V i (two bars per chord, then one bar each), switch melodic minor scale at every chord.<\/p>\n<p><strong>3. Write an 8 bar melodic minor solo<\/strong> over the ii V i, following the same method as Week 45. Make the E7alt bar the climax.<\/p>\n<p><strong>4. Improvise.<\/strong> 2 minutes over the ii V i, resolving altered notes (F, G, C over E7) to chord tones of Am6.<\/p>"], ["Watch out for", "<ul>\n<li>Landing on altered notes over the I chord. They create tension; release it on the Am6.<\/li>\n<\/ul>"]], "days": [["Days 1 to 2", "comping; scale switching at two bars per chord."], ["Days 3 to 4", "scale switching at one bar per chord; write your solo."], ["Days 5 to 6", "learn your solo; improvise."]], "sunday": "Your written solo, then 1 minute of free improvisation, over the minor ii V i.", "boards": [{"type": "chord", "title": "Bm7b5", "notes": [[5, 2], [3, 2], [2, 3], [1, 1]], "muted": [6, 4], "root": "B", "cap": null, "flats": false}, {"type": "chord", "title": "E7#5", "notes": [[6, 0], [4, 0], [3, 1], [2, 1]], "muted": [5, 1], "root": "E", "cap": null, "flats": false}, {"type": "chord", "title": "Am6", "notes": [[5, 0], [4, 2], [3, 2], [2, 1], [1, 2]], "muted": [6], "root": "A", "cap": null, "flats": false}, {"type": "scale", "title": "D melodic minor over Bm7b5", "root": "D", "iv": [0, 2, 3, 5, 7, 9, 11], "frets": [4, 8], "hl": [], "cap": null, "deg": {}, "fla
