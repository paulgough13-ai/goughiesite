ts": false, "strings": null}, {"type": "scale", "title": "F melodic minor over E7alt", "root": "F", "iv": [0, 2, 3, 5, 7, 9, 11], "frets": [4, 8], "hl": [], "cap": null, "deg": {}, "flats": true, "strings": null}], "goal": "Improvise 1 minute using melodic minor over a minor ii V i", "ex": ["Comp the ii V i", "Scale switching", "Write an 8 bar melodic minor solo", "Improvise"], "bt": ["minor-ii-v-i"], "drone": null}, {"num": 48, "title": "Composition: melody first vs chords first", "phase": 4, "obj": "start writing your own music using two different methods.", "lesson": [["Key concepts", "<ul>\n<li><strong>Chords first.<\/strong> Write a progression, then find a melody over it. Easy to start; risk of melodies that only follow the chords.<\/li>\n<li><strong>Melody first.<\/strong> Sing or play a melody, then find chords to fit it. More memorable melodies; harmonising can be harder.<\/li>\n<li><strong>Song structure.<\/strong> Common forms: verse and chorus, AABA (32 bars, four 8 bar sections), or 12 bar blues. Decide the form before you write.<\/li>\n<li><strong>The motif.<\/strong> A short idea (3 to 6 notes) that repeats and develops. Strong pieces are usually built from one or two motifs.<\/li>\n<\/ul>"], ["Exercises", "<p><strong>1. Chords first.<\/strong> Write an 8 bar progression using diatonic chords from one key (try a ii V I somewhere). Improvise melodies over it, record them, and keep the best 2 bars as your motif. Build an 8 bar melody from it.<\/p>\n<p><strong>2. Melody first.<\/strong> Away from the guitar, sing a melody into your phone. Learn it on the guitar, then harmonise it: for each bar, find a chord whose notes include the melody's main notes.<\/p>\n<p><strong>3. Compare.<\/strong> Which sketch do you like more? Which method felt more natural?<\/p>\n<p><strong>4. Form plan.<\/strong> Pick a form for a full piece (for example AABA). Decide which of your sketches will be the A section.<\/p>"], ["Watch out for", "<ul>\n<li>Judging too early. Write first, edit later. The first draft only needs to exist.<\/li>\n<\/ul>"]], "days": [["Days 1 to 2", "chords first sketch."], ["Days 3 to 4", "melody first sketch."], ["Days 5 to 6", "compare; choose a form; write a B section idea."]], "sunday": "Both 8 bar sketches.", "boards": [{"type": "scale", "title": "C major across the neck", "root": "C", "iv": [0, 2, 4, 5, 7, 9, 11], "frets": [0, 12], "hl": [], "cap": null, "deg": {}, "flats": false, "strings": null}, {"type": "scale", "title": "A minor pentatonic for melody ideas", "root": "A", "iv": [0, 3, 5, 7, 10], "frets": [5, 8], "hl": [], "cap": null, "deg": {}, "flats": false, "strings": null}], "goal": "Write two 8 bar sketches, one each way", "ex": ["Chords first", "Melody first", "Compare", "Form plan"], "bt": ["c-amfg"], "drone": null}, {"num": 49, "title": "Modal interchange and contrafacts", "phase": 4, "obj": "add colour to your compositions with borrowed chords, and write new melodies over existing chord changes.", "lesson": [["Key concepts", "<ul>\n<li><strong>Modal interchange<\/strong> (borrowing). Use chords from the parallel minor key while in a major key. In C major, borrow from C minor:<\/li>\n<\/ul>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Borrowed chord<\/th>\n<th>In C<\/th>\n<th>Feeling<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>iv<\/td>\n<td>Fm<\/td>\n<td>Bittersweet, often after F major<\/td>\n<\/tr>\n<tr>\n<td>bVI<\/td>\n<td>Ab<\/td>\n<td>Epic, cinematic<\/td>\n<\/tr>\n<tr>\n<td>bVII<\/td>\n<td>Bb<\/td>\n<td>Rock, uplifting<\/td>\n<\/tr>\n<tr>\n<td>bIII<\/td>\n<td>Eb<\/td>\n<td>Bold surprise<\/td>\n<\/tr>\n<tr>\n<td>iiø7<\/td>\n<td>Dm7b5<\/td>\n<td>Darker ii chord before G7<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li><strong>Contrafacts.<\/strong> A new melody written over the chord changes of an existing tune. Jazz musicians have done this for a century. It removes the harmony question so you can focus on melody.<\/li>\n<\/ul>"], ["Exercises", "<p><strong>1. Borrow one chord.<\/strong> Take your Week 48 sketch and replace one chord with a borrowed chord. Try several and choose the best.<\/p>\n<p><strong>2. Classic moves.<\/strong> Play C, F, Fm, C. Then C, Ab, Bb, C. Hear each borrowed sound.<\/p>\n<p><strong>3. Write a contrafact.<\/strong> Take the chord changes of a standard you have been comping (or the jazz blues from Week 37) and write a completely new melody over them.<\/p>\n<p><strong>4. Lyrics or title.<\/strong> Give each piece a working title. It helps you decide what mood it should have.<\/p>"], ["Watch out for", "<ul>\n<li>Overdoing it. One borrowed chord in the right place has more impact than four.<\/li>\n<\/ul>"]], "days": [["Days 1 to 2", "modal interchange; classic moves."], ["Days 3 to 4", "borrow chords in your sketch."], ["Days 5 to 6", "write a contrafact."]], "sunday": "Your sketch with a borrowed chord, and your contrafact melody over its changes.", "boards": [{"type": "chord", "title": "C", "notes": [[5, 3], [4, 2], [3, 0], [2, 1], [1, 0]], "muted": [6], "root": "C", "cap": null, "flats": false}, {"type": "chord", "title": "F", "notes": [[6, 1], [5, 3], [4, 3], [3, 2], [2, 1], [1, 1]], "muted": [], "root": "F", "cap": null, "flats": false}, {"type": "chord", "title": "Fm (borrowed iv)", "notes": [[6, 1], [5, 3], [4, 3], [3, 1], [2, 1], [1, 1]], "muted": [], "root": "F", "cap": null, "flats": true}, {"type": "chord", "title": "Ab (borrowed bVI)", "notes": [[6, 4], [5, 6], [4, 6], [3, 5], [2, 4], [1, 4]], "muted": [], "root": "Ab", "cap": null, "flats": true}, {"type": "chord", "title": "Bb (borrowed bVII)", "notes": [[5, 1], [4, 3], [3, 3], [2, 3], [1, 1]], "muted": [6], "root": "Bb", "cap": null, "flats": true}, {"type": "chord", "title": "Eb (borrowed bIII)", "notes": [[5, 6], [4, 8], [3, 8], [2, 8], [1, 6]], "muted": [6], "root": "Eb", "cap": null, "flats": true}], "goal": "Add a borrowed chord to a sketch; write a new melody over a standard's changes", "ex": ["Borrow one chord", "Classic moves", "Write a contrafact", "Lyrics or title"], "bt": ["borrow-iv", "borrow-bvi"], "drone": null}, {"num": 50, "title": "Getting past writer's block and finishing a piece", "phase": 4, "obj": "finish one complete original piece.", "lesson": [["Key concepts", "<ul>\n<li><strong>Finishing beats perfecting.<\/strong> A finished piece teaches you more than ten unfinished ones.<\/li>\n<li><strong>When you are stuck, add a constraint.<\/strong> Limits force creativity. Pick one:<ul>\n<li>Write the next section using only three notes<\/li>\n<li>Use only one string<\/li>\n<li>Use a rhythm from a song in a completely different genre<\/li>\n<li>Reverse your motif (play it backwards) or turn it upside down<\/li>\n<li>Change the key for the B section (up a fourth is a common choice)<\/li>\n<li>Set a 20 minute timer and write without stopping or deleting<\/li>\n<\/ul>\n<\/li>\n<li><strong>A simple finishing checklist:<\/strong> a clear form, an intro (even 2 bars), an ending (not a fade), a title.<\/li>\n<\/ul>"], ["Exercises", "<p><strong>1. Choose your piece.<\/strong> Pick your strongest sketch from Weeks 48 and 49.<\/p>\n<p><strong>2. Fill the form.<\/strong> Write the remaining sections, using a constraint whenever you stall.<\/p>\n<p><strong>3. Write the intro and ending.<\/strong><\/p>\n<p><strong>4. Write it down<\/strong> fully in Guitar Pro or MuseScore.<\/p>\n<p><strong>5. Edit.<\/strong> Play it through daily. Remove anything that does not earn its place.<\/p>"], ["Watch out for", "<ul>\n<li>Starting a new piece because this one got hard. Use a constraint and keep going.<\/li>\n<\/ul>"]], "days": [["Days 1 to 2", "fill the form."], ["Days 3 to 4", "intro, ending, notation."], ["Days 5 to 6", "play through daily and edit."]], "sunday": "A full rough take of your finished piece.", "boards": [{"type": "scale", "title": "C major across the neck", "root": "C", "iv": [0, 2, 4, 5, 7, 9, 11], "frets": [0, 12], "hl": [], "cap": null, "deg": {}, "flats": false, "strings": null}], "goal": "Complete one original piece with a clear structure", "ex": ["Choose your piece", "Fill the form", "Write the intro and ending", "Write it down", "Edit"], "bt": ["c-amfg"], "drone": null}, {"num": 51, "title": "Performance preparation", "phase": 4, "obj": "play your music for others, or record a polished take, with confidence.", "lesson": [["Key concepts", "<ul>\n<li><strong>Performance anxiety<\/strong> makes you play worse than in practice, so practise performing, not just playing.<\/li>\n<li><strong>Rehearse the conditions.<\/strong> Stand if you will stand. Use the same guitar and settings. Play from start to finish without stopping, whatever happens.<\/li>\n<li><strong>Recover, do not restart.<\/strong> If you make a mistake, keep the rhythm going and come back in at the next bar. Audiences rarely notice a mistake; they always notice a stop.<\/li>\n<li><strong>Breathe.<\/strong> Slow breaths before starting, and a deliberately slower count in than feels natural (nerves make you rush).<\/li>\n<\/ul>"], ["Your set", "<p>Choose three pieces:<\/p>\n<ol>\n<li>Your original composition from Week 50<\/li>\n<li>A piece from earlier in the year you play well (for example your fingerstyle arrangement or written solo)<\/li>\n<li>A blues or standard where you improvise<\/li>\n<\/ol>"], ["Exercises", "<p><strong>1. Run throughs.<\/strong> Play the full set without stopping, once a day.<\/p>\n<p><strong>2. Pressure practice.<\/strong> Record every run through as if it were the final take. Phone camera on, red light, no restarts.<\/p>\n<p><strong>3. Mock audience.<\/strong> Play the set for one person (or a video call) at least once this week.<\/p>\n<p><strong>4. Fix list.<\/strong> After each run through, write the one bar that went worst, and spend 10 minutes on just that bar the next day.<\/p>"], ["Watch out for", "<ul>\n<li>Practising only the hard parts this week. You also need full, uninterrupted run throughs.<\/li>\n<\/ul>"]], "days": [["Days 1 to 2", "choose and run the set; start the fix list."], ["Days 3 to 4", "pressure practice; fix bars."], ["Days 5 to 6", "mock audience; final run throughs."]], "sunday": "Your full three piece set, recorded as a performance.", "boards": [{"type": "notes", "title": "Your fretboard map: every natural note", "notes": [[6, 0], [6, 1], [6, 3], [6, 5], [6, 7], [6, 8], [6, 10], [6, 12], [5, 0], [5, 2], [5, 3], [5, 5], [5, 7], [5, 8], [5, 10], [5, 12], [4, 0], [4, 2], [4, 3], [4, 5], [4, 7], [4, 9], [4, 10], [4, 12], [3, 0], [3, 2], [3, 4], [3, 5], [3, 7], [3, 9], [3, 10], [3, 12], [2, 0], [2, 1], [2, 3], [2, 5], [2, 6], [2, 8], [2, 10], [2, 12], [1, 0], [1, 1], [1, 3], [1, 5], [1, 7], [1, 8], [1, 10], [1, 12]], "root": null, "frets": [0, 12], "cap": null, "flats": false, "hlpos": []}], "goal": "Play your piece plus 2 other pieces from the year for someone, or record a take", "ex": ["Run throughs", "Pressure practice", "Mock audience", "Fix list"], "bt": ["blues-a", "jazz-blues"], "drone": null}, {"num": 52, "title": "Final review and Checkpoint 4", "phase": 4, "obj": "measure the year, celebrate the progress, and plan what comes next.", "lesson": [["Checkpoint 4", "<ul>\n<li class=\"task\" data-task=\"cp1\">Comp a jazz standard using drop 2 and drop 3 voicings<\/li>\n<li class=\"task\" data-task=\"cp2\">Improvise using harmonic minor and melodic minor<\/li>\n<li class=\"task\" data-task=\"cp3\">Perform and record one original piece<\/li>\n<li class=\"task\" data-task=\"cp4\">Watch your Week 1 clip next to your Week 52 clip<\/li>\n<\/ul>"], ["Planning year two", "<p>Answer these in your log:<\/p>\n<ol>\n<li>Which four weeks did you enjoy most? These point to your style.<\/li>\n<li>Which checkpoint items are still the weakest?<\/li>\n<li>What music do you want to be able to play in a year?<\/li>\n<\/ol>\n<p>Then pick one direction to go deeper in for the next 12 months, such as jazz, blues, fingerstyle, rock and metal technique, or songwriting, and build a new plan around it, keeping the same daily routine, weekly recording and quarterly checkpoints.<\/p>"]], "days": [["Day 1", "run every checkpoint item and record."], ["Days 2 to 3", "fix anything that is not yet a pass."], ["Day 4", "rerun Checkpoints 1, 2 and 3 quickly. Note what has become automatic."], ["Day 5", "watch your Week 1, 13, 26, 39 and 52 recordings in order."], ["Day 6", "write your plan for year two (below)."]], "sunday": "Your final Checkpoint 4 run, and a short clip of you playing anything you like, just for fun.", "boards": [{"type": "notes", "title": "Every natural note, the whole board", "notes": [[6, 0], [6, 1], [6, 3], [6, 5], [6, 7], [6, 8], [6, 10], [6, 12], [5, 0], [5, 2], [5, 3], [5, 5], [5, 7], [5, 8], [5, 10], [5, 12], [4, 0], [4, 2], [4, 3], [4, 5], [4, 7], [4, 9], [4, 10], [4, 12], [3, 0], [3, 2], [3, 4], [3, 5], [3, 7], [3, 9], [3, 10], [3, 12], [2, 0], [2, 1], [2, 3], [2, 5], [2, 6], [2, 8], [2, 10], [2, 12], [1, 0], [1, 1], [1, 3], [1, 5], [1, 7], [1, 8], [1, 10], [1, 12]], "root": null, "frets": [0, 12], "cap": "Week 1 started with two strings. Name them all now.", "flats": false, "hlpos": []}], "goal": "Complete Checkpoint 4 and compare against your Week 1 recording", "ex": [], "bt": ["blues-a"], "drone": null}], "intros": ["<p><strong>Phase goal:<\/strong> clean chords and rhythm, a working knowledge of keys and how chords are built, and the start of real fretboard knowledge.<\/p>\n<p>Each week follows the same layout: objective, key concepts, exercises, a day-by-day plan, the Sunday recording, and the most common mistakes. All exercises use the daily 60 minute routine from the main program file.<\/p>\n<p><strong>Reading the tab in this file:<\/strong> six lines, high e string at the top, low E at the bottom. Numbers are frets, 0 is an open string, x means do not play that string. Chord shapes are written low E to high e, so <code>320003<\/code> means low E fret 3, A fret 2, D open, G open, B open, high e fret 3.<\/p>", "<p><strong>Phase goal:<\/strong> expressive lead technique, a speed baseline that is climbing, the modes, the pentatonic across the whole neck, and much better ears.<\/p>\n<p>Same layout as Phase 1: objective, key concepts, exercises, day-by-day plan, Sunday recording, and common mistakes. Tab has the high e string at the top.<\/p>\n<p><strong>Tab symbols used in this file:<\/strong> <code>h<\/code> hammer-on, <code>p<\/code> pull-off, <code>/<\/code> slide up, <code>\\<\/code> slide down, <code>b<\/code> bend (for example <code>7b9<\/code> means fret 7 bent up until it sounds like fret 9), <code>r<\/code> release, <code>~<\/code> vibrato, <code>PM<\/code> palm mute, <code>&lt;12&gt;<\/code> natural harmonic at fret 12.<\/p>\n<p><strong>Warm-up from now on:<\/strong> 2 minutes of the chromatic exercise, then 3 minutes from your maintenance list (rotate barre changes, triad inversions, G major in thirds and the rhythm randomiser).<\/p>", "<p><strong>Phase goal:<\/strong> advanced techniques in your toolkit, and confident improvisation that follows the chords rather than just the key.<\/p>\n<p>Same layout as before: objective, key concepts, exercises, day-by-day plan, Sunday recording, and common mistakes. Tab has the high e string at the top.<\/p>\n<p><strong>Tab symbols:<\/strong> <code>h<\/code> hammer-on, <code>p<\/code> pull-off, <code>t<\/code> tap with the picking hand, <code>b<\/code> bend, <code>r<\/code> release, <code>/<\/code> slide up, <code>~<\/code> vibrato. In picking directions, <code>D<\/code> is a downstroke, <code>U<\/code> an upstroke, <code>m<\/code> the middle finger and <code>a<\/code> the ring finger of the picking hand.<\/p>\n<p><strong>Warm-up from now on:<\/strong> 2 minutes chromatic or three notes per string legato, then 3 minutes from your maintenance list (rotate pentatonic shapes, bends to a target, a mode over a drone and ear training).<\/p>\n<p><strong>Backing tracks:<\/strong> for this phase you need tracks for a 12 bar blues in A, a minor blues in A, a jazz blues in F, and two chord vamps. Search YouTube for these by name and key, or record your own loops.<\/p>", "<p><strong>Phase goal:<\/strong> a rich chord vocabulary, minor scale harmony, and an original piece you can perform and record.<\/p>\n<p>Same layout as before: objective, key concepts, exercises, day-by-day plan, Sunday recording, and common mistakes. Tab has the high e string at the top. Chord shapes are written low E to high e, with <code>x<\/code> for a string not played; two digit frets are separated by spaces where needed (for example <code>xx 10 12 12 12<\/code>).<\/p>\n<p><strong>Warm-up from now on:<\/strong> 2 minutes of one advanced picking technique (rotate tapping, hybrid, sweep, economy), then 3 minutes from your maintenance list.<\/p>\n<p><strong>Lead sheets:<\/strong> several weeks use jazz standards. Look up the chord charts in a fake book or a lead sheet site; the exercises tell you what to do with them.<\/p>"], "phases": [{"name": "Foundations", "goal": "Clean chords and rhythm, a working knowledge of keys and chord construction, and the start of real fretboard knowledge."}, {"name": "Technique, Ears and Modes", "goal": "Expressive lead technique, a speed baseline that is climbing, the modes, the pentatonic across the whole neck, and much better ears."}, {"name": "Advanced Picking and Improvisation", "goal": "Advanced techniques in your toolkit, and confident improvisation that follows the chords rather than just the key."}, {"name": "Advanced Harmony and Composition", "goal": "Rich chord vocabulary, minor scale harmony, and an original piece you can perform and record."}], "guide": [["How to use this program", "<h3>Weekly rhythm<\/h3>\n<ul>\n<li><strong>Monday to Saturday:<\/strong> the daily 60 minute routine below, using that week's focus.<\/li>\n<li><strong>Sunday:<\/strong> record a 2 to 3 minute progress clip of the week's goal, then rest.<\/li>\n<li><strong>Monday, first 5 minutes:<\/strong> watch Sunday's clip back and note one thing to fix this week.<\/li>\n<\/ul>\n<h3>Your self-feedback loop<\/h3>\n<ol>\n<li>Record, never just play. Phone video is fine; keep both hands in shot.<\/li>\n<li>Wait a day before reviewing. You hear mistakes more honestly with fresh ears.<\/li>\n<li>Check the same five things every time: timing against the click, clean notes, string noise, tension in your hands and shoulders, and whether it sounds like music.<\/li>\n<li>Log the tempo (BPM) you played each exercise at cleanly. Rising numbers are your proof of progress.<\/li>\n<li>Once a month, get outside ears: post a clip to a forum such as r/guitarlessons, play for a friend, or book a single lesson with a local teacher.<\/li>\n<\/ol>\n<h3>Ground rules<\/h3>\n<ul>\n<li>Use a metronome or drum track for every exercise.<\/li>\n<li>Move on when you can play the goal cleanly about 4 times out of 5. Perfection is not the bar; you will revisit everything later.<\/li>\n<li>If you fall behind, slip the schedule rather than skipping. The four review weeks double as catch-up buffers.<\/li>\n<li>Keep a running \"maintenance\" list. Old topics rotate through your warm-up so they do not fade.<\/li>\n<\/ul>"], ["Daily 60 minute routine", "<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Block<\/th>\n<th>Minutes<\/th>\n<th>What to do<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Warm-up<\/td>\n<td>5<\/td>\n<td>Hand stretches, then a chromatic finger exercise at a comfortable tempo<\/td>\n<\/tr>\n<tr>\n<td>Technique<\/td>\n<td>15<\/td>\n<td>This week's technique item, or your current speed exercise, with the metronome<\/td>\n<\/tr>\n<tr>\n<td>Theory and fretboard<\/td>\n<td>10<\/td>\n<td>Note naming, scale or chord shapes, or the week's theory topic away from the guitar<\/td>\n<\/tr>\n<tr>\n<td>Main focus<\/td>\n<td>20<\/td>\n<td>This week's focus from the phase tables<\/td>\n<\/tr>\n<tr>\n<td>Play<\/td>\n<td>10<\/td>\n<td>Apply it to music: a backing track, a song, or improvising. Record a short clip<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Short on time? 30 minute version:<\/strong> 5 warm-up, 15 main focus, 10 play. Do this rather than skipping the day.<\/p>\n<p><strong>Maintenance:<\/strong> once a week, swap the warm-up for one item from an earlier phase.<\/p>"]], "routine": [["Warm-up", 5, "Hand stretches, then a chromatic finger exercise at a comfortable tempo"], ["Technique", 15, "This week's technique item, or your current speed exercise, with the metronome"], ["Theory and fretboard", 10, "Note naming, scale or chord shapes, or the week's theory topic away from the guitar"], ["Main focus", 20, "This week's focus from the phase tables"], ["Play", 10, "Apply it to music: a backing track, a song, or improvising. Record a short clip"]], "bt": {"g-pop": {"name": "G pop progression (I V vi IV)", "style": "rock", "bpm": 80, "bars": ["G", "D", "Em", "C"]}, "g-cdg": {"name": "G, C, D, G", "style": "rock", "bpm": 70, "bars": ["G", "C", "D", "G"]}, "autumn": {"name": "Autumn Leaves changes", "style": "swing", "bpm": 100, "bars": ["Cm7", "F7", "Bbmaj7", "Ebmaj7", "Am7b5", "D7", "Gm7", "Gm7"]}, "slow-am": {"name": "Slow Am, F, C, G for swells", "style": "ballad", "bpm": 60, "bars": ["Am", "F", "C", "G"]}, "am-jam": {"name": "A minor jam", "style": "rock", "bpm": 85, "bars": ["Am", "F", "G", "Am"]}, "a-ionian": {"name": "A Ionian vamp", "style": "ballad", "bpm": 76, "bars": ["Amaj7", "Amaj7", "Dmaj7", "Dmaj7"]}, "a-dorian": {"name": "A Dorian vamp", "style": "rock", "bpm": 92, "bars": ["Am7", "Am7", "D7", "D7"]}, "a-mixo": {"name": "A Mixolydian vamp", "style": "rock", "bpm": 96, "bars": ["A", "A", "G", "G"]}, "a-lydian": {"name": "A Lydian vamp", "style": "ballad", "bpm": 72, "bars": ["A", "A", "B", "B"]}, "a-phryg": {"name": "A Phrygian vamp", "style": "rock", "bpm": 88, "bars": ["Am", "Am", "Bb", "Bb"]}, "a-aeol": {"name": "A Aeolian vamp", "style": "rock", "bpm": 90, "bars": ["Am", "F", "G", "Am"]}, "ii-v-i-vi": {"name": "ii V I vi in C", "style": "swing", "bpm": 100, "bars": ["Dm7", "G7", "Cmaj7", "Am7"]}, "dm-g7"
